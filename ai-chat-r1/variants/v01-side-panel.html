<!doctype html>
<html lang="en"><head>
<script type="application/json" id="lab-meta">{"id":"v01","name":"Side panel","axis":"docked conversation","idea":"A steady conversation beside the draft, with changes connected to the canvas.","cost":"A narrower page canvas and a scrolling thread.","model":"gpt-6-astra","round":1,"parents":[]}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Side panel</title>
<link rel="stylesheet" href="../kit/app.css"><link rel="stylesheet" href="../kit/journey.css">
<script src="../kit/dom.js"></script><script src="../kit/fixtures.js"></script><script src="../kit/shell.js"></script>
<style>
.v01-body{margin:0;font-family:var(--font-sans);color:var(--foreground);background:var(--background);font-variant-numeric:tabular-nums}.v01-app{width:calc(100% - 400px);height:100dvh;overflow:hidden}.v01-app.v01-closed{width:100%}.v01-panel{position:fixed;inset:0 0 0 auto;width:400px;background:var(--background);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:40;font-size:13px;line-height:1.5}.v01-panel[hidden]{display:none}.v01-head{height:55px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 16px;border-bottom:1px solid var(--border)}.v01-head strong{flex:1;font-size:14px;font-weight:600}.v01-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--background);padding:6px 10px;cursor:pointer;font:inherit;color:var(--foreground)}.v01-btn:hover{background:var(--accent)}.v01-icon{border:0;padding:7px;background:transparent}.v01-panel svg,.v01-toggle svg{width:16px;height:16px;flex-shrink:0}.v01-panel button:focus-visible,.v01-panel summary:focus-visible,.v01-panel a:focus-visible,.v01-toggle:focus-visible{outline:2px solid var(--ring);outline-offset:2px}.v01-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.v01-primary:hover{opacity:.85;background:var(--primary)}.v01-scroll{flex:1;min-height:0;overflow:auto;padding:24px 20px;scrollbar-width:thin}.v01-message{margin-bottom:22px}.v01-user{display:flex;justify-content:flex-end}.v01-user .v01-bubble{max-width:90%;background:var(--muted);padding:10px 13px;border-radius:var(--radius)}.v01-assistant .v01-bubble{padding:0}.v01-tools{margin:10px 0;color:var(--muted-foreground);font-size:12px}.v01-tools summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;padding:4px 0}.v01-tools summary:hover{color:var(--foreground)}.v01-tools summary::after{content:'›';margin-left:auto}.v01-tools[open]>summary::after{content:'⌄'}.v01-steps{border-left:1px solid var(--border);padding-left:12px;margin:4px 0 12px 7px}.v01-detail{padding:4px 0 8px 23px;overflow-wrap:anywhere}.v01-detail pre{white-space:pre-wrap;font-size:11px;margin-top:8px}.v01-changes{margin-top:12px;border-top:1px solid var(--border);padding-top:6px}.v01-change{display:flex;width:100%;justify-content:space-between;text-align:left;border:0;background:transparent;padding:6px 0;color:var(--foreground);cursor:pointer;font:inherit}.v01-change:hover{color:var(--primary)}.v01-diff{font-size:12px;padding:4px 0 8px 22px}.v01-diff del{display:block;color:var(--muted-foreground);margin-bottom:4px}.v01-diff ins{text-decoration:none;display:block}.v01-change-label{display:flex;align-items:center;gap:7px}.v01-undo{margin-top:8px;font-size:12px}.v01-mark{outline:2px solid var(--ring)!important;outline-offset:5px}.v01-footer{padding:12px 16px 14px;border-top:1px solid var(--border);background:var(--background)}.v01-composer{border:1px solid var(--input);border-radius:var(--radius);padding:10px;background:var(--card)}.v01-composer:focus-within{outline:2px solid var(--ring);outline-offset:1px}.v01-input{display:block;resize:none;border:0;outline:none;background:transparent;color:var(--foreground);font:inherit;width:100%;height:72px;line-height:1.55}.v01-input::placeholder{color:var(--muted-foreground)}.v01-compose-actions{display:flex;align-items:center;gap:6px;margin-top:6px}.v01-key{margin-left:auto;font-size:11px;color:var(--muted-foreground)}.v01-note{font-size:11px;color:var(--muted-foreground);margin-top:10px;line-height:1.5}.v01-attach{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:5px 7px;border:1px solid var(--border);border-radius:calc(var(--radius) - 3px);margin:8px 0 0;max-width:100%;overflow-wrap:anywhere}.v01-attach summary{cursor:pointer}.v01-welcome{display:flex;flex-direction:column;height:100%;justify-content:center;align-items:flex-start;padding-bottom:45px}.v01-welcome h2{font-size:20px;font-weight:600;margin:16px 0 22px;letter-spacing:-.02em}.v01-welcome>svg{width:23px;height:23px;color:var(--muted-foreground)}.v01-suggestions{display:grid;gap:8px;width:100%}.v01-suggestions button{justify-content:flex-start;padding:10px 12px}.v01-approval{border:1px solid var(--border);border-radius:var(--radius);padding:16px}.v01-approval h3{font-weight:600;font-size:14px;margin:0 0 8px}.v01-facts{font-size:12px;color:var(--muted-foreground);padding:12px 0;display:grid;gap:6px;overflow-wrap:anywhere}.v01-row{display:flex;gap:8px}.v01-stats{margin-top:15px}.v01-stat{padding:13px 0;border-top:1px solid var(--border)}.v01-stat strong{font-weight:600}.v01-stat small{display:block;color:var(--muted-foreground);margin-top:3px;font-size:12px}.v01-stat-top{display:flex;justify-content:space-between;gap:12px}.v01-stat-bar{height:3px;background:var(--muted);margin:9px 0}.v01-stat-bar span{display:block;height:100%;background:var(--muted-foreground)}.v01-history{padding:12px 16px;border-bottom:1px solid var(--border);display:grid;gap:6px}.v01-history[hidden]{display:none}.v01-status{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--background);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px}.v01-app [data-slot="preview-panel"]{position:relative}.v01-app main{min-width:0}.v01-app [data-slot="journey-preview"]{max-width:100%}.v01-mobile-back{display:none}.v01-link{color:var(--primary);overflow-wrap:anywhere}.v01-app.v01-home header{flex-wrap:wrap;height:auto;min-height:72px}
@media(max-width:700px){.v01-panel{width:100%;border:0}.v01-app{width:100%}.v01-mobile-back{display:inline-flex}.v01-mobile-back svg{transform:rotate(180deg)}.v01-scroll{padding:20px}.v01-head{padding:0 12px}.v01-app [data-slot="page-header-actions"]{gap:4px}.v01-app [data-slot="page-title"]{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v01-app [data-slot="page-title"] span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v01-toggle{font-size:12px}.v01-app.v01-home [data-slot="sidebar"]{display:none}.v01-app.v01-home main{margin-left:0!important}.v01-footer{padding-bottom:18px}}
</style></head><body class="v01-body"><div id="app" class="v01-app" data-part="app"></div><script>
const C=Kit.copy,F=KIT_FIXTURES;const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ic=n=>Kit.icon(n);let refs,panel,screen,attachments=[];
const button=(label,icon,act,cls='')=>`<button class="v01-btn ${cls}" title="${e(label)}" aria-label="${e(label)}" data-action="${act}">${icon?ic(icon):''}${cls.includes('v01-icon')?'':e(label)}</button>`;
function attachment(a){return `<details class="v01-attach" data-slot="attachment"><summary>${e(a.label)}</summary><span>${e(a.detail||'')}</span></details>`}
function msg(m,i){return `<article class="v01-message v01-${m.role}" data-slot="message" data-align="${m.role==='user'?'end':'start'}"><div class="v01-bubble" data-slot="bubble" data-variant="${m.role==='user'?'secondary':'ghost'}">${m.text?`<p>${e(m.text)}</p>`:''}${(m.attachments||[]).map(attachment).join('')}${m.steps?`<details class="v01-tools" data-slot="marker" ${m.streaming?'open':''}><summary>${ic(m.streaming?'loader':'check')}<span ${m.streaming?'role="status"':''}>${m.streaming?C.toolLabel('pages_generate','running'):C.stepsDone(m.steps.length,Math.round(m.steps.reduce((a,s)=>a+s.seconds,0)))}</span></summary><div class="v01-steps">${m.steps.map(s=>`<details class="v01-tools" data-slot="marker"><summary ${s.status==='running'?'role="status"':''}>${ic(s.status==='done'?'check':'loader')}${e(C.toolLabel(s.tool,s.status))}<span>${s.seconds}s</span></summary><div class="v01-detail">${e(s.detail)}${s.result?`<pre>${e(JSON.stringify(s.result,null,2))}</pre>`:''}</div></details>`).join('')}</div></details>`:''}${m.changes?`<div class="v01-changes">${m.changes.map(c=>`<button class="v01-change" data-block="${c.block}"><span class="v01-change-label">${ic('check')}${e(c.label)}</span>${ic('chevronRight')}</button>${c.before?`<div class="v01-diff"><del>${e(c.before)}</del><ins>${e(c.after)}</ins></div>`:c.after?`<div class="v01-diff">${e(c.after)}</div>`:''}`).join('')}${m.undo?button(C.undo,'undo','undo','v01-undo'):''}</div>`:''}${m.approval?`<div class="v01-approval"><h3>${e(m.approval.title)}</h3><p>${e(m.approval.summary)}</p><div class="v01-facts">${m.approval.facts.map(f=>`<span>${e(f)}</span>`).join('')}</div><div class="v01-row">${button(C.approve,null,'publish','v01-primary')}${button(C.deny,null,'deny')}</div></div>`:''}${m.stats?`<div class="v01-stats">${m.stats.map(s=>`<div class="v01-stat"><div class="v01-stat-top"><strong>${e(s.lead||s.page)}</strong><span>${s.views} views</span></div>${s.lead?`<small>${e(s.page)}</small>`:''}<div class="v01-stat-bar"><span style="width:${s.watched}"></span></div><small>${s.watched} watched · ${e(s.action)}</small>${s.when?`<small>${e(s.when)}</small>`:''}</div>`).join('')}</div>`:''}</div></article>`}
function toggle(open){panel.hidden=!open;document.querySelector('#app').classList.toggle('v01-closed',!open);refs.aiButton?.setAttribute('aria-expanded',String(open))}
function render(){screen=location.hash.slice(1)||'empty';if(!F.conversation[screen])screen='empty';const state=F.conversation[screen],app=document.querySelector('#app');document.querySelector('.v01-panel')?.remove();app.className='v01-app'+(screen==='home'?' v01-home':'');refs=screen==='home'?Kit.home(app):Kit.editor(app,{page:state.page,popover:false});attachments=[];
if(!refs.aiButton){const b=document.createElement('button');b.className='v01-btn v01-toggle';const record=[...app.querySelectorAll('button')].find(b=>b.textContent.includes('Record video'));record?.before(b);refs.aiButton=b}refs.aiButton.innerHTML=ic('panelRight')+' Clarity AI';refs.aiButton.onclick=()=>toggle(panel.hidden);refs.aiButton.setAttribute('aria-expanded','true');
panel=document.createElement('aside');panel.className='v01-panel';panel.dataset.part='chat';panel.setAttribute('aria-label',C.title);const messages=screen==='home'?state.messages.slice(0,-1):state.messages;
panel.innerHTML=`<header class="v01-head">${button('Back to page','chevronRight','close','v01-icon v01-mobile-back')}<strong>${C.title}</strong>${button(C.newChat,'plus','new','v01-icon')}${button(C.history,'history','history','v01-icon')}${button(C.close,'x','close','v01-icon')}</header><nav class="v01-history" hidden>${button(F.page.name,'message','review')}${button(F.conversation.home.messages[0].text,'chart','home')}</nav><div class="v01-scroll" data-slot="message-scroller">${screen==='empty'?`<div class="v01-welcome">${ic('message')}<h2>What would you like to make?</h2><div class="v01-suggestions">${state.suggestions.map(s=>button(s,'plus','suggest')).join('')}</div></div>`:messages.map(msg).join('')}</div><footer class="v01-footer"><div class="v01-composer" data-slot="composer"><div class="v01-attachments"></div><textarea class="v01-input" aria-label="Message Clarity AI" placeholder="${e(screen==='empty'?C.composerPlaceholderNew:screen==='home'?C.composerPlaceholderHome:C.composerPlaceholderEdit)}">${screen==='home'?e(state.messages.at(-1).text):''}</textarea><div class="v01-compose-actions">${button(C.attach,'paperclip','attach','v01-icon')}<span class="v01-key">⌘ Enter</span>${button(screen==='working'?C.stop:C.send,screen==='working'?'stop':'send',screen==='working'?'stop':'send','v01-primary v01-icon')}</div><input type="file" multiple hidden class="v01-file"></div><p class="v01-note">${C.disclaimer}</p></footer>`;document.body.append(panel);
if(screen==='working'){const status=document.createElement('div');status.className='v01-status';status.innerHTML=ic('pencil')+C.toolLabel('pages_generate','running');refs.canvas?.append(status)}
panel.onclick=ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close')toggle(false);if(a==='new'){if(screen==='empty')render();else location.hash='empty'}if(a==='history'){const h=panel.querySelector('.v01-history');h.hidden=!h.hidden}if(a==='review'||a==='home')location.hash=a;if(a==='suggest'){panel.querySelector('textarea').value=b.textContent.trim();panel.querySelector('textarea').focus()}if(a==='attach')panel.querySelector('.v01-file').click();if(a==='send')send();if(a==='stop'){panel.querySelector('[role="status"]').textContent='Stopped';document.querySelector('.v01-status')?.remove();b.dataset.action='send';b.title=C.send;b.setAttribute('aria-label',C.send);b.innerHTML=ic('send')}if(a==='undo'){refs.blocks.title.textContent=F.page.title;refs.blocks['faq-added']?.remove();b.closest('.v01-changes').innerHTML='<p class="v01-note">Changes undone</p>'}if(a==='deny')b.closest('.v01-approval').innerHTML='<p>Not published. Your changes are still in the draft.</p>';if(a==='publish'){const after=state.messages.find(m=>m.after).after;b.closest('.v01-approval').innerHTML=`<p>${e(after.text)}</p><div class="v01-facts"><a class="v01-link" href="https://${e(after.link)}" target="_blank" rel="noopener">${e(after.link)}</a></div>${button(C.copyLink,'copy','copy')}`}if(a==='copy'){navigator.clipboard?.writeText('https://'+F.page.url).then(()=>{b.textContent='Copied'}).catch(()=>{b.textContent=F.page.url})}};
panel.querySelectorAll('[data-block]').forEach(b=>{const el=refs.blocks[b.dataset.block];b.onmouseenter=()=>el?.classList.add('v01-mark');b.onmouseleave=()=>el?.classList.remove('v01-mark');b.onclick=()=>{if(innerWidth<=700)toggle(false);el?.scrollIntoView({block:'center',behavior:'instant'});el?.classList.add('v01-mark');setTimeout(()=>el?.classList.remove('v01-mark'),1800)}});
const input=panel.querySelector('textarea');input.onkeydown=ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'){ev.preventDefault();send()}};input.onpaste=ev=>{const t=ev.clipboardData.getData('text');if(t.length>500){ev.preventDefault();attachments.push({label:'Pasted text',detail:t});drawAttachments()}};panel.querySelector('.v01-file').onchange=ev=>addFiles(ev.target.files);panel.querySelector('.v01-composer').ondragover=ev=>ev.preventDefault();panel.querySelector('.v01-composer').ondrop=ev=>{ev.preventDefault();addFiles(ev.dataTransfer.files)};if(screen==='empty')input.focus();if(screen==='review')panel.querySelector('.v01-scroll').scrollTop=100000;
}
function drawAttachments(){panel.querySelector('.v01-attachments').innerHTML=attachments.map(attachment).join('')}
function addFiles(files){for(const f of files)attachments.push({label:f.name,detail:'Attached file'});drawAttachments()}
function send(){const input=panel.querySelector('textarea');if(!input.value.trim()&&!attachments.length)return;const sc=panel.querySelector('.v01-scroll');sc.querySelector('.v01-welcome')?.remove();sc.insertAdjacentHTML('beforeend',msg({role:'user',text:input.value,attachments}));input.value='';attachments=[];drawAttachments();sc.scrollTop=sc.scrollHeight}
render();addEventListener('hashchange',render);
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
