<script>
const F=KIT_FIXTURES,C=Kit.copy,I=n=>Kit.icon(n,'v05-icon'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,cls='')=>`<button class="v05-btn ${cls}" ${action?`data-action="${action}"`:''}>${label}</button>`;
function render(){
const screen=F.conversation[location.hash.slice(1)]?location.hash.slice(1):'empty',data=F.conversation[screen],home=screen==='home',app=document.getElementById('app');
app.className='v05-app'+(home?' v05-home':'');let r=home?Kit.home(app):Kit.editor(app,{page:data.page,popover:false}),scope=home?'All pages':'Whole page',stopped=false,attachments=[];
let openButton=r.aiButton;if(!openButton){openButton=document.createElement('button');openButton.className='v05-btn';r.actions.append(openButton)}openButton.innerHTML=I('message')+' Ask';openButton.onclick=()=>toggle(false);
const rail=document.createElement('aside');rail.className='v05-rail';rail.dataset.part='chat';rail.setAttribute('aria-label',C.title);rail.innerHTML=`<div class="v05-head"><strong>${C.title}</strong>${button(I('panelRight')+' Hide','close','v05-quiet')}</div><div class="v05-scroll" data-slot="message-scroller"></div><div class="v05-compose" data-slot="composer">${button(I(home?'page':'pencil')+' <span class="v05-scope-label">'+scope+'</span> '+I('x'),'reset','v05-scope')}<div class="v05-files"></div><textarea class="v05-text" aria-label="Message" placeholder="${esc(home?C.composerPlaceholderHome:screen==='empty'?C.composerPlaceholderNew:C.composerPlaceholderEdit)}"></textarea><div class="v05-compose-foot">${button(I('paperclip'),'attach','v05-quiet')}<span class="v05-hint">⌘ Enter</span>${button(I(screen==='working'?'stop':'send'),screen==='working'?'stop':'send','v05-primary')}</div><input type="file" multiple hidden></div>`;app.append(rail);
const scroll=rail.querySelector('.v05-scroll'),text=rail.querySelector('textarea');rail.querySelector('[data-action="attach"]').ariaLabel=C.attach;rail.querySelector('[data-action="send"],[data-action="stop"]').ariaLabel=screen==='working'?C.stop:C.send;
function toggle(closed){app.classList.toggle('v05-closed',closed);openButton.setAttribute('aria-expanded',String(!closed))}
function select(key,label){scope=label;rail.querySelector('.v05-scope-label').textContent=label;toggle(false);app.querySelectorAll('.v05-selected').forEach(x=>x.classList.remove('v05-selected'));const block=r.blocks?.[key];if(block){block.classList.add('v05-selected');block.scrollIntoView({block:'center',behavior:'instant'})}text.focus({preventScroll:true})}
const number={title:1,video:2,cta:3,pricing:4,faq:5,'faq-added':6};
function message(m){const el=document.createElement('div');el.className='v05-message';el.dataset.slot='message';el.innerHTML=`<div data-slot="bubble" class="${m.role==='user'?'v05-user':''}">${m.text?`<p>${esc(m.text)}</p>`:''}${(m.attachments||[]).map(a=>`<details class="v05-attachment" data-slot="attachment"><summary>${esc(a.label)}</summary>${esc(a.detail)}</details>`).join('')}</div>${m.steps?`<div class="v05-steps">${m.steps.map(s=>`<details class="v05-step ${s.status==='running'?'v05-running':''}" data-slot="marker"><summary ${s.status==='running'?'role="status" aria-live="polite"':''}>${I(s.status==='done'?'check':'loader')}<span>${C.toolLabel(s.tool,s.status)}</span><small>${s.seconds}s</small></summary><p>${esc(s.detail)}</p>${s.result?`<p>${esc(JSON.stringify(s.result))}</p>`:''}</details>`).join('')}</div>`:''}${m.changes?`<div class="v05-changes">${m.changes.map(ch=>button(`<span class="v05-number">${number[ch.block]}</span> ${esc(ch.label)}`,'block:'+ch.block,'v05-change')).join('')}</div>`:''}`;
if(m.stats){const stats=document.createElement('div');stats.innerHTML=m.stats.map(s=>`<div class="v05-stat">${button(esc(s.page),'page:'+s.page,'v05-quiet')}<p>${esc(s.lead||s.action)}</p><p>${s.views} views · ${s.watched} watched</p>${s.lead?`<p>${esc(s.action)} · ${esc(s.when)}</p>`:''}</div>`).join('');el.append(stats)}
if(m.approval){const card=document.createElement('div');card.className='v05-approval';card.innerHTML=`<strong>${esc(m.approval.title)}</strong><p>${esc(m.approval.summary)}</p><ul>${m.approval.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul><div class="v05-row">${button(C.approve,'publish','v05-primary')}${button(C.deny,'deny')}</div>`;el.append(card);card.addEventListener('click',async e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='publish'){card.innerHTML=`<p>${esc(m.after.text)}</p><p><a class="v05-link" href="https://${m.after.link}" target="_blank">${esc(m.after.link)}</a></p><div class="v05-row">${button(I('copy')+C.copyLink,'copy')}</div>`}if(a==='deny')card.innerHTML='<p class="v05-note">Not published. Your changes are saved in the draft.</p>';if(a==='copy'){await navigator.clipboard.writeText('https://'+m.after.link);e.target.closest('button').textContent='Copied'}})}scroll.append(el)}
if(screen==='empty')scroll.innerHTML=`<div class="v05-empty"><h2>What are we making?</h2><div class="v05-suggestions">${data.suggestions.map(s=>button(esc(s)+I('chevronRight'),'suggest:'+s)).join('')}</div><p class="v05-disclaimer">${C.disclaimer}</p></div>`;else data.messages.slice(0,home?-1:undefined).forEach(message);
if(home)text.value=data.messages.at(-1).text;
if(!home){if(!r.blocks.title)r.blocks.title=r.preview.querySelector('h1');if(data.page==='blank'){r.blocks.title.textContent='Page title...';r.blocks.title.removeAttribute('data-ghost')}if(!r.blocks.video)r.blocks.video=r.preview.querySelector('[data-slot="empty-block-slot"]');
for(const [key,block] of Object.entries(r.blocks)){if(key==='logo')continue;block.classList.add('v05-block');block.tabIndex=0;const label=key==='title'?'Title':key==='faq-added'?'Question added':key[0].toUpperCase()+key.slice(1);const ask=document.createElement('button');ask.className='v05-btn v05-ask';ask.textContent='Ask';ask.onclick=e=>{e.stopPropagation();select(key,label)};block.append(ask);block.addEventListener('click',e=>{if(!e.target.closest('button'))select(key,label)});block.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target===block){e.preventDefault();select(key,label)}});
if(data.page==='edited'){const pin=document.createElement('button');pin.className='v05-pin';pin.textContent=number[key];pin.ariaLabel='Change '+number[key]+': '+label;pin.onclick=e=>{e.stopPropagation();select(key,label)};block.append(pin)}}
if(screen==='review'){const suggestion=document.createElement('div');suggestion.className='v05-suggestion';suggestion.innerHTML=`<div class="v05-suggestion-head"><span>Title · Changed in draft</span>${button(I('undo')+C.undo,'undo')}</div><del>${esc(F.page.title)}</del><span>${esc(F.page.titleEdited)}</span>`;r.blocks.title.after(suggestion)}
if(screen==='working'){const status=document.createElement('div');status.className='v05-status';status.setAttribute('role','status');status.innerHTML=C.toolLabel('pages_generate','running')+'<br>'+esc(data.messages[1].steps[2].detail);r.blocks.title.after(status)}}
if(home){const cards=[...app.querySelectorAll('section.grid')].find(s=>s.children.length>3);if(cards){[...cards.children].forEach((card,i)=>{const stat=data.messages[1].stats[i];if(!stat)return;card.classList.add('v05-block');card.tabIndex=0;card.dataset.page=stat.page;const title=card.querySelector('[data-slot="media-card-title"]');if(title)title.textContent=stat.page;const ask=document.createElement('button');ask.className='v05-btn';ask.textContent='Ask';ask.onclick=e=>{e.preventDefault();e.stopPropagation();select('',stat.page);card.classList.toggle('v05-card-selected')};card.append(ask)})}}
function addFiles(files){attachments.push(...[...files].map(f=>f.name));renderFiles()}
function renderFiles(){rail.querySelector('.v05-files').innerHTML=attachments.map((a,i)=>button(I('file')+esc(a)+I('x'),'remove:'+i,'v05-attachment')).join('')}
function send(){if(!text.value.trim()&&!attachments.length)return;scroll.querySelector('.v05-empty')?.remove();message({role:'user',text:text.value,attachments:attachments.map(a=>({label:a,detail:a}))});text.value='';attachments=[];renderFiles();scroll.scrollTop=scroll.scrollHeight}
rail.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='close')toggle(true);if(a==='reset')select('',home?'All pages':'Whole page');if(a==='send')send();if(a==='attach')rail.querySelector('input').click();if(a.startsWith('remove:')){attachments.splice(+a.slice(7),1);renderFiles()}if(a.startsWith('suggest:')){text.value=a.slice(8);text.focus()}if(a.startsWith('block:'))select(a.slice(6),e.target.closest('button').textContent.replace(/^\d+\s*/,''));if(a.startsWith('page:')){select('',a.slice(5));app.querySelectorAll('[data-page]').forEach(c=>c.classList.toggle('v05-card-selected',c.dataset.page===a.slice(5)))}if(a==='stop'&&!stopped){stopped=true;rail.querySelector('.v05-running summary span').textContent='Stopped';app.querySelector('.v05-status').textContent='Stopped. Your draft has not changed.';const b=e.target.closest('button');b.dataset.action='send';b.innerHTML=I('send');b.ariaLabel=C.send}});
app.onclick=e=>{if(e.target.closest('[data-action="undo"]')){r.blocks.title.firstChild.textContent=F.page.title;r.blocks['faq-added']?.remove();app.querySelector('.v05-suggestion').innerHTML='<span>Changes undone. Previous title restored.</span>';rail.querySelectorAll('[data-action="block:faq-added"]').forEach(b=>b.remove())}};
text.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send()}});text.addEventListener('paste',e=>{const pasted=e.clipboardData.getData('text');if(pasted.length>500){e.preventDefault();attachments.push('Pasted text');renderFiles()}});rail.querySelector('input').onchange=e=>addFiles(e.target.files);rail.querySelector('.v05-compose').ondragover=e=>e.preventDefault();rail.querySelector('.v05-compose').ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};
if(screen==='empty')text.focus({preventScroll:true});if(screen==='review'||screen==='approve')scroll.scrollTop=scroll.scrollHeight;
}
render();addEventListener('hashchange',render);
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
