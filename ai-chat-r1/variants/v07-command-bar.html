{"id":"v07","name":"Command bar","axis":"placement","idea":"A keyboard-first command bar holds quick follow-ups, then tucks into a result pill to return the page to view.","cost":"Long conversations need scrolling and temporarily obscure the page.","model":"gpt-6-astra","round":1,"parents":[]}
</script>
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>v07 Command bar</title>
<link rel="stylesheet" href="../kit/app.css"><link rel="stylesheet" href="../kit/journey.css"><script src="../kit/dom.js"></script><script src="../kit/fixtures.js"></script><script src="../kit/shell.js"></script>
<style>
.v07-layer{font-family:var(--font-sans);color:var(--foreground);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}.v07-shade{position:fixed;inset:0;background:color-mix(in srgb,var(--foreground) 19%,transparent);z-index:40}.v07-bar{position:fixed;z-index:41;top:14vh;left:50%;transform:translateX(-50%);width:min(660px,calc(100vw - 32px));max-height:77vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 40px color-mix(in srgb,var(--foreground) 12%,transparent)}.v07-head{display:flex;align-items:center;gap:8px;padding:12px 18px;color:var(--muted-foreground);font-size:12px}.v07-head strong{color:var(--foreground);font-weight:600}.v07-context{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v07-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:6px 10px;min-height:32px;background:transparent;color:var(--foreground);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);cursor:pointer;font:inherit;font-size:12px}.v07-button:hover,.v07-suggestion:hover,.v07-step summary:hover{background:var(--accent)}.v07-button:focus-visible,.v07-suggestion:focus-visible,.v07-step summary:focus-visible,.v07-input:focus-visible,.v07-link:focus-visible{outline:2px solid var(--ring);outline-offset:2px}.v07-icon{width:16px;height:16px;flex-shrink:0}.v07-plain{border-color:transparent}.v07-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.v07-primary:hover{background:color-mix(in srgb,var(--primary) 88%,var(--foreground))}.v07-compose{padding:4px 18px 14px;border-bottom:1px solid var(--border);flex-shrink:0}.v07-input{resize:none;display:block;width:100%;min-height:62px;background:transparent;color:var(--foreground);border:0;border-radius:calc(var(--radius) - 2px);padding:8px 2px;font:inherit;font-size:16px;line-height:1.5}.v07-input::placeholder{color:var(--muted-foreground)}.v07-controls{display:flex;align-items:center;gap:8px;margin-top:7px}.v07-hint{font-size:11px;color:var(--muted-foreground);margin-left:auto}.v07-scroll{overflow:auto;overscroll-behavior:contain;padding:0 20px;min-height:0}.v07-message{padding:18px 0;border-bottom:1px solid var(--border)}.v07-message:last-child{border-bottom:0}.v07-user{margin-left:34px}.v07-user [data-slot=bubble]{background:var(--muted);border-radius:calc(var(--radius) - 2px);padding:10px 12px}.v07-role{font-size:11px;color:var(--muted-foreground);margin-bottom:5px}.v07-message p{margin:0}.v07-step{font-size:12px;color:var(--muted-foreground);margin:6px 0}.v07-step summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;padding:3px 0;border-radius:calc(var(--radius) - 2px)}.v07-step summary::-webkit-details-marker{display:none}.v07-step time{margin-left:auto}.v07-detail{padding:6px 24px;overflow-wrap:anywhere}.v07-detail pre{white-space:pre-wrap;font:11px/1.5 var(--font-sans);margin-top:6px}.v07-running{color:var(--foreground)}.v07-changes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.v07-change{display:block;text-align:left;max-width:100%}.v07-diff{display:block;padding-top:5px;font-size:12px}.v07-diff del{display:block;color:var(--muted-foreground)}.v07-diff ins{display:block;text-decoration:none}.v07-foot{padding:10px 18px;border-top:1px solid var(--border);color:var(--muted-foreground);font-size:11px;flex-shrink:0}.v07-suggestions{padding:12px 0}.v07-suggestion{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-radius:calc(var(--radius) - 2px);padding:12px;cursor:pointer;color:var(--foreground);font:inherit}.v07-suggestion span{margin-left:auto;color:var(--muted-foreground)}.v07-attachment{margin-top:8px;display:inline-flex;gap:7px;align-items:center;font-size:12px}.v07-approval{padding:14px 0}.v07-approval h3{font-size:16px;font-weight:600;margin-bottom:6px}.v07-facts{font-size:12px;color:var(--muted-foreground);margin:12px 0;overflow-wrap:anywhere}.v07-actions{display:flex;gap:8px;margin-top:12px}.v07-link{color:var(--primary);overflow-wrap:anywhere}.v07-stats{margin-top:14px}.v07-stat{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:10px;padding:8px 0;border-top:1px solid var(--border)}.v07-stat small{display:block;color:var(--muted-foreground);font-size:11px}.v07-meter{height:3px;background:var(--muted);margin:6px 0}.v07-meter span{display:block;height:100%;background:var(--primary)}.v07-pill{position:fixed;bottom:24px;right:24px;z-index:39;display:flex;max-width:calc(100vw - 32px);padding:6px;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px color-mix(in srgb,var(--foreground) 8%,transparent)}.v07-pill .v07-result{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;min-width:0}.v07-hidden{display:none!important}.v07-highlight{outline:3px solid var(--ring);outline-offset:8px}.v07-trigger{margin-left:12px}.v07-notice{position:fixed;bottom:24px;left:90px;z-index:35;padding:8px 12px;background:var(--card);color:var(--muted-foreground);border:1px solid var(--border);border-radius:var(--radius);font:12px var(--font-sans)}
@media(max-width:600px){.v07-shade{background:var(--card)}.v07-bar{inset:0;transform:none;width:100%;max-height:none;border-radius:0;height:var(--v07-sheet-height,100dvh)}.v07-head{order:0;padding:12px}.v07-scroll{order:1;flex:1;padding:0 16px}.v07-compose{order:2;border-top:1px solid var(--border);border-bottom:0;padding:10px 14px}.v07-foot{order:3;padding:8px 14px max(12px,env(safe-area-inset-bottom))}.v07-context{max-width:150px}.v07-user{margin-left:16px}.v07-hint{font-size:10px}.v07-pill{right:16px;bottom:16px}.v07-notice{left:16px;bottom:80px}.v07-host{max-width:100vw;overflow:hidden}.v07-host header{min-width:0}.v07-host [data-slot=page-title]{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px}.v07-host [data-slot=page-title] span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v07-host [data-slot=page-header-actions]{gap:4px}.v07-host [data-slot=page-header-actions] button{padding-left:6px;padding-right:6px}.v07-trigger{margin-left:0}}
</style></head><body><div id="app" class="v07-host" data-part="app"></div><div id="v07-layer" class="v07-layer"></div>
<script>
const F=KIT_FIXTURES,C=Kit.copy;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=n=>Kit.icon(n,'v07-icon');let refs,screen,stopped=false,undone=false;const layer=document.getElementById('v07-layer');
function button(text,action,cls=''){return `<button class="v07-button ${cls}" data-action="${action}">${text}</button>`}
function attachment(a){return `<details class="v07-attachment" data-slot="attachment"><summary>${esc(a.label)}</summary><span>${esc(a.detail)}</span></details>`}
function message(m,i){return `<article class="v07-message ${m.role==='user'?'v07-user':''}" data-slot="message"><div class="v07-role">${m.role==='user'?'You':C.title}</div><div data-slot="bubble">${m.text?`<p>${esc(m.text)}</p>`:''}${(m.attachments||[]).map(attachment).join('')}</div>${(m.steps||[]).map(s=>`<details class="v07-step ${s.status==='running'?'v07-running':''}" data-slot="marker"><summary ${s.status==='running'?'role="status"':''}>${icon(s.status==='done'?'check':'loader')}<span class="${s.status==='running'?'shimmer':''}">${C.toolLabel(s.tool,s.status)}</span><time>${s.seconds}s</time>${icon('chevronDown')}</summary><div class="v07-detail">${esc(s.detail)}${s.result?`<pre>${esc(JSON.stringify(s.result,null,2))}</pre>`:''}</div></details>`).join('')}${m.changes?`<div class="v07-changes">${m.changes.map(c=>`<button class="v07-button v07-change" data-block="${c.block}">${c.label}${c.before?`<span class="v07-diff"><del>${esc(c.before)}</del><ins>${esc(c.after)}</ins></span>`:c.after?`<span class="v07-diff">${esc(c.after)}</span>`:''}</button>`).join('')}${m.undo?button(icon('undo')+C.undo,'undo'):''}</div>`:''}${m.approval?`<div class="v07-approval"><h3>${m.approval.title}</h3><p>${m.approval.summary}</p><div class="v07-facts">${m.approval.facts.map(esc).join('<br>')}</div><div class="v07-actions">${button(C.approve,'publish','v07-primary')}${button(C.deny,'deny')}</div></div>`:''}${m.stats?`<div class="v07-stats">${m.stats.map(s=>`<div class="v07-stat"><div>${esc(s.lead||s.page)}<small>${s.lead?esc(s.page):''}</small><small>${esc(s.action)}${s.when?' · '+esc(s.when):''}</small></div><div>${s.watched}<small>watched · ${s.views} views</small><div class="v07-meter"><span style="width:${s.watched}"></span></div></div></div>`).join('')}</div>`:''}</article>`}
function toggle(open){layer.querySelector('.v07-shade').classList.toggle('v07-hidden',!open);layer.querySelector('.v07-bar').classList.toggle('v07-hidden',!open);layer.querySelector('.v07-pill').classList.toggle('v07-hidden',open);if(open)layer.querySelector('textarea').focus();else document.querySelector('.v07-result').focus()}
function undo(){if(undone)return;undone=true;if(refs.blocks.title)refs.blocks.title.textContent=F.page.title;refs.blocks['faq-added']?.remove();layer.querySelectorAll('[data-action=undo]').forEach(b=>{b.textContent='Undone';b.disabled=true});layer.querySelectorAll('[data-block="faq-added"]').forEach(b=>b.disabled=true);layer.querySelector('.v07-result').textContent='Changes undone';}
function send(){const input=layer.querySelector('textarea');if(!input.value.trim()&&!layer.querySelector('#v07-att').children.length)return;const sc=layer.querySelector('.v07-scroll');sc.querySelector('.v07-suggestions')?.remove();sc.insertAdjacentHTML('beforeend',message({role:'user',text:input.value,attachments:[...layer.querySelector('#v07-att').children].map(e=>({label:e.textContent,detail:'Attached'}))}));input.value='';layer.querySelector('#v07-att').innerHTML='';sc.scrollTop=sc.scrollHeight;}
function fitSheet(){let h=innerHeight;try{if(parent!==window)h=Math.min(h,parent.innerHeight)}catch{}layer.style.setProperty('--v07-sheet-height',h+'px')}addEventListener('resize',fitSheet);fitSheet();
function render(){screen=location.hash.slice(1)||'empty';if(!F.conversation[screen])screen='empty';stopped=false;undone=false;const d=F.conversation[screen];refs=screen==='home'?Kit.home(document.getElementById('app')):Kit.editor(document.getElementById('app'),{page:d.page,popover:false});let trigger=refs.aiButton;if(!trigger){trigger=document.createElement('button');trigger.className='v07-button v07-trigger';(refs.header||refs.main||refs.root).append(trigger)}trigger.innerHTML=icon('message')+' '+C.title+' <span>⌘K</span>';trigger.onclick=()=>toggle(true);let messages=d.messages,typed='';if(screen==='home'){typed=messages.at(-1).text;messages=messages.slice(0,-1)}
layer.innerHTML=`<div class="v07-shade" data-action="close"></div><section class="v07-bar" data-part="chat" role="dialog" aria-modal="true" aria-label="${C.title}"><header class="v07-head">${icon('message')}<strong>${C.title}</strong><span class="v07-context">${screen==='home'?'Home':screen==='empty'||screen==='working'?'Untitled Journey Page':F.page.name}</span>${button('Esc','close','v07-plain')}</header><div class="v07-compose" data-slot="composer"><textarea class="v07-input" aria-label="${C.title}" placeholder="${screen==='empty'?C.composerPlaceholderNew:screen==='home'?C.composerPlaceholderHome:C.composerPlaceholderEdit}">${typed}</textarea><div id="v07-att"></div><div class="v07-controls">${button(icon('paperclip'),'attach','v07-plain')}<input id="v07-files" type="file" multiple hidden><span class="v07-hint">⌘K to open · ⌘↵ to send</span>${button(icon(screen==='working'?'stop':'send')+(screen==='working'?C.stop:C.send),screen==='working'?'stop':'send','v07-primary')}</div></div><div class="v07-scroll" data-slot="message-scroller">${screen==='empty'?`<div class="v07-suggestions">${d.suggestions.map((s,i)=>`<button class="v07-suggestion" data-suggest="${i}">${icon(['page','file','users'][i])}${s}<span>${icon('chevronRight')}</span></button>`).join('')}</div>`:messages.map(message).join('')}</div><footer class="v07-foot">${C.disclaimer}</footer></section><div class="v07-pill v07-hidden">${button(screen==='working'?'Writing the page':screen==='empty'?C.title:screen==='home'?'Checked who opened it':'Draft updated','open','v07-result v07-plain')}${screen==='review'?button(icon('undo')+C.undo,'undo','v07-plain'):''}</div>`;
layer.querySelector('[data-action=attach]').setAttribute('aria-label',C.attach);layer.onclick=e=>{const block=e.target.closest('[data-block]');if(block){toggle(false);Object.values(refs.blocks).forEach(b=>b.classList.remove('v07-highlight'));const target=refs.blocks[block.dataset.block];target?.classList.add('v07-highlight');target?.scrollIntoView({block:'center',behavior:'instant'});return}const suggestion=e.target.closest('[data-suggest]');if(suggestion){layer.querySelector('textarea').value=F.conversation.empty.suggestions[suggestion.dataset.suggest];layer.querySelector('textarea').focus();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close')toggle(false);if(a==='open')toggle(true);if(a==='undo')undo();if(a==='send')send();if(a==='attach')layer.querySelector('#v07-files').click();if(a==='stop'){stopped=true;layer.querySelector('.v07-running summary').innerHTML=icon('stop')+'Stopped';b.dataset.action='send';b.innerHTML=icon('send')+C.send}if(a==='publish'){const after=F.conversation.approve.messages.at(-1).after;b.closest('.v07-approval').innerHTML=`<p>${after.text}</p><a class="v07-link" href="https://${after.link}" target="_blank" rel="noopener">${after.link}</a><div class="v07-actions">${button(icon('copy')+C.copyLink,'copy')}</div>`;layer.querySelector('.v07-result').textContent='Published'}if(a==='deny')b.closest('.v07-approval').innerHTML='<p>Not published. Your changes are saved in the draft.</p>';if(a==='copy'){navigator.clipboard.writeText('https://'+F.page.url).then(()=>b.textContent='Copied').catch(()=>b.textContent=F.page.url)}};
const input=layer.querySelector('textarea');input.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();send()}};input.onpaste=e=>{const text=e.clipboardData.getData('text');if(text.length>500){e.preventDefault();addAttachment('Pasted text',text)}};function addAttachment(label,detail){layer.querySelector('#v07-att').insertAdjacentHTML('beforeend',attachment({label,detail}))}layer.querySelector('#v07-files').onchange=e=>[...e.target.files].forEach(f=>addAttachment(f.name,f.type||'File'));const composer=layer.querySelector('.v07-compose');composer.ondragover=e=>e.preventDefault();composer.ondrop=e=>{e.preventDefault();[...e.dataTransfer.files].forEach(f=>addAttachment(f.name,f.type||'File'))};requestAnimationFrame(()=>{if(screen==='empty')input.focus();if(screen==='review'||screen==='approve'){const s=layer.querySelector('.v07-scroll');s.scrollTop=s.scrollHeight}});if(screen==='working'){const n=document.createElement('div');n.className='v07-notice';n.textContent='Writing the page · Draft';refs.root.append(n)}}
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toggle(layer.querySelector('.v07-bar').classList.contains('v07-hidden'))}if(e.key==='Escape')toggle(false);if(e.key==='Tab'&&!layer.querySelector('.v07-bar').classList.contains('v07-hidden')){const els=[...layer.querySelector('.v07-bar').querySelectorAll('button:not([disabled]),textarea,summary,a[href]')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});addEventListener('hashchange',render);render();
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
