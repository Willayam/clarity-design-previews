<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bottom dock</title>
<link rel="stylesheet" href="../kit/app.css"><link rel="stylesheet" href="../kit/journey.css"><script src="../kit/dom.js"></script><script src="../kit/fixtures.js"></script><script src="../kit/shell.js"></script>
<style>
.v04-app{height:100dvh;overflow:hidden}.v04-dock{position:fixed;z-index:40;bottom:20px;left:calc(50% + 32px);transform:translateX(-50%);width:min(720px,calc(100% - 96px));background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius);font:14px/1.5 var(--font-sans);font-variant-numeric:tabular-nums;overflow:hidden}.v04-home{left:calc(50% + 136px);width:min(720px,calc(100% - 304px))}.v04-top{height:44px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--border)}.v04-top strong{font-weight:600}.v04-context{color:var(--muted-foreground);font-size:12px;flex:1}.v04-icon{width:16px;height:16px;flex-shrink:0}.v04-dock button,.v04-dock summary,.v04-dock a{cursor:pointer}.v04-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:4px 9px;border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);background:var(--card);color:var(--foreground);font:inherit;font-size:12px}.v04-btn:hover,.v04-dock summary:hover{background:var(--accent)}.v04-dock :is(button,textarea,summary,a):focus-visible{outline:2px solid var(--ring);outline-offset:2px}.v04-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.v04-primary:hover{opacity:.85;background:var(--primary)}.v04-quiet{border-color:transparent;background:transparent}.v04-scroller{height:340px;overflow:auto;overscroll-behavior:contain;padding:18px 22px;scroll-padding:16px}.v04-message{margin-bottom:22px;min-width:0}.v04-message:last-child{margin-bottom:0}.v04-user{display:flex;flex-direction:column;align-items:flex-end}.v04-user .v04-bubble{max-width:85%;padding:10px 13px;background:var(--muted);border-radius:var(--radius)}.v04-bubble{overflow-wrap:anywhere}.v04-tools{margin:10px 0;color:var(--muted-foreground);font-size:12px}.v04-tool summary{display:flex;align-items:center;gap:8px;list-style:none;padding:5px 0}.v04-tool summary::-webkit-details-marker{display:none}.v04-tool summary .v04-time{margin-left:auto}.v04-tool[open] summary{color:var(--foreground)}.v04-detail{margin:4px 0 8px 24px;overflow-wrap:anywhere}.v04-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.v04-attachment{margin-top:8px;max-width:100%;text-align:left}.v04-diff{border-left:2px solid var(--border);padding-left:12px;margin-top:10px;font-size:13px}.v04-diff del{display:block;color:var(--muted-foreground);margin-bottom:4px}.v04-diff ins{text-decoration:none}.v04-compose{padding:12px 14px;border-top:1px solid var(--border)}.v04-compose textarea{display:block;resize:none;width:100%;height:52px;background:transparent;border:0;color:var(--foreground);font:14px/1.5 var(--font-sans);padding:2px;outline-offset:3px}.v04-compose textarea::placeholder{color:var(--muted-foreground)}.v04-composebar{display:flex;align-items:center;gap:8px;margin-top:8px}.v04-hint{flex:1;color:var(--muted-foreground);font-size:11px}.v04-status{display:none;flex:1;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v04-collapsed .v04-scroller{display:none}.v04-collapsed .v04-context{display:none}.v04-collapsed .v04-status{display:block}.v04-collapsed .v04-top{border:0}.v04-collapsed .v04-compose{padding-top:8px}.v04-empty .v04-scroller{height:auto;padding:14px}.v04-empty .v04-chips{margin:0}.v04-approval{padding:14px;border:1px solid var(--border);border-radius:var(--radius)}.v04-approval h3{font-weight:600;margin-bottom:4px}.v04-facts{font-size:12px;color:var(--muted-foreground);margin:10px 0;overflow-wrap:anywhere}.v04-notice{color:var(--muted-foreground);font-size:12px;margin-top:8px}.v04-stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:11px 0;border-bottom:1px solid var(--border)}.v04-stat small{display:block;color:var(--muted-foreground);font-size:12px}.v04-statvalue{text-align:right}.v04-highlight{outline:3px solid var(--ring)!important;outline-offset:6px}.v04-app [data-slot="preview-panel"]{padding-bottom:260px;scroll-padding-top:30px}.v04-app .v04-canvas-note{position:absolute;top:65px;right:24px;color:var(--muted-foreground);font:12px var(--font-sans)}.v04-dock a{color:var(--primary);text-decoration:underline;overflow-wrap:anywhere}
@media(max-width:600px){.v04-dock,.v04-home{left:0;bottom:0;transform:none;width:100%;border-radius:0;height:100dvh;display:flex;flex-direction:column}.v04-top{height:52px;flex-shrink:0}.v04-context{font-size:11px}.v04-scroller{height:auto;flex:1;padding:18px 16px}.v04-compose{padding:12px 14px max(16px,env(safe-area-inset-bottom));flex-shrink:0}.v04-collapsed{height:auto}.v04-empty .v04-scroller{display:flex;align-items:flex-end;flex:1;padding-bottom:22px}.v04-empty .v04-chips{flex-direction:column;align-items:flex-start}.v04-user .v04-bubble{max-width:92%}.v04-hint{font-size:10px}.v04-app [data-slot="preview-panel"]{padding-bottom:260px}.v04-app main[data-slot="sidebar-inset"]{min-width:0}.v04-app [data-slot="page-header-actions"]{gap:2px}.v04-app [data-slot="page-title"]{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}

.v04-dock.v04-collapsed .v04-scroller{display:none}.v04-detail pre,.v04-tool pre{white-space:pre-wrap;word-break:break-word}.v04-app nav span[aria-hidden="true"]{text-overflow:ellipsis}
@media(min-width:601px){.v04-home .v04-scroller{height:440px}}
</style></head><body><div id="app" class="v04-app" data-part="app"></div><script>
const F=KIT_FIXTURES,C=Kit.copy;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=n=>Kit.icon(n,'v04-icon');
function render(){
const screen=F.conversation[location.hash.slice(1)]?location.hash.slice(1):'empty',data=F.conversation[screen],app=document.getElementById('app');
const r=screen==='home'?Kit.home(app):Kit.editor(app,{page:data.page,popover:false});r.aiButton?.remove();
let stopped=false;const dock=document.createElement('section');dock.className='v04-dock'+(screen==='home'?' v04-home':'')+(screen==='empty'?' v04-empty':'');dock.dataset.part='chat';dock.setAttribute('aria-label',C.title);
function toolsHtml(steps){return `<div class="v04-tools">${steps.map(s=>`<details class="v04-tool" data-slot="marker" ${s.status==='running'?'role="status"':''}><summary>${icon(s.status==='done'?'check':'loader')}<span ${s.status==='running'?'class="shimmer"':''}>${C.toolLabel(s.tool,s.status)}</span><span class="v04-time">${s.seconds}s</span>${icon('chevronDown')}</summary><div class="v04-detail">${esc(s.detail)}${s.result?`<pre class="v04-detail">${esc(JSON.stringify(s.result,null,2))}</pre>`:''}</div></details>`).join('')}</div>`}
function message(m,i){return `<div class="v04-message ${m.role==='user'?'v04-user':''}" data-slot="message" data-align="${m.role==='user'?'end':'start'}"><div class="v04-bubble" data-slot="bubble">${esc(m.text)}${(m.attachments||[]).map(a=>`<details data-slot="attachment" class="v04-attachment"><summary class="v04-btn">${icon('file')}${esc(a.label)}</summary><div class="v04-notice">${esc(a.detail)}</div></details>`).join('')}</div>${m.steps?toolsHtml(m.steps):''}${m.changes?`<div class="v04-chips">${m.changes.map(c=>`<button class="v04-btn" data-block="${c.block}">${icon('check')}${esc(c.label)}</button>`).join('')}${m.undo?`<button class="v04-btn v04-quiet" data-undo>${icon('undo')}${C.undo}</button>`:''}</div>${m.changes.filter(c=>c.before).map(c=>`<div class="v04-diff"><del>${esc(c.before)}</del><ins>${esc(c.after)}</ins></div>`).join('')}`:''}${m.approval?`<div class="v04-approval"><h3>${esc(m.approval.title)}</h3><p>${esc(m.approval.summary)}</p><div class="v04-facts">${m.approval.facts.map(esc).join('<br>')}</div><div class="v04-chips"><button class="v04-btn v04-primary" data-publish>${C.approve}</button><button class="v04-btn" data-deny>${C.deny}</button></div></div>`:''}${m.stats?m.stats.map(s=>`<div class="v04-stat"><div>${esc(s.lead||s.page)}<small>${esc(s.lead?s.page:s.action)}</small><small>${esc(s.lead?s.action:'')}</small></div><div class="v04-statvalue">${s.views} views · ${s.watched}<small>${esc(s.when)}</small></div></div>`).join(''):''}</div>`}
const messages=screen==='home'?data.messages.slice(0,-1):data.messages;
dock.innerHTML=`<header class="v04-top">${icon('message')}<strong>${C.title}</strong><span class="v04-context">${screen==='home'?'Home':'Draft'}</span><span class="v04-status" role="status">${screen==='working'?C.toolLabel('pages_generate','running'):screen==='home'?'Your videos, pages and leads':'Changes saved to draft'}</span><button class="v04-btn v04-quiet" data-toggle aria-label="Collapse chat" aria-expanded="true">${icon('chevronDown')}</button></header><div class="v04-scroller" data-slot="message-scroller">${screen==='empty'?`<div class="v04-chips">${data.suggestions.map(s=>`<button class="v04-btn" data-suggest="${esc(s)}">${s}</button>`).join('')}</div>`:messages.map(message).join('')}</div><form class="v04-compose" data-slot="composer"><div data-attachments></div><textarea aria-label="Message Clarity AI" placeholder="${esc(screen==='empty'?C.composerPlaceholderNew:screen==='home'?C.composerPlaceholderHome:C.composerPlaceholderEdit)}">${screen==='home'?esc(data.messages.at(-1).text):''}</textarea><div class="v04-composebar"><button class="v04-btn v04-quiet" type="button" data-attach aria-label="${C.attach}">${icon('paperclip')}</button><input type="file" hidden multiple><span class="v04-hint">${screen==='empty'?C.disclaimer:'⌘ Enter to send'}</span><button class="v04-btn ${screen==='working'||screen==='approve'?'':'v04-primary'}" type="${screen==='working'?'button':'submit'}" data-send aria-label="${screen==='working'?C.stop:C.send}">${icon(screen==='working'?'stop':'send')}</button></div></form>`;app.append(dock);
const scroller=dock.querySelector('.v04-scroller'),input=dock.querySelector('textarea'),toggle=dock.querySelector('[data-toggle]');
function collapse(value){dock.classList.toggle('v04-collapsed',value);toggle.innerHTML=icon(value?'message':'chevronDown');toggle.setAttribute('aria-label',value?'Open chat':'Collapse chat');toggle.setAttribute('aria-expanded',String(!value))}
toggle.onclick=()=>collapse(!dock.classList.contains('v04-collapsed'));
dock.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>{input.value=b.dataset.suggest;input.focus()});
dock.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{const block=r.blocks[b.dataset.block];if(!block)return;collapse(true);app.querySelectorAll('.v04-highlight').forEach(n=>n.classList.remove('v04-highlight'));block.classList.add('v04-highlight');requestAnimationFrame(()=>{block.scrollIntoView({block:'start',behavior:'instant'});if(r.canvas)r.canvas.scrollTop-=30;});});
dock.querySelector('[data-undo]')?.addEventListener('click',e=>{r.blocks.title.textContent=F.page.title;r.blocks['faq-added']?.remove();e.currentTarget.disabled=true;e.currentTarget.textContent='Undone';dock.querySelector('.v04-diff').innerHTML=`<span>${esc(F.page.title)}</span>`;dock.querySelector('[data-block="faq-added"]')?.remove();dock.querySelector('.v04-status').textContent='Last changes undone';});
const approval=dock.querySelector('.v04-approval');dock.querySelector('[data-publish]')?.addEventListener('click',()=>{const after=data.messages.at(-1).after;approval.innerHTML=`<p>${esc(after.text)}</p><a href="https://${after.link}" target="_blank" rel="noopener">${esc(after.link)}</a><div class="v04-chips"><button class="v04-btn" data-copy>${icon('copy')}${C.copyLink}</button></div>`;approval.querySelector('[data-copy]').onclick=async e=>{const button=e.currentTarget;try{await navigator.clipboard.writeText('https://'+after.link);button.textContent='Copied'}catch{button.textContent='Select link to copy'}};dock.querySelector('.v04-status').textContent='Published';});dock.querySelector('[data-deny]')?.addEventListener('click',()=>{approval.innerHTML='<p class="v04-notice">Not published. Your changes stay in the draft.</p>'});
function attachment(label,detail){const d=document.createElement('details');d.className='v04-attachment';d.dataset.slot='attachment';d.innerHTML=`<summary class="v04-btn">${icon('file')}${esc(label)}</summary><div class="v04-notice">${esc(detail)}</div>`;dock.querySelector('[data-attachments]').append(d)}
input.addEventListener('paste',e=>{const t=e.clipboardData.getData('text/plain');if(t.length>500){e.preventDefault();attachment('Pasted text',t)}});const file=dock.querySelector('input[type=file]');dock.querySelector('[data-attach]').onclick=()=>file.click();file.onchange=()=>Array.from(file.files).forEach(f=>attachment(f.name,'Attached'));dock.ondragover=e=>e.preventDefault();dock.ondrop=e=>{e.preventDefault();Array.from(e.dataTransfer.files).forEach(f=>attachment(f.name,'Attached'))};
function send(e){e?.preventDefault();if(!input.value.trim())return;dock.classList.remove('v04-empty');collapse(false);const d=document.createElement('div');d.innerHTML=message({role:'user',text:input.value},0);const attachments=dock.querySelector('[data-attachments]');d.firstChild.append(...attachments.childNodes);scroller.append(d.firstChild);input.value='';scroller.scrollTop=scroller.scrollHeight}
dock.querySelector('form').onsubmit=send;input.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){send(e)}};if(screen==='working'){dock.querySelector('[data-send]').onclick=e=>{if(stopped){send();return}stopped=true;scroller.querySelector('[role=status]').innerHTML='<div class="v04-notice">Stopped. Your draft is unchanged.</div>';dock.querySelector('.v04-status').textContent='Stopped';e.currentTarget.innerHTML=icon('send');e.currentTarget.setAttribute('aria-label',C.send);};}
requestAnimationFrame(()=>{scroller.scrollTop=scroller.scrollHeight;if(screen==='empty')input.focus({preventScroll:true})});
}
render();addEventListener('hashchange',render);
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
