<header class="lab-top">
  <div class="lab-brand">
    <strong>Home banners lab</strong>
    <span class="lab-sub" id="lab-sub"></span>
  </div>
  <nav class="lab-stages" aria-label="Stage">
    <button type="button" data-stage="home" class="is-active">1. Home</button>
    <button type="button" data-stage="admin">2. Admin</button>
  </nav>
  <nav class="lab-views" aria-label="Views">
    <button type="button" data-view="mixer" class="is-active">Mixer</button>
    <button type="button" data-view="gallery">Gallery</button>
  </nav>
  <div class="lab-tools">
    <div class="seg" role="group" aria-label="Time" data-dim="time"></div>
    <div class="seg" role="group" aria-label="Audience" data-dim="audience"></div>
    <button type="button" class="tool" id="fail-next" title="The next Save in any frame fails" aria-pressed="false"><svg><use href="#i-bolt"/></svg><span>Fail next save</span></button>
    <button type="button" class="tool" id="show-again" title="Bring dismissed banners back"><svg><use href="#i-eye"/></svg><span>Show again</span></button>
    <button type="button" class="tool" id="reset-data" title="Put the mock data back"><svg><use href="#i-rotate"/></svg><span>Reset data</span></button>
    <button type="button" class="tool" id="theme-toggle" title="Switch app theme"><svg><use href="#i-sun"/></svg><span>Dark</span></button>
    <button type="button" class="tool" id="shuffle" title="Random valid combination for this stage"><svg><use href="#i-shuffle"/></svg><span>Shuffle</span></button>
    <button type="button" class="tool tool-primary" id="copy-link" title="Copy a link to this exact combination"><svg><use href="#i-link"/></svg><span>Copy link</span></button>
  </div>
</header>

<main id="app">
  <section id="view-mixer" class="view">
    <div class="mixer">
      <aside class="controls" id="controls"></aside>
      <div class="stage" id="stage">
        <div class="stage-block" data-stage="home">
          <div class="stage-label">Home, desktop 1440 px. Dismiss works. Scroll inside the frame.</div>
          <div class="frame-wrap"><div class="frame frame-desktop" id="home-desktop" data-size="desktop"></div></div>
        </div>
        <div class="stage-block" data-stage="home">
          <div class="stage-label">Home, phone 390 px</div>
          <div class="frame-wrap"><div class="frame frame-phone" id="home-phone" data-size="phone"></div></div>
        </div>
        <div class="stage-block" data-stage="home">
          <div class="stage-label">Every type at the Home content width, 1120 px</div>
          <div class="frame-wrap"><div class="frame frame-types" id="types-desktop" data-size="types-desktop"></div></div>
        </div>
        <div class="stage-block" data-stage="home">
          <div class="stage-label">Every type at the phone width, 358 px</div>
          <div class="frame-wrap"><div class="frame frame-types" id="types-phone" data-size="types-phone"></div></div>
        </div>
        <div class="stage-block" data-stage="admin" hidden>
          <div class="stage-label">Admin, desktop 1440 px. The page is interactive. Scroll inside the frame.</div>
          <div class="frame-wrap"><div class="frame frame-desktop" id="admin-desktop" data-size="desktop"></div></div>
        </div>
        <div class="stage-block" data-stage="admin" hidden>
          <div class="stage-label">Admin, phone 390 px</div>
          <div class="frame-wrap"><div class="frame frame-phone" id="admin-phone" data-size="phone"></div></div>
        </div>
        <div class="stage-note" id="stage-note"></div>
      </div>
      <aside class="presets" id="presets"></aside>
    </div>
  </section>
  <section id="view-gallery" class="view" hidden>
    <div class="gallery" id="gallery"></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="lab-data.js"></script>
<script src="lab-banner.js"></script>
<script src="lab-home.js"></script>
<script src="lab-admin.js"></script>
<script src="lab-app.js"></script>
</body>
</html>
