<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clarity · Folder layout variants</title><link rel="stylesheet" href="app.css"><style>

r(--foreground);text-align:left;min-width:0;display:flex;align-items:center;gap:10px}.folder:hover,.folder[aria-pressed=true]{background:var(--accent)}.folder svg{color:var(--primary)}.folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}.folder-count{font-size:11px;color:var(--muted-foreground)}.chevron{width:12px!important;color:var(--muted-foreground)!important}.rows .folders{grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:14px}.rows .folder{height:40px;padding:0 8px}.rows .folders:after{content:'';grid-column:1/-1;border-bottom:1px solid var(--border);margin-top:12px}.sidebar .workspace{display:grid;grid-template-columns:210px 1fr;padding:0}.sidebar .folder-area{border-right:1px solid var(--border);padding:12px}.sidebar .folder{padding:0 8px;height:37px}.sidebar .media-area{padding:12px 20px 24px;min-width:0}.sidebar .folder-count{display:none}.sidebar .section-title{margin-top:4px}.chips .folders{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.chips .folder{border:1px solid var(--border);height:34px;padding:0 11px;font-size:12px;max-width:220px}.chips .folder svg{width:16px;height:16px}.chips .folder-count,.chips .chevron{display:none}.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}.media-card{min-width:0}.thumbnail{aspect-ratio:16/9;border-radius:8px;overflow:hidden;position:relative;background:#e4eafa;display:grid;place-items:center;color:#53678a}.thumbnail:before{content:'';width:42%;height:150%;position:absolute;background:#fff3;transform:rotate(30deg);left:8%}.thumbnail svg{width:24px;height:24px;fill:#fff8;stroke:white;position:relative}.thumbnail span{position:absolute;bottom:7px;right:7px;font-size:10px;background:#102044b3;color:white;padding:1px 5px;border-radius:3px}.media-card:nth-child(2n) .thumbnail{background:#dcece9;color:#4a7271}.media-card:nth-child(3n) .thumbnail{background:#e9e0f0}.media-name{font-size:13px;font-weight:500;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-date{font-size:11px;color:var(--muted-foreground);margin-top:3px}.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding:14px 20px;color:var(--muted-foreground);font-size:12px}.footer button{height:36px;border:0;border-radius:8px;padding:0 15px;background:var(--primary);color:var(--primary-foreground)}.switch{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#111c32;color:#fff;border-radius:14px;box-shadow:0 8px 28px #1426422f;padding:8px;z-index:10;width:max-content;max-width:calc(100% - 24px)}.switch button{background:#ffffff12;color:white;border-color:#ffffff20;padding:8px 12px}.switch .label{min-width:185px;text-align:center;font-size:13px}.dots{display:flex;justify-content:center;gap:4px;margin-top:4px}.dots i{height:3px;width:16px;border-radius:2px;background:#ffffff40}.dots i.active{background:white}.phone .toolbar{padding:14px 12px}.phone .tool .word{display:none}.phone .workspace{padding:4px 12px 20px}.phone .rows .folders{grid-template-columns:repeat(2,minmax(0,1fr))}.phone .folder{font-size:12px;gap:7px}.phone .folder-count{display:none}.phone .media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.phone .sidebar .workspace{grid-template-columns:112px 1fr;padding:0}.phone .sidebar .folder-area{padding:12px 4px}.phone .sidebar .folder{font-size:11px;height:40px;gap:5px;padding:0 5px}.phone .sidebar .folder svg{width:14px;height:14px}.phone .sidebar .chevron{display:none}.phone .sidebar .media-area{padding:12px 10px}.phone .sidebar .media-grid{grid-template-columns:1fr}.phone .chips .folders{gap:6px}.phone .chips .folder{max-width:calc(50% - 3px);font-size:11px;height:32px;padding:0 8px}.phone .footer{padding:12px}.phone .footer .hint{max-width:160px}@media(max-width:600px){.page{padding:22px 12px 100px}.intro{display:block}.view-toggle{display:none}h1{font-size:22px}.frame{width:1 <main class="page"><div class="intro"><div><div class="eyebrow">Clarity · Design study · Mock data</div><h1 id="heading"></h1><p id="description"></p></div><div class="view-toggle"><button id="desktop" aria-pressed="true">Desktop</button><button id="phone" aria-pressed="false">Phone</button></div></div><div class="frame" id="frame"><div class="modal-title">Select media <span aria-hidden="true">×</span></div><div class="toolbar"><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>Search…</div><button class="tool" aria-label="Filter"><svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M9 18h6"/></svg></button><button class="tool"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#e82435" stroke="none"/></svg><span class="word">Record video</span></button><button class="tool" aria-label="Upload"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg></button></div><div id="variant"></div><div class="footer"><span class="hint">Choose a folder to explore the layout</span><button>Insert video</button></div></div></main><nav class="switch" aria-label="Layout variants"><button id="prev" aria-label="Previous variant">←</button><div class="label"><span id="label"></span><div class="dots"><i></i><i></i><i></i></div></div><button id="next" aria-label="Next variant">→</button></nav>
<script>
// Throwaway design comparison. Mock content only; no persistence or uploads.
const variants=[['A · Compact rows','Compact rows','Full names, quiet icons, and a tight grid. My recommendation.'],['B · Folder sidebar','Folder sidebar','Folders stay beside the videos. Best for frequent browsing.'],['C · Wrapping buttons','Wrapping buttons','A lightweight folder strip that leaves the most room for videos.']];
const folders=['Brand assets','Product demos','Customer stories','Sales enablement','Team recordings','Onboarding','Campaigns','Events','Archive'];
const media=['Product walkthrough','Welcome to the team','A closer look','Customer introduction','Getting started','The next step'];
const folderIcon='<svg viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg>';
let current=Math.max(0,['A','B','C'].indexOf(new URLSearchParams(location.search).get('variant')||'A')),activeFolder='';
function render(){const v=variants[current];document.querySelector('#heading').textContent=v[1];document.querySelector('#description').textContent=v[2];document.querySelector('#label').textContent=v[0];document.querySelectorAll('.dots i').forEach((el,i)=>el.classList.toggle('active',i===current));const cls=['rows','sidebar','chips'][current];document.querySelector('#variant').className=cls;document.querySelector('#variant').innerHTML='<div class="workspace"><section class="folder-area"><h2 class="section-title">Folders <span class="count">9</span></h2><div class="folders">'+folders.map((f,i)=>'<button class="folder" title="'+f+'" aria-pressed="'+(activeFolder===f)+'">'+folderIcon+'<span class="folder-name">'+f+'</span><span class="folder-count">'+[24,12,8,16,7,11,5,3,18][i]+'</span><svg class="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>').join('')+'</div></section><section class="media-area"><h2 class="section-title">'+(activeFolder||'Videos')+' <span class="count">'+(activeFolder?'6':'104')+'</span></h2><div class="media-grid">'+media.map((name,i)=>'<div class="media-card"><div class="thumbnail"><svg viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></svg><span>'+['2:14','0:48','1:32','3:05','0:57','1:41'][i]+'</span></div><div class="media-name">'+name+'</div><div class="media-date">'+['Today','Yesterday','2 days ago'][i%3]+'</div></div>').join('')+'</div></section></div>';document.querySelectorAll('.folder').forEach(b=>b.onclick=()=>{activeFolder=b.querySelector('.folder-name').textContent;render()});const url=new URL(location);url.searchParams.set('variant',['A','B','C'][current]);history.replaceState(null,'',url)}
function cycle(delta){current=(current+delta+3)%3;activeFolder='';render()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});function size(phone){document.querySelector('#frame').classList.toggle('phone',phone);document.querySelector('#phone').setAttribute('aria-pressed',phone);document.querySelector('#desktop').setAttribute('aria-pressed',!phone)}document.querySelector('#phone').onclick=()=>size(true);document.querySelector('#desktop').onclick=()=>size(false);const mq=matchMedia('(max-width:600px)');mq.addEventListener('change',()=>size(mq.matches));size(mq.matches);render();
</script></html>
