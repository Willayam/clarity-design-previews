<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finish your video</title>
<link rel="stylesheet" href="../shared/app.css">
<style>
/* Mock-only helpers. Everything else is the app's own stylesheet. */
.quiet-link { color: var(--muted-foreground); text-decoration: underline; text-decoration-color: color-mix(in oklab, var(--muted-foreground) 40%, transparent); text-underline-offset: 4px; transition: color 120ms; }
.quiet-link:hover { color: var(--foreground); text-decoration-color: currentColor; }
.poster { display: block; width: 100%; height: 100%; object-fit: cover; }

.live-thumb { display: block; width: 8.5rem; height: 5.25rem; overflow: hidden; border-radius: 0.5rem; background: #fff; box-shadow: 0 1px 2px rgb(15 23 42 / 0.08), 0 0 0 1px var(--border); flex: none; }
.live-thumb > .jp-theme { width: 760px; transform: scale(0.179); transform-origin: 0 0; pointer-events: none; }
.jp-theme {
  --jp-page-max-width: 760px;
  --jp-page-x-padding: clamp(16px, 2vw, 20px);
  --jp-section-background: var(--jp-background);
  --jp-section-plain-background: #ffffff;
  --jp-section-plain-foreground: #0f172a;
  --jp-section-plain-muted: #64748b;
  --jp-section-plain-border: #e2e8f0;
  --jp-section-plain-card: #ffffff;
  /* Type + spacing scale: one shared token ladder (1.5/2/2.5/3/4.5rem).
     S is the default; presets and overrides step it via data attributes. */
  --jp-h1-size: 2rem;
  --jp-h2-size: 1.5rem;
  --jp-price-size: 2rem;
  --jp-section-pad: 2rem;
  background: var(--jp-section-plain-background);
  color: var(--jp-foreground);
  font-family: var(--jp-font-body);
  font-size: 1.125rem;
  line-height: 1.5;
  overflow: hidden;
}
.jp-theme[data-scale="m"] { --jp-h1-size: 3rem; --jp-h2-size: 2rem; --jp-price-size: 2.5rem; }
.jp-theme[data-scale="l"] { --jp-h1-size: 4.5rem; --jp-h2-size: 2.5rem; --jp-price-size: 3rem; }
.jp-theme[data-spacing="m"] { --jp-section-pad: 3rem; }
.jp-theme[data-spacing="l"] { --jp-section-pad: 4rem; }
/* Shadow steps: neutral elevation recipes; presets pick a step and may
   restyle the flavor (glow, hard offset) in personality CSS. */
.jp-theme { --jp-shadow-media: none; --jp-shadow-card: 0 16px 48px rgba(15, 23, 42, 0.04); --jp-shadow-button: none; }
.jp-theme[data-shadows="none"] { --jp-shadow-card: none; }
.jp-theme[data-shadows="soft"] {
  --jp-shadow-media: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 1px 2px rgba(2, 6, 23, 0.05), 0 10px 28px rgba(2, 6, 23, 0.07);
  --jp-shadow-card: inset 0 1px 0 rgba(255, 255, 255, 0.65), 0 1px 2px rgba(2, 6, 23, 0.04), 0 8px 22px rgba(2, 6, 23, 0.05);
  --jp-shadow-button: 0 1px 2px rgba(2, 6, 23, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
.jp-theme[data-shadows="strong"] {
  --jp-shadow-media: 0 1px 2px rgba(2, 6, 23, 0.08), 0 24px 64px rgba(2, 6, 23, 0.16);
  --jp-shadow-card: 0 1px 2px rgba(2, 6, 23, 0.06), 0 18px 48px rgba(2, 6, 23, 0.12);
  --jp-shadow-button: 0 2px 4px rgba(2, 6, 23, 0.2), 0 10px 28px rgba(2, 6, 23, 0.16);
}
.jp-theme *,
.jp-theme *::before,
.jp-theme *::after { box-sizing: border-box; }
.jp-theme h1,
.jp-theme h2,
.jp-theme h3,
.jp-theme p,
.jp-theme li,
.jp-theme summary,
.jp-theme [data-journey-content-copy],
.jp-theme [data-journey-content-copy] *,
.jp-theme .rich-text,
.jp-theme .rich-text *,
.jp-theme [data-journey-cta-row] a,
.jp-theme [data-journey-cta-row] button,
.jp-theme [data-journey-cta-row] span,
.jp-theme a.button,
.jp-theme button.button,
.jp-theme span.button,
.jp-theme [data-journey-contact-list] a,
.jp-theme [data-journey-pricing-card],
.jp-theme [data-journey-faq-answer] {
  overflow-wrap: anywhere;
  word-break: break-word;
}
.jp-theme [data-module-kind] {
  background: var(--jp-section-background);
  box-shadow: 0 0 0 100vmax var(--jp-section-background);
  box-sizing: border-box;
  clip-path: inset(0 -100vmax);
  /* Sections re-apply color so alternating sections that swap --jp-foreground
     recolor body text too; inherited color is a computed value, so without
     this a dark brand leaves root-colored text on light plain sections. */
  color: var(--jp-foreground);
  margin: 0 auto;
  max-width: var(--jp-page-max-width);
  padding: var(--jp-section-pad) var(--jp-page-x-padding);
}
.jp-theme [data-module-kind]:nth-of-type(even) {
  --jp-background: var(--jp-section-plain-background);
  --jp-foreground: var(--jp-section-plain-foreground);
  /* Derived from the plain-section tokens rather than pinned as literals, so a
     preset that restyles the plain sections carries --jp-muted/--jp-input along
     instead of leaving a foreign slate slab on its own palette.
     These approximate, but do not equal, the literals they replace: on a
     default page --jp-muted was #f8fafc and now computes to #f8f8f9, --jp-input was
     the blue-tinted #cbd5e1 and now computes to the neutral #cfd1d4. The 3%
     keeps even sections one shade lighter than the root --jp-muted (#f1f5f9),
     which is the distinction the old literal encoded. */
  --jp-muted: color-mix(in srgb, var(--jp-section-plain-foreground) 3%, var(--jp-section-plain-background));
  --jp-muted-foreground: var(--jp-section-plain-muted);
  --jp-card: var(--jp-section-plain-card);
  --jp-card-foreground: var(--jp-section-plain-foreground);
  --jp-border: var(--jp-section-plain-border);
  --jp-input: color-mix(in srgb, var(--jp-section-plain-foreground) 20%, var(--jp-section-plain-background));
  --jp-section-background: var(--jp-section-plain-background);
}
.jp-theme [data-module-kind="hero"] { padding-top: 24px; }
.jp-theme h1,
.jp-theme h2,
.jp-theme h3 {
  color: var(--jp-foreground);
  font-family: var(--jp-font-heading);
  margin: 0 0 12px;
  line-height: 1.2;
}
/* em margins so heading rhythm rides the scale steps automatically. */
.jp-theme h1 { font-size: clamp(1.5rem, 7vw, var(--jp-h1-size)); font-weight: 700; margin-bottom: 0.375em; }
.jp-theme h2 { font-size: var(--jp-h2-size); font-weight: 700; letter-spacing: 0; line-height: 1.25; margin-bottom: 0.4em; }
.jp-theme h3 { font-weight: 600; line-height: 1.3; margin-bottom: 8px; }
.jp-theme p { margin: 0 0 0.5em; }
.jp-theme .rich-text > p:last-child,
.jp-theme [data-journey-content-copy] > p:last-child,
.jp-theme p:last-child { margin-bottom: 0; }
.jp-theme a { color: var(--jp-primary); }
/* Authored rich-text lists. Stated explicitly rather than left to the UA
   default, because this sheet also renders inside the editor, where Tailwind's
   preflight resets ul/ol to list-style:none + padding:0 — that reset is why
   bullets and numbers showed on the published page but vanished in the
   editor. Pinning both surfaces here keeps them identical. */
.jp-theme .rich-text ul,
.jp-theme .rich-text ol {
  margin: 0 0 0.5em;
  padding-left: 1.25em;
}
.jp-theme .rich-text ul { list-style: disc; }
.jp-theme .rich-text ol { list-style: decimal; }
.jp-theme .rich-text li { margin: 0 0 0.15em; }
/* Tiptap wraps each item's text in a paragraph; that must not add block
   spacing inside a list item. */
.jp-theme .rich-text li > p { margin: 0; }
.jp-theme .rich-text ul:last-child,
.jp-theme .rich-text ol:last-child { margin-bottom: 0; }
.jp-theme .error { color: #b91c1c; font-weight: 700; }

.jp-theme [data-journey-brand-logo] {
  display: flex;
  justify-content: flex-start;
  margin: 0 0 16px;
}
.jp-theme [data-journey-brand-logo][data-logo-align="center"] { justify-content: center; }
.jp-theme [data-journey-brand-logo][data-logo-align="right"] { justify-content: flex-end; }
.jp-theme [data-journey-brand-logo] img,
.jp-theme img.company-logo {
  display: block;
  height: auto;
  max-height: 80px;
  max-width: 240px;
  object-fit: contain;
}

.jp-theme [data-title-align="center"] > h1,
.jp-theme [data-title-align="center"] > h2,
.jp-theme [data-title-align="center"] > h3,
.jp-theme [data-title-align="center"] > p { text-align: center; }
.jp-theme [data-title-align="right"] > h1,
.jp-theme [data-title-align="right"] > h2,
.jp-theme [data-title-align="right"] > h3,
.jp-theme [data-title-align="right"] > p { text-align: right; }
.jp-theme [data-title-align="center"] [data-journey-cta-row] { justify-content: center; }
.jp-theme [data-title-align="right"] [data-journey-cta-row] { justify-content: flex-end; }

.jp-theme [data-module-kind="content"] [data-journey-content-layout] {
  align-items: flex-start;
  display: flex;
  gap: 24px;
}
.jp-theme [data-module-kind="content"][data-media-side="right"] [data-journey-content-layout] { flex-direction: row; }
.jp-theme [data-module-kind="content"][data-media-side="left"] [data-journey-content-layout] { flex-direction: row-reverse; }
.jp-theme [data-module-kind="content"] [data-journey-content-copy] { flex: 3 1 0; min-width: 0; }
/* The media column's share of the row is user-adjustable; copy reflows to fill
   the rest. --media-size is set per-section by the editor/renderer; absent =>
   ASSET_SIZE_DEFAULT (the current default), so existing pages are unchanged.
   Applies to image and video alike. */
.jp-theme [data-module-kind="content"] [data-journey-content-media] { flex: 0 0 var(--media-size, 40%); min-width: 0; }
.jp-theme [data-module-kind="content"] [data-journey-content-media] [data-journey-media-frame] { margin: 0; }
.jp-theme [data-module-kind="content"] [data-journey-content-copy] > *:first-child { margin-top: 0; }
.jp-theme [data-module-kind="content"] [data-journey-content-copy] > *:last-child { margin-bottom: 0; }
/* Wrap (mediaWrap): the media column floats on its side inside the copy flow,
   so text runs beside it and continues underneath — no dead space when the
   copy outruns the visual. Orthogonal to data-media-side; the media column
   must precede the copy in DOM order for line boxes to shorten around it. */
.jp-theme [data-module-kind="content"][data-media-wrap="true"] [data-journey-content-layout] { display: block; }
.jp-theme [data-module-kind="content"][data-media-wrap="true"] [data-journey-content-layout]::after { content: ""; display: block; clear: both; }
.jp-theme [data-module-kind="content"][data-media-wrap="true"] [data-journey-content-media] {
  float: right;
  margin: 4px 0 16px 24px;
  /* Later copy blocks' boxes overlap the float; keep the media (and, in the
     editor, its hover toolbar) above them so it stays interactive. */
  position: relative;
  width: var(--media-size, 40%);
  z-index: 1;
}
.jp-theme [data-module-kind="content"][data-media-side="left"][data-media-wrap="true"] [data-journey-content-media] {
  float: left;
  margin: 4px 24px 16px 0;
}
/* A fused client-logo row rendered inside the copy must not squeeze beside
   the float when the body copy is shorter than the media. */
.jp-theme [data-module-kind="content"][data-media-wrap="true"] [data-journey-client-logos] { clear: both; }

.jp-theme [data-journey-cta-row] {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  /* The editor's empty media slot sets a tighter rhythm. */
  margin-top: var(--jp-cta-row-margin-top, 24px);
  justify-content: center;
}
.jp-theme [data-journey-cta-row] a,
.jp-theme [data-journey-cta-row] button,
.jp-theme [data-journey-cta-row] span,
.jp-theme a.button,
.jp-theme button.button,
.jp-theme span.button {
  background: var(--jp-primary);
  /* INVARIANT: the shared rule owns border width; variants set border-color
     only. Auto-sized buttons turn a width difference into a size difference.
     Enforced by the preset-registry test. */
  border: 1px solid transparent;
  border-radius: var(--jp-radius-button);
  box-shadow: var(--jp-shadow-button);
  color: var(--jp-primary-foreground);
  cursor: pointer;
  /* inline-block, NOT flex: text-box trimming is inert on flex containers
     (measured), and the trim below is what centers descender-heavy faces. */
  display: inline-block;
  font: inherit;
  font-weight: 600;
  line-height: 1.2;
  max-width: 100%;
  min-width: 0;
  /* 16px vertical: the text-box trim below removes the line-box leading, so
     the padding carries the button's full height on its own. */
  padding: 16px 24px;
  text-align: center;
  text-decoration: none;
  /* Optical centering: trim the line box to cap-height and baseline so
     descender-heavy faces (serifs measured ~5px high at 18px) center on
     their visual mass. Older browsers ignore the trim. */
  text-box: trim-both cap alphabetic;
  transition: filter 120ms ease;
  white-space: normal;
}
.jp-theme .button:hover { filter: brightness(0.95); }
/* Secondary buttons are mostly transparent, so brightness alone is invisible
   on them — hover fills lightly instead. Presets restyle the fill flavor. */
.jp-theme .button[data-cta-style="secondary"]:hover,
.jp-theme .button-secondary:hover { background: color-mix(in srgb, var(--jp-primary) 10%, transparent); }
.jp-theme [data-journey-cta-row] .button[data-cta-style="secondary"],
.jp-theme .button-secondary {
  background: transparent;
  border-color: var(--jp-primary);
  color: var(--jp-primary);
}
/* Keyboard focus: every actionable CTA gets a visible ring. A backing ring
   in --jp-primary-foreground sits under the primary outline: wherever the
   section background swallows one layer (Bold's hero remaps --jp-background to
   primary, featured pricing tints it), the other contrasts by definition.
   The !important is deliberate and load-bearing: focus indication is an
   accessibility invariant, and preset decoration (Bold's 0,5,0 offset-shadow
   selectors) must not out-cascade it while a CTA is focused. */
.jp-theme :is(a.button, button.button, [data-journey-cta-row] :is(a, button), [data-module-kind="lead-form"] button[type="submit"]):focus-visible {
  outline: 2px solid var(--jp-primary);
  outline-offset: 2px;
  box-shadow: 0 0 0 4px var(--jp-primary-foreground) !important;
}

.jp-theme [data-journey-media-frame] {
  --media-aspect-ratio: 16 / 9;
  --media-max-height: min(56vh, 640px);
  --media-ratio-number: 1.7777778;
  border-radius: var(--jp-radius);
  box-shadow: var(--jp-shadow-media);
  margin: 24px 0;
  /* The editor lets a frame holding its media toolbar overflow. */
  overflow: var(--jp-media-frame-overflow, hidden);
}
@media (max-width: 560px) {
  .jp-theme [data-journey-media-frame] {
    --media-max-height: min(75svh, 640px);
  }
}
.jp-theme [data-journey-media-frame] img,
.jp-theme [data-journey-media-frame] video,
.jp-theme [data-journey-media-frame] iframe,
.jp-theme [data-journey-media-frame] mux-player {
  background: var(--jp-muted);
  border: 0;
  border-radius: var(--jp-radius);
  display: block;
  height: auto;
  width: 100%;
}
.jp-theme [data-journey-media-frame] img { max-height: 540px; object-fit: contain; }
.jp-theme [data-journey-media-frame] video,
.jp-theme [data-journey-media-frame] mux-player,
.jp-theme [data-journey-media-frame] iframe[data-journey-video-embed] {
  aspect-ratio: var(--media-aspect-ratio);
}
.jp-theme [data-journey-video-frame] video,
.jp-theme [data-journey-video-frame] mux-player,
.jp-theme [data-journey-video-frame] iframe[data-journey-video-embed],
.jp-theme [data-journey-video-frame] .lp-video-container,
.jp-theme [data-journey-video-frame] .lp-asset-video {
  aspect-ratio: var(--media-aspect-ratio);
  margin-inline: auto;
  max-height: var(--media-max-height);
  max-width: 100%;
  width: min(100%, calc(var(--media-max-height) * var(--media-ratio-number)));
}
/* Editor chrome (14-library.css) hardcodes 0.5rem on these classes for the
   media library; inside the themed surface the video must follow --jp-radius so
   the preview matches the public renderer (incl. the Corners lever). */
.jp-theme .lp-video-container,
.jp-theme .lp-asset-video {
  border-radius: var(--jp-radius);
}
.jp-theme [data-journey-media-frame] video,
.jp-theme [data-journey-media-frame] mux-player {
  --media-accent-color: var(--jp-primary);
  --media-object-fit: contain;
  --media-object-position: center;
  background: #020617;
  object-fit: contain;
}
/* Mux Player's controls, on the journey theme (levers verified in
   ./mux-player.ts). The chrome floats over the viewer's video, which no theme
   token is guaranteed to contrast with, so its ink and its backdrop stay the
   white and the slate the click-to-play trigger paints and only the accent
   above follows the theme. Picture-in-picture, AirPlay and Cast are hidden:
   each hands playback to a surface that is not this page. */
.jp-theme [data-journey-media-frame] mux-player {
  --airplay-button: none;
  --cast-button: none;
  --controls-backdrop-color: rgba(15, 23, 42, 0.45);
  --media-primary-color: #ffffff;
  --pip-button: none;
}
.jp-theme [data-journey-video-frame] .lp-video-poster {
  background: #020617;
  object-fit: contain;
}
/* The shell paints the mat behind the player, so it has to be the player's
   width: left at 100% a portrait video would sit in black bars again, drawn by
   the shell instead of the frame. Landscape is unchanged, the width resolving
   to 100% at every column width. */
.jp-theme [data-journey-video-preview-shell] {
  background: #020617;
  margin-inline: auto;
  max-width: 100%;
  position: relative;
  width: min(100%, calc(var(--media-max-height) * var(--media-ratio-number)));
}
.jp-theme [data-journey-video-placeholder-frame] {
  aspect-ratio: var(--media-aspect-ratio);
  background: #020617;
  margin-inline: auto;
  max-height: var(--media-max-height);
  max-width: 100%;
  position: relative;
  width: min(100%, calc(var(--media-max-height) * var(--media-ratio-number)));
}
.jp-theme [data-journey-video-placeholder] {
  align-items: center;
  background: #020617;
  border-radius: var(--jp-radius);
  color: #ffffff;
  display: flex;
  inset: 0;
  justify-content: center;
  overflow: hidden;
  position: absolute;
}
.jp-theme [data-journey-video-placeholder] .upload-progress-card-thumb-base {
  background-color: #1e293b;
  background-image: radial-gradient(ellipse 130% 95% at 28% 22%, #475569 0%, #334155 42%, #0f172a 92%);
  inset: 0;
  position: absolute;
}
.jp-theme [data-journey-video-placeholder] .upload-progress-card-tint {
  background: rgba(15, 23, 42, 0.45);
  inset: 0;
  position: absolute;
}
.jp-theme [data-journey-video-placeholder] .upload-progress-card-content {
  align-items: center;
  display: flex;
  flex-direction: column;
  gap: 0.95rem;
  padding: 0 0.75rem;
  position: relative;
  text-align: center;
  z-index: 1;
}
.jp-theme [data-journey-video-placeholder] .upload-progress-card-ring {
  display: block;
  height: 4.5rem;
  overflow: visible;
  width: 4.5rem;
}
.jp-theme [data-journey-video-placeholder] .ring-track {
  stroke: rgba(255, 255, 255, 0.16);
  stroke-width: 4;
}
.jp-theme [data-journey-video-placeholder] .ring-fill {
  animation: journey-processing-ring 1.6s linear infinite;
  stroke: rgba(255, 255, 255, 0.64);
  stroke-linecap: round;
  stroke-width: 4;
  transform-origin: 50% 50%;
}
.jp-theme [data-journey-video-placeholder] .upload-progress-card-caption {
  color: rgba(255, 255, 255, 0.72);
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  line-height: 1.2;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 2px rgba(15, 23, 42, 0.4);
  white-space: nowrap;
}
.jp-theme [data-journey-video-placeholder="unavailable"] .upload-progress-card-caption {
  color: #ffffff;
  font-size: 1rem;
}
.jp-theme [data-journey-video-placeholder] .upload-progress-card-content p {
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.875rem;
  margin: 0;
}
@keyframes journey-processing-ring {
  to { transform: rotate(360deg); }
}
.jp-theme [data-journey-video-preview-shell] [hidden] {
  display: none !important;
}
/* A player whose still is still up stays out of the page until the tap. On a
   touch device it waits inside the frame instead, out of flow and invisible, so
   mobile browsers decode its first frame before the tap (display:none decodes
   nothing there). Desktop Chromium decodes a display:none player anyway, and
   an invisible one there only becomes the page's LCP candidate. */
.jp-theme [data-journey-video-preview-trigger]:not([hidden]) + [data-journey-video-player] {
  display: none;
}
@media (pointer: coarse) {
  .jp-theme [data-journey-video-preview-trigger]:not([hidden]) + [data-journey-video-player] {
    display: block;
    inset: 0;
    position: absolute;
    visibility: hidden;
  }
}
.jp-theme [data-journey-video-preview-trigger] {
  align-items: center;
  aspect-ratio: var(--media-aspect-ratio);
  background: #020617;
  border: 0;
  border-radius: var(--jp-radius);
  color: #ffffff;
  cursor: pointer;
  display: flex;
  justify-content: center;
  margin-inline: auto;
  max-height: var(--media-max-height);
  max-width: 100%;
  overflow: hidden;
  padding: 0;
  position: relative;
  width: min(100%, calc(var(--media-max-height) * var(--media-ratio-number)));
}
.jp-theme [data-journey-video-preview-trigger] .lp-video-poster {
  display: block;
  height: 100%;
  max-height: none;
  object-fit: contain;
  width: 100%;
}
.jp-theme [data-journey-video-preview-trigger] .lp-video-overlay {
  background: linear-gradient(rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.1));
  inset: 0;
  position: absolute;
  z-index: 1;
}
.jp-theme [data-journey-video-preview-trigger] .lp-play-button {
  align-items: center;
  background: color-mix(in srgb, var(--jp-primary) 72%, transparent);
  border-radius: 999px;
  display: flex;
  height: 56px;
  justify-content: center;
  left: 50%;
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 56px;
  z-index: 2;
}
.jp-theme [data-journey-document-frame] {
  background: var(--jp-muted);
  border: 0;
  border-radius: var(--jp-radius);
  display: block;
  min-height: 520px;
  width: 100%;
  aspect-ratio: 4 / 3;
}

.jp-theme [data-journey-client-logos] {
  display: flex;
  flex-direction: column;
  gap: 20px;
  list-style: none;
  margin: 24px 0 0;
  padding: 0;
}
/* Logo muting: automatic on themed pages, per-section overridable via
   data-logos-color (muted | full); presets restyle only the flavor. */
.jp-theme[data-theme-preset] [data-journey-client-logos]:not([data-logos-color="full"]) img,
.jp-theme [data-journey-client-logos][data-logos-color="muted"] img {
  filter: grayscale(1);
  opacity: 0.65;
}
.jp-theme [data-journey-client-logos] .client-logo-row {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  list-style: none;
  margin: 0;
  padding: 0;
}
.jp-theme [data-journey-client-logos] img {
  height: auto;
  max-height: 96px;
  max-width: 180px;
  object-fit: contain;
}
.jp-theme [data-journey-client-logos][data-logos-variant="rolling"] {
  flex-wrap: nowrap;
  overflow: hidden;
}
.jp-theme [data-logos-variant="rolling"] .client-logo-track {
  align-items: center;
  animation: jp-logos-roll 30s linear infinite;
  display: flex;
  gap: 20px;
  width: max-content;
}
@keyframes jp-logos-roll {
  from { transform: translateX(0); }
  to { transform: translateX(calc(-50% - 10px)); }
}
@media (prefers-reduced-motion: reduce) {
  .jp-theme [data-logos-variant="rolling"] .client-logo-track {
    animation: none;
  }
}

.jp-theme [data-module-kind="hero"] [data-journey-contact-list] {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 16px;
  justify-content: center;
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
}
.jp-theme [data-module-kind="hero"] [data-journey-contact-list] [data-contact-label] {
  color: var(--jp-foreground);
  font-weight: 700;
  min-width: 0;
}
.jp-theme [data-module-kind="hero"] [data-journey-contact-list] a {
  align-items: baseline;
  color: var(--jp-primary);
  display: inline-flex;
  gap: 4px;
  text-decoration: none;
}

.jp-theme [data-module-kind="faq"] h2 { margin-bottom: 16px; }
.jp-theme [data-module-kind="faq"] [data-journey-faq-list] {
  border-bottom: 1px solid var(--jp-border);
  list-style: none;
  margin: 0;
  padding: 0;
  width: 100%;
}
.jp-theme [data-module-kind="faq"] [data-journey-faq-item] {
  border-top: 1px solid var(--jp-border);
  overflow: hidden;
}
.jp-theme [data-module-kind="faq"] details { overflow: hidden; }
.jp-theme [data-module-kind="faq"] summary {
  align-items: center;
  color: var(--jp-foreground);
  cursor: pointer;
  display: flex;
  font-size: 1rem;
  font-weight: 600;
  gap: 16px;
  justify-content: space-between;
  line-height: 1.35;
  list-style: none;
  padding: 16px 4px 16px 0;
  transition: color 160ms ease;
}
.jp-theme [data-module-kind="faq"] summary:hover { color: var(--jp-primary); }
.jp-theme [data-module-kind="faq"] summary::-webkit-details-marker { display: none; }
.jp-theme [data-module-kind="faq"] summary::after {
  border-bottom: 2px solid currentColor;
  border-right: 2px solid currentColor;
  content: "";
  flex: 0 0 auto;
  height: 8px;
  opacity: 0.82;
  transform: rotate(-135deg);
  transition: transform 160ms ease;
  width: 8px;
}
.jp-theme [data-module-kind="faq"] details[open] summary { color: var(--jp-primary); }
.jp-theme [data-module-kind="faq"] details[open] summary::after { transform: rotate(45deg); }
.jp-theme [data-module-kind="faq"] [data-journey-faq-answer] {
  color: var(--jp-muted-foreground);
  font-size: 1rem;
  line-height: 1.5;
  margin: 0;
  padding: 0 0 16px;
  max-width: 72ch;
}

/* Summary: a receipt-style recap table. Muted labels left, emphasized values
   right; every color and border rides the theme tokens so presets restyle it
   for free. */
.jp-theme [data-module-kind="summary"] h2 { margin-bottom: 16px; }
.jp-theme [data-journey-summary-table] {
  border-collapse: collapse;
  width: 100%;
}
.jp-theme [data-journey-summary-table] th,
.jp-theme [data-journey-summary-table] td {
  border-top: 1px solid var(--jp-border);
  font-size: 1rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
  padding: 12px 4px 12px 0;
  vertical-align: top;
  word-break: break-word;
}
.jp-theme [data-journey-summary-table] tr:last-child th,
.jp-theme [data-journey-summary-table] tr:last-child td {
  border-bottom: 1px solid var(--jp-border);
}
.jp-theme [data-journey-summary-table] th {
  color: var(--jp-muted-foreground);
  font-weight: 500;
  padding-right: 16px;
  text-align: left;
  /* Mirrors .ste-label in the editor sheet; the :has() rule below releases it
     once the table grows a middle column. */
  width: 40%;
}
.jp-theme [data-journey-summary-table] td {
  color: var(--jp-foreground);
  font-weight: 600;
  text-align: right;
}
/* Middle columns (3+ column tables): plain body cells; emphasis stays
   anchored to the ends — muted label first, bold value last. The 40% label
   only makes sense while the table is two columns. */
.jp-theme [data-journey-summary-table] td:not(:last-child) {
  font-weight: 400;
  padding-right: 16px;
  text-align: left;
}
.jp-theme [data-journey-summary-table]:has(td:not(:last-child)) th {
  min-width: 110px;
  width: auto;
}

/* Gallery: an image grid whose only layout knob is the column count the
   editor writes onto [data-columns]. Any image count reflows into it. */
.jp-theme [data-module-kind="gallery"] h2 { margin-bottom: 16px; }
.jp-theme [data-journey-gallery] {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.jp-theme [data-journey-gallery][data-columns="1"] { grid-template-columns: minmax(0, 1fr); }
.jp-theme [data-journey-gallery][data-columns="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.jp-theme [data-journey-gallery][data-columns="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.jp-theme [data-journey-gallery][data-columns="5"] { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.jp-theme [data-journey-gallery] img {
  aspect-ratio: 4 / 3;
  border-radius: var(--jp-radius);
  box-shadow: var(--jp-shadow-media);
  display: block;
  height: 100%;
  object-fit: contain;
  width: 100%;
}
/* Phones: three or more tracks stop reading as images, so they cap at two.
   One- and two-column galleries keep the author's choice. */
@media (max-width: 560px) {
  .jp-theme [data-journey-gallery][data-columns="3"],
  .jp-theme [data-journey-gallery][data-columns="4"],
  .jp-theme [data-journey-gallery][data-columns="5"] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.jp-theme [data-module-kind="pricing"] [data-journey-pricing-grid] {
  display: grid;
  gap: 24px;
  /* 3 cards must fit the 760px page: (760 - 2*20 padding - 2*24 gap) / 3 = 224px.
     min() keeps it from overflowing containers narrower than the track. */
  grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr));
  list-style: none;
  margin: 0;
  padding: 0;
}
/* Orphan guards: auto-fit alone leaves a lone card on a second row. Exactly
   four plans pair up 2+2 instead of 3+1; exactly three stack rather than sit
   2+1 below 710px, the narrowest viewport where three tracks still fit. */
@media (min-width: 561px) {
  .jp-theme [data-module-kind="pricing"] [data-journey-pricing-grid]:has(> :nth-child(4):last-child) {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 709px) {
  .jp-theme [data-module-kind="pricing"] [data-journey-pricing-grid]:has(> :nth-child(3):last-child) {
    grid-template-columns: 1fr;
  }
}
.jp-theme [data-journey-pricing-card] {
  background: var(--jp-card);
  color: var(--jp-card-foreground);
  border: 1px solid var(--jp-border);
  border-radius: var(--jp-radius);
  box-shadow: var(--jp-shadow-card);
  padding: 24px;
}
.jp-theme [data-journey-pricing-card] [data-journey-pricing-title] {
  font-size: 1.125rem;
  font-weight: 600;
  margin: 0;
}
.jp-theme [data-journey-pricing-card] [data-journey-pricing-price] {
  color: var(--jp-card-foreground);
  font-size: var(--jp-price-size);
  font-weight: 700;
  line-height: 1;
  margin-top: 12px;
}
.jp-theme [data-journey-pricing-card] [data-plan-features] {
  color: var(--jp-muted-foreground);
  line-height: 1.8;
  list-style: disc;
  margin: 16px 0 0;
  padding-left: 20px;
}
.jp-theme [data-journey-pricing-card] [data-journey-pricing-cta] { margin-top: 20px; }
.jp-theme [data-journey-pricing-card] [data-journey-pricing-cta] [data-journey-cta-row] { margin-top: 0; }

.jp-theme [data-module-kind="contact"] [data-journey-contact-list] {
  display: flex;
  flex-direction: column;
  gap: 8px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.jp-theme [data-module-kind="contact"] [data-journey-contact-list] a {
  align-items: baseline;
  color: var(--jp-primary);
  display: inline-flex;
  flex-wrap: wrap;
  gap: 12px;
  text-decoration: none;
}
.jp-theme [data-module-kind="contact"] [data-journey-contact-list] a:hover { text-decoration: underline; }
.jp-theme [data-module-kind="contact"] [data-contact-label] {
  color: var(--jp-muted-foreground);
  font-size: 0.875rem;
  font-weight: 600;
  min-width: 80px;
}

.jp-theme [data-module-kind="lead-form"] {
  max-width: 720px;
}
.jp-theme [data-module-kind="lead-form"] > .rich-text,
.jp-theme [data-module-kind="lead-form"] > p {
  color: var(--jp-muted-foreground);
  font-size: 1rem;
  line-height: 1.5;
  max-width: 65ch;
}
.jp-theme [data-module-kind="lead-form"] form {
  display: grid;
  gap: 16px 12px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 16px;
  width: 100%;
}
.jp-theme [data-module-kind="lead-form"] form > label {
  color: var(--jp-foreground);
  display: grid;
  font-size: 0.875rem;
  font-weight: 600;
  gap: 6px;
  grid-column: 1 / -1;
  line-height: 1.25;
}
.jp-theme [data-module-kind="lead-form"] form[data-journey-has-name-row="true"] > label[data-journey-field-width="half"] {
  grid-column: span 1;
}
.jp-theme [data-module-kind="lead-form"] input:not([type="checkbox"]) {
  background: var(--jp-background);
  border: 1px solid var(--jp-border);
  border-radius: var(--jp-radius-input, 6px);
  color: var(--jp-foreground);
  font: inherit;
  min-height: 44px;
  padding: 8px 12px;
  transition: border-color 120ms ease, box-shadow 120ms ease;
  width: 100%;
}
.jp-theme [data-module-kind="lead-form"] input:focus {
  border-color: var(--jp-primary);
  outline: 2px solid color-mix(in srgb, var(--jp-primary) 25%, transparent);
  outline-offset: 0;
}
.jp-theme [data-module-kind="lead-form"] [data-journey-honeypot] {
  left: -10000px;
  overflow: hidden;
  position: absolute;
  height: 0;
  width: 0;
}
.jp-theme [data-module-kind="lead-form"] [data-journey-consent] {
  align-items: flex-start;
  color: var(--jp-muted-foreground);
  display: flex;
  flex-direction: row;
  font-size: 0.9375rem;
  font-weight: 400;
  gap: 12px;
  line-height: 1.45;
  margin-top: 8px;
}
.jp-theme [data-module-kind="lead-form"] [data-journey-consent] input {
  margin-top: 3px;
  padding: 0;
}
.jp-theme [data-journey-form-actions] button {
  background: var(--jp-primary);
  border: 1px solid transparent;
  border-radius: var(--jp-radius-button);
  color: var(--jp-primary-foreground);
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  min-height: 44px;
  min-width: 112px;
  padding: 8px 16px;
  transition: filter 120ms ease;
}
.jp-theme [data-module-kind="lead-form"] button[type="reset"] {
  background: transparent;
  border-color: var(--jp-primary);
  color: var(--jp-primary);
}
.jp-theme [data-module-kind="lead-form"] button[type="submit"]:hover { filter: brightness(0.95); }
.jp-theme [data-module-kind="lead-form"] [data-journey-form-actions] {
  display: flex;
  gap: 12px;
  grid-column: 1 / -1;
  justify-content: flex-end;
  margin-top: 4px;
}

@media (max-width: 760px) {
  .jp-theme [data-module-kind="content"] [data-journey-content-layout],
  .jp-theme [data-module-kind="content"][data-media-side="right"] [data-journey-content-layout],
  .jp-theme [data-module-kind="content"][data-media-side="left"] [data-journey-content-layout] {
    align-items: stretch;
    flex-direction: column;
  }
  .jp-theme [data-module-kind="content"] [data-journey-content-copy],
  .jp-theme [data-module-kind="content"] [data-journey-content-media] {
    flex: 0 0 auto;
    width: 100%;
  }
  .jp-theme [data-module-kind="content"][data-media-wrap="true"] [data-journey-content-media],
  .jp-theme [data-module-kind="content"][data-media-side="left"][data-media-wrap="true"] [data-journey-content-media] {
    float: none;
    margin: 0 0 16px;
    width: 100%;
  }
}
@media (max-width: 560px) {
  /* The narrow track that lets three plans share a row on desktop would leave
     two cramped columns on a phone; stack instead. */
  .jp-theme [data-module-kind="pricing"] [data-journey-pricing-grid] {
    grid-template-columns: 1fr;
  }
  .jp-theme [data-module-kind="lead-form"] form {
    grid-template-columns: 1fr;
  }
  .jp-theme [data-module-kind="lead-form"] form[data-journey-has-name-row="true"] > label[data-journey-field-width="half"] {
    grid-column: 1 / -1;
  }
  .jp-theme [data-module-kind="lead-form"] [data-journey-form-actions] {
    flex-direction: column-reverse;
  }
  .jp-theme [data-module-kind="lead-form"] [data-journey-form-actions] button {
    width: 100%;
  }
}

.jp-theme [data-journey-sender] { align-items: center; display: flex; gap: 12px; margin: 0 0 4px; }
.jp-theme [data-journey-sender] img { border-radius: 999px; display: block; flex: none; height: 40px; object-fit: cover; width: 40px; }
.jp-theme [data-journey-sender] p { color: var(--jp-muted-foreground); font-size: 1rem; line-height: 1.35; margin: 0; }
.jp-theme [data-journey-sender] strong { color: var(--jp-foreground); display: block; font-weight: 600; }
.jp-theme [data-journey-sent-with] { color: #94a3b8; font-size: 0.8125rem; margin: 0 auto; max-width: var(--jp-page-max-width); padding: 4px var(--jp-page-x-padding) 40px; text-align: center; }
.jp-theme [data-journey-sent-with] a { align-items: center; color: inherit; display: inline-flex; gap: 6px; text-decoration: none; }
.jp-theme [data-journey-sent-with] a:hover { color: var(--jp-muted-foreground); }

</style>
