<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarity player · receding chrome</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  :root { --brand: #5b5bd6; font-family: InterVariable, Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #f5f5f3; color: #18181b; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 18px 28px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 14px 0 0; }
  .group { display: flex; gap: 4px; padding: 3px; background: #e7e7e4; border-radius: 999px; }
  header button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; color: #3f3f46; }
  header button[aria-pressed="true"] { background: #fff; color: #18181b; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  header.sub { padding-top: 0; }
  header .k { font-size: 12px; color: #71717a; margin-left: 6px; }
  #readout { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #71717a; margin: 10px 0 0; min-height: 17px; }
  mux-player { transition: --ink .35s ease, --center-ink .35s ease; }
  header label { font-size: 13px; display: flex; gap: 6px; align-items: center; margin-left: auto; }
  main { max-width: 920px; margin: 4px auto 64px; padding: 0 24px; }
  #note { font-size: 14px; line-height: 1.55; color: #52525b; margin: 0 0 16px; min-height: 44px; max-width: 70ch; }
  .frame { border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 24px 60px -12px rgba(15,23,42,.28); }
  mux-player { display: block; width: 100%; aspect-ratio: 16/9; --media-accent-color: var(--brand); --media-object-fit: contain; }
  mux-player[data-v="current"] { --airplay-button: none; --cast-button: none; --pip-button: none; --controls-backdrop-color: rgba(15,23,42,.45); --media-primary-color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Player chrome</h1>
  <div class="group" id="versions"></div>
  <div class="group" id="videos"></div>
</header>
<header class="sub">
  <span class="k">Play button</span><div class="group" id="plays"></div>
  <span class="k">Contrast</span><div class="group" id="contrasts"></div>
  <label>Brand <input type="color" id="brand" value="#5b5bd6"></label>
</header>
<main>
  <p id="note"></p>
  <div class="frame"><mux-player id="p" stream-type="on-demand" playbackrates="1 1.25 1.5 2" preload="metadata" crossorigin="anonymous" disable-tracking></mux-player></div>
  <p id="readout"></p>
</main>

<script>
const I = {
  play: '<path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6Z" fill="currentColor"/>',
  pause: '<rect x="6.5" y="5" width="4" height="14" rx="1.25" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.25" fill="currentColor"/>',
  replay: '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  vol: '<path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4 3.3a.8.8 0 0 0 1.4-.6V5.8a.8.8 0 0 0-1.4-.6l-4 3.3H5a1 1 0 0 0-1 1Z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  mute: '<path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4 3.3a.8.8 0 0 0 1.4-.6V5.8a.8.8 0 0 0-1.4-.6l-4 3.3H5a1 1 0 0 0-1 1Z" fill="currentColor"/><path d="m16.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  fsEnter: '<path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>',
  fsExit: '<path d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4M20 9h-3.5A1.5 1.5 0 0 1 15 7.5V4M15 20v-3.5a1.5 1.5 0 0 1 1.5-1.5H20M4 15h3.5A1.5 1.5 0 0 1 9 16.5V20" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>',
  cc: '<rect x="3" y="5.5" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M10.5 10.3a2 2 0 1 0 0 3.4M16.5 10.3a2 2 0 1 0 0 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  ccOn: '<rect x="3" y="5.5" width="18" height="13" rx="3" fill="currentColor"/><path d="M10.5 10.3a2 2 0 1 0 0 3.4M16.5 10.3a2 2 0 1 0 0 3.4" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>',
};
const svg = (name, slot) => `<svg ${slot ? `slot="${slot}" ` : ''}viewBox="0 0 24 24" aria-hidden="true">${I[name]}</svg>`;
const playBtn = (cls = '') => `<media-play-button notooltip class="${cls}">${svg('play', 'play')}${svg('pause', 'pause')}</media-play-button>`;
const centerBtn = (cls) => `<media-play-button notooltip class="${cls}"><span slot="play" class="glyph">${svg('play')}${svg('replay')}</span>${svg('pause', 'pause')}</media-play-button>`;
const muteBtn = (cls = '') => `<media-mute-button notooltip class="${cls}">${svg('vol', 'high')}${svg('vol', 'medium')}${svg('vol', 'low')}${svg('mute', 'off')}</media-mute-button>`;
const fsBtn = `<media-fullscreen-button notooltip>${svg('fsEnter', 'enter')}${svg('fsExit', 'exit')}</media-fullscreen-button>`;
const ccBtn = `<media-captions-button notooltip>${svg('ccOn', 'on')}${svg('cc', 'off')}</media-captions-button>`;
const rateBtn = `<media-playback-rate-button notooltip rates="1 1.25 1.5 2"></media-playback-rate-button>`;

// Everything every version shares: one icon weight, no tooltips, captions only with a track,
// 44px touch targets, a focus ring that survives bright video, reduced motion, and
// chrome that fades in quickly and out slowly.
const BASE = `
  media-controller { width: 100%; height: 100%; -webkit-font-smoothing: antialiased;
    --media-control-background: transparent; --media-control-hover-background: transparent;
    --media-primary-color: #fff; --media-text-color: #fff; --media-icon-color: #fff;
    --media-font-family: InterVariable, Inter, ui-sans-serif, system-ui, sans-serif;
    --media-font-size: 13px; --media-font-weight: 500; --media-tooltip-display: none;
    --media-control-transition-in: opacity .18s ease-out; --media-control-transition-out: opacity .9s ease;
    --media-focus-box-shadow: none; }
  media-controller[userinactive]:not([mediapaused]) { cursor: none; }
  svg { width: 22px; height: 22px; display: block; }
  .row > * { height: 40px; padding: 0 9px; flex-shrink: 0; }
  @media (pointer: coarse) { .row > * { height: 44px; min-width: 44px; } }
  media-time-display { font-variant-numeric: tabular-nums; letter-spacing: .01em; padding: 0 8px; }
  media-playback-rate-button { font-size: 13px; font-weight: 500; min-width: 36px; }
  @media (pointer: coarse) { media-controller[mediapaused] media-time-range:not(.ambient) { --media-range-thumb-opacity: 1; } }
  media-captions-button:not([mediasubtitleslist]) { display: none; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 5px rgba(0,0,0,.35); border-radius: 10px; }
  media-time-range { height: 24px; padding: 0; --media-range-padding: 0;
    --media-range-track-height: 3px; --media-range-track-border-radius: 999px;
    --media-range-thumb-width: 12px; --media-range-thumb-height: 12px; --media-range-thumb-opacity: 0;
    --media-range-thumb-background: #fff; --media-range-thumb-box-shadow: 0 1px 4px rgba(0,0,0,.35);
    --media-preview-thumbnail-border-radius: 8px; --media-preview-thumbnail-border: 1px solid rgba(255,255,255,.18);
    --media-preview-thumbnail-box-shadow: 0 8px 24px rgba(0,0,0,.35);
    --media-preview-time-background: transparent; --media-preview-time-margin: 6px 0 0; --media-preview-time-text-shadow: 0 1px 3px rgba(0,0,0,.6);
    transition: --media-range-track-height .16s ease, --media-range-thumb-opacity .16s ease; }
  media-time-range:hover, media-time-range:focus-visible { --media-range-track-height: 6px; --media-range-thumb-opacity: 1; }
  .glyph { display: grid; place-items: center; }
  .glyph svg + svg { display: none; }
  media-controller[mediaended] .glyph svg:first-child { display: none; }
  media-controller[mediaended] .glyph svg + svg { display: block; }
  .stack { display: grid; place-items: center; color: #fff; }
  .stack > * { grid-area: 1 / 1; }
  media-controller { --center: 64px; }
  media-controller:not([breakpointmd]) { --center: 52px; }
  media-controller:not([breakpointsm]) { --center: 44px; }
  media-loading-indicator { --media-loading-indicator-icon-height: 44px; --media-loading-icon-color: rgba(255,255,255,.9); }
  .pre { position: relative; display: grid; place-items: center; transition: opacity .25s ease; }
  .pre > * { grid-area: 1 / 1; }
  media-controller[mediahasplayed] .pre { opacity: 0; pointer-events: none; }
  .prePlay { width: var(--pp-w, calc(var(--center) * 1.15)); height: var(--pp-h, calc(var(--center) * 1.15)); padding: 0; border-radius: 999px;
    background: var(--pp-bg); color: var(--pp-fg); --media-primary-color: var(--pp-fg); --media-icon-color: var(--pp-fg);
    box-shadow: var(--pp-ring), var(--pp-shadow); backdrop-filter: var(--pp-backdrop); -webkit-backdrop-filter: var(--pp-backdrop);
    filter: var(--pp-filter); transition: transform .25s cubic-bezier(.2,.8,.2,1), background .2s ease; }
  .prePlay:hover { transform: scale(1.04); background: var(--pp-bg-hover, var(--pp-bg)); }
  .prePlay .glyph { visibility: var(--pp-glyph-vis, visible); }
  .prePlay svg { width: calc(var(--center) * var(--pp-glyph, .46)); height: calc(var(--center) * var(--pp-glyph, .46)); }
  .ppLabel { display: var(--pp-label, none); position: relative; z-index: 2; align-items: center; gap: 9px; pointer-events: none;
    height: calc(var(--center) * .78); padding: 0 calc(var(--center) * .36) 0 calc(var(--center) * .28);
    color: var(--pp-fg); font-size: calc(var(--center) * .23); font-weight: 600; letter-spacing: -.005em; }
  .ppLabel svg { width: calc(var(--center) * .26); height: calc(var(--center) * .26); }
  media-controller:not([mediahasplayed]) .chrome { opacity: 0; pointer-events: none; }
  media-controller:not([mediahasplayed]) .resume,
  media-controller:not([mediapaused]) .resume { opacity: 0; pointer-events: none; transform: scale(.92); }
  .resume { transition: opacity .2s ease, transform .2s cubic-bezier(.2,.8,.2,1); }
  .stack .resume { width: var(--center); height: var(--center); padding: 0; background: none; box-shadow: none; color: var(--center-ink, #fff);
    --media-primary-color: var(--center-ink, #fff); --media-icon-color: var(--center-ink, #fff);
    backdrop-filter: none; -webkit-backdrop-filter: none; filter: var(--center-lift, drop-shadow(0 0 1px rgba(0,0,0,.45)) drop-shadow(0 2px 10px rgba(0,0,0,.4))); }
  .stack .resume svg { width: calc(var(--center) * .62); height: calc(var(--center) * .62); }
  media-controller:not([breakpointmd]) .hide-sm { display: none; }
  media-controller:not([breakpointsm]) .hide-xs { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
`;

const pre = `<div class="pre">${'<media-play-button notooltip class="prePlay"><span slot="play" class="glyph">' + svg('play') + svg('replay') + '</span>' + svg('pause', 'pause') + '</media-play-button>'}<span class="ppLabel">${svg('play')}<span>Watch</span></span></div>`;
const stack = (inner) => `<div slot="centered-chrome" class="stack"><media-loading-indicator noautohide></media-loading-indicator>${inner}</div>`;
const shell = (css, body) => `<style>${BASE}${css}</style>
<media-controller breakpoints="sm:420 md:640" defaultstreamtype="on-demand" autohide="2" hotkeys="{{hotkeys}}" nohotkeys="{{nohotkeys}}" gesturesdisabled="{{disabled}}">
  <slot name="media" slot="media"></slot>
  <slot name="poster" slot="poster"></slot>
  ${body}
</media-controller>`;

const VERSIONS = {
  current: {
    label: 'Current',
    note: 'Mux default theme as shipped today, with production CSS. For reference.',
  },
  hairline: {
    label: '1 · Hairline',
    note: 'Before play there is one brand-colored play circle with the length in small type beneath it. While playing, the chrome leaves entirely except a 2px brand line along the bottom edge, so the viewer always knows how far in they are. On hover, a soft eased scrim rises only behind the controls.',
    tpl: shell(`
      media-controller:not([mediahasplayed]) .scrim { opacity: 0; }
      .scrim { position: absolute; inset: auto 0 0 0; height: clamp(96px, 34%, 190px); pointer-events: none;
        background: linear-gradient(to top, rgba(0,0,0,.56) 0%, rgba(0,0,0,.49) 12%, rgba(0,0,0,.4) 25%, rgba(0,0,0,.3) 38%, rgba(0,0,0,.2) 52%, rgba(0,0,0,.11) 67%, rgba(0,0,0,.05) 82%, transparent 100%); }
      .chrome { position: relative; z-index: 1; display: flex; flex-direction: column; width: 100%; box-sizing: border-box; padding: 0 16px 8px; transition: transform .9s ease; }
      media-controller[userinactive]:not([mediapaused]) .chrome { transform: translateY(6px); }
      media-controller:not([userinactive]) .chrome, media-controller[mediapaused] .chrome { transition-duration: .18s; }
      .chrome media-time-range { width: auto; align-self: stretch; margin: 0 2px; --media-range-track-background: rgba(255,255,255,.26); --media-time-range-buffered-color: rgba(255,255,255,.32); --media-range-bar-color: var(--media-accent-color); }
      .row { display: flex; align-items: center; margin: 0 -9px 0 -14px; }
      .spacer { flex: 1; }
      .ambient { position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; pointer-events: none; opacity: 0; transition: opacity .6s ease;
        --media-range-track-height: 3px; --media-range-track-border-radius: 999px; --media-range-thumb-opacity: 0;
        --media-range-track-background: rgba(128,128,128,.4); --media-time-range-buffered-color: transparent; --media-range-bar-color: var(--media-accent-color); }
      media-controller[userinactive]:not([mediapaused]) .ambient { opacity: .9; }
    `, `
      ${stack(`
        ${pre}
        ${centerBtn('resume')}`)}
      <div class="scrim"></div>
      <media-time-range class="ambient" noautohide></media-time-range>
      <div class="chrome">
        <media-time-range></media-time-range>
        <div class="row">
          ${playBtn()}${muteBtn('hide-sm')}
          <media-time-display showduration></media-time-display>
          <span class="spacer"></span>
          ${rateBtn}${ccBtn}${fsBtn}
        </div>
      </div>
    `),
  },
  bare: {
    label: '2 · Bare',
    note: 'The most receding. No scrim, no shapes, nothing behind the controls at all. White glyphs and type carry a layered soft shadow instead. While playing, nothing is on screen. This is the test of how far recession can go before legibility breaks; check it on the bright video.',
    tpl: shell(`
      .chrome { position: relative; z-index: 1; filter: var(--lift); mix-blend-mode: var(--blend, normal);
        --media-primary-color: var(--ink, #fff); --media-text-color: var(--ink, #fff); --media-icon-color: var(--ink, #fff); color: var(--ink, #fff); }
      .band { display: var(--band, none); position: absolute; inset: auto 0 0 0; height: clamp(72px, 30%, 160px); pointer-events: none;
        backdrop-filter: blur(14px) brightness(.8) saturate(1.1); -webkit-backdrop-filter: blur(14px) brightness(.8) saturate(1.1);
        -webkit-mask-image: linear-gradient(to top, #000 30%, transparent); mask-image: linear-gradient(to top, #000 30%, transparent); }
      .scrim { position: absolute; inset: auto 0 0 0; height: clamp(80px, 32%, 170px); pointer-events: none; opacity: var(--scrim-op, 0); transition: opacity .5s ease;
        background: linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,.6) 30%, rgba(0,0,0,.25) 65%, transparent); }
      .fixedScrim { position: absolute; inset: auto 0 0 0; height: clamp(96px, 34%, 190px); pointer-events: none; opacity: var(--fixed-scrim, 0);
        background: linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.7) 12%, rgba(0,0,0,.57) 25%, rgba(0,0,0,.43) 38%, rgba(0,0,0,.29) 52%, rgba(0,0,0,.16) 67%, rgba(0,0,0,.07) 82%, transparent 100%); }
      media-controller:not([mediahasplayed]) :is(.band, .scrim, .fixedScrim) { opacity: 0; }
      .chrome { width: 100%; box-sizing: border-box; padding: 0 12px 6px 8px; }
      .row { display: flex; align-items: center; gap: 2px; }
      .row media-time-range { flex: 1 1 auto; flex-shrink: 1; min-width: 60px; margin: 0 6px; padding: 0;
        --media-range-track-background: color-mix(in srgb, var(--ink, #fff) 40%, transparent); --media-time-range-buffered-color: color-mix(in srgb, var(--ink, #fff) 55%, transparent); --media-range-bar-color: var(--ink, #fff);
        --media-range-thumb-background: var(--ink, #fff); }
      media-time-display, media-playback-rate-button { text-shadow: var(--tshadow, 0 1px 2px rgba(0,0,0,.55)); }
    `, `
      ${stack(`
        ${pre}
        ${centerBtn('resume')}`)}
      <div class="band"></div>
      <div class="scrim"></div>
      <div class="fixedScrim"></div>
      <div class="chrome">
        <div class="row">
          ${playBtn()}
          <media-time-display showduration class="hide-sm"></media-time-display>
          <media-time-range></media-time-range>
          ${muteBtn('hide-sm')}${rateBtn}${ccBtn}${fsBtn}
        </div>
      </div>
    `),
  },
  capsule: {
    label: '3 · Capsule',
    note: 'QuickTime on macOS. One compact frosted capsule floats above the video, centered, no wider than it needs to be; the rest of the frame stays untouched. It disappears completely while playing. On a phone it widens to the edges and drops the elapsed time rather than squeezing the buttons.',
    tpl: shell(`
      .glass { background: rgba(18,18,22,.62); backdrop-filter: blur(22px) saturate(1.15); -webkit-backdrop-filter: blur(22px) saturate(1.15);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.11), 0 10px 30px -10px rgba(0,0,0,.5); }
      .chrome { width: 100%; box-sizing: border-box; display: flex; justify-content: center; padding: 0 12px 14px;
        transition: transform .9s ease; }
      media-controller[userinactive]:not([mediapaused]) .chrome { transform: translateY(8px); }
      media-controller:not([userinactive]) .chrome, media-controller[mediapaused] .chrome { transition-duration: .18s; }
      .capsule { box-sizing: border-box; display: flex; align-items: center; width: 100%; max-width: 600px; height: 46px; padding: 0 6px 0 2px; border-radius: 999px; }
      .capsule media-playback-rate-button { color: rgba(255,255,255,.88); }
      media-controller:not([breakpointsm]) .chrome { padding: 0 8px 8px; }
      media-controller:not([breakpointsm]) .capsule { height: 42px; }
      .capsule > * { border-radius: 999px; }
      .capsule media-time-range { flex: 1 1 auto; flex-shrink: 1; min-width: 64px; margin: 0 8px; padding: 0;
        --media-range-track-background: rgba(255,255,255,.24); --media-time-range-buffered-color: rgba(255,255,255,.32); --media-range-bar-color: #fff; }
      .capsule media-time-display { padding: 0 2px; min-width: 38px; color: rgba(255,255,255,.88); }
    `, `
      ${stack(`
        ${pre}
        ${centerBtn('resume glass')}`)}
      <div class="chrome">
        <div class="capsule glass row">
          ${playBtn()}
          <media-time-display class="hide-sm"></media-time-display>
          <media-time-range></media-time-range>
          <media-time-display remaining class="hide-xs"></media-time-display>
          ${muteBtn('hide-sm')}${rateBtn}${ccBtn}${fsBtn}
        </div>
      </div>
    `),
  },
};

for (const [id, v] of Object.entries(VERSIONS)) {
  if (!v.tpl) continue;
  const t = document.createElement('template');
  t.id = `clarity-${id}`;
  t.innerHTML = v.tpl;
  document.body.append(t);
}

// Lets the scrubber's thickness and thumb animate instead of snapping.
CSS.registerProperty?.({ name: '--media-range-track-height', syntax: '<length>', inherits: true, initialValue: '4px' });
CSS.registerProperty?.({ name: '--media-range-thumb-opacity', syntax: '<number>', inherits: true, initialValue: '1' });
CSS.registerProperty?.({ name: '--ink', syntax: '<color>', inherits: true, initialValue: '#fff' });
CSS.registerProperty?.({ name: '--center-ink', syntax: '<color>', inherits: true, initialValue: '#fff' });

const VIDEOS = {
  talk: { label: 'Talking head', id: 'EcHgOK9coz5K4rjSwOkoE7Y7O01201YMIC200RI6lNxnhs' },
  bright: { label: 'Bright', id: 'VcmKA6aqzIzlg3MayLJDnbF55kX00mds028Z65QxvBYaA' },
  dark: { label: 'Dark', id: 'a4nOgmxGWg6gULfcBbAa00gXyfcwPnAFldF8RdsNyk8M' },
};

// Play button styles: each is a set of --pp-* properties the shared .prePlay reads.
const NONE = '0 0 0 0 transparent';
const PLAYS = {
  disc: { label: 'White disc', vars: { '--pp-bg': '#fff', '--pp-bg-hover': '#fff', '--pp-fg': '#0b0b0f', '--pp-ring': NONE,
    '--pp-shadow': '0 14px 36px -10px rgba(0,0,0,.5)', '--pp-backdrop': 'none', '--pp-filter': 'none' } },
  glass: { label: 'Dark glass', vars: { '--pp-bg': 'rgba(14,14,18,.4)', '--pp-bg-hover': 'rgba(14,14,18,.52)', '--pp-fg': '#fff',
    '--pp-ring': 'inset 0 0 0 1px rgba(255,255,255,.18)', '--pp-shadow': '0 12px 32px -12px rgba(0,0,0,.5)',
    '--pp-backdrop': 'blur(20px) saturate(1.1)', '--pp-filter': 'none' } },
  ring: { label: 'Ring', vars: { '--pp-bg': 'rgba(0,0,0,.14)', '--pp-bg-hover': 'rgba(0,0,0,.26)', '--pp-fg': '#fff',
    '--pp-ring': 'inset 0 0 0 1.5px rgba(255,255,255,.92)', '--pp-shadow': '0 8px 24px -10px rgba(0,0,0,.45)',
    '--pp-backdrop': 'blur(6px)', '--pp-filter': 'drop-shadow(0 1px 3px rgba(0,0,0,.25))', '--pp-glyph': '.4' } },
  glyph: { label: 'Glyph only', vars: { '--pp-bg': 'transparent', '--pp-fg': '#fff', '--pp-ring': NONE, '--pp-shadow': NONE,
    '--pp-backdrop': 'none', '--pp-filter': 'drop-shadow(0 0 1px rgba(0,0,0,.5)) drop-shadow(0 2px 12px rgba(0,0,0,.45))', '--pp-glyph': '.72' } },
  tint: { label: 'Brand glass', vars: { '--pp-bg': 'linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 55%), color-mix(in srgb, var(--media-accent-color) 58%, rgba(10,10,14,.5))',
    '--pp-fg': '#fff', '--pp-ring': 'inset 0 0 0 1px rgba(255,255,255,.24)', '--pp-shadow': '0 14px 34px -12px color-mix(in srgb, var(--media-accent-color) 60%, rgba(0,0,0,.6))',
    '--pp-backdrop': 'blur(20px) saturate(1.2)', '--pp-filter': 'none' } },
  deep: { label: 'Deep glass', vars: { '--pp-bg': 'rgba(12,12,16,.62)', '--pp-bg-hover': 'rgba(12,12,16,.72)', '--pp-fg': '#fff',
    '--pp-ring': 'inset 0 0 0 1px rgba(255,255,255,.16)', '--pp-shadow': '0 12px 32px -12px rgba(0,0,0,.55)',
    '--pp-backdrop': 'blur(20px) saturate(1.1)', '--pp-filter': 'none' } },
  adaptive: { label: 'Adaptive glass', adaptive: true, vars: { '--pp-bg': 'rgba(14,14,18,.4)', '--pp-fg': '#fff',
    '--pp-ring': 'inset 0 0 0 1px rgba(255,255,255,.2)', '--pp-shadow': '0 12px 32px -12px rgba(0,0,0,.5)',
    '--pp-backdrop': 'blur(20px) saturate(1.1)', '--pp-filter': 'none' } },
  watch: { label: 'Watch pill', vars: { '--pp-bg': 'rgba(14,14,18,.46)', '--pp-bg-hover': 'rgba(14,14,18,.58)', '--pp-fg': '#fff',
    '--pp-ring': 'inset 0 0 0 1px rgba(255,255,255,.16)', '--pp-shadow': '0 12px 32px -12px rgba(0,0,0,.5)',
    '--pp-backdrop': 'blur(20px) saturate(1.1)', '--pp-filter': 'none', '--pp-label': 'flex', '--pp-glyph-vis': 'hidden', '--pp-w': '100%', '--pp-h': '100%' } },
};

// Contrast for Bare's controls. "Adaptive" modes are fed by the sampler below.
const SOFT_LIFT = 'drop-shadow(0 0 1px rgba(0,0,0,.45)) drop-shadow(0 1px 6px rgba(0,0,0,.35))';
const CONTRASTS = {
  soft: { label: 'Soft shadow', vars: { '--lift': SOFT_LIFT } },
  halo: { label: 'Halo', vars: { '--lift': 'drop-shadow(0 0 1px rgba(0,0,0,.85)) drop-shadow(0 0 5px rgba(0,0,0,.5)) drop-shadow(0 2px 16px rgba(0,0,0,.45))',
    '--tshadow': '0 0 2px rgba(0,0,0,.85), 0 1px 10px rgba(0,0,0,.55)' } },
  band: { label: 'Blur band', vars: { '--lift': SOFT_LIFT, '--band': 'block' } },
  fixedLight: { label: 'Scrim · light', vars: { '--lift': SOFT_LIFT, '--fixed-scrim': '.5' } },
  fixedMedium: { label: 'Scrim · Hairline', vars: { '--lift': SOFT_LIFT, '--fixed-scrim': '.7' } },
  fixedStrong: { label: 'Scrim · strong', vars: { '--lift': SOFT_LIFT, '--fixed-scrim': '1' } },
  scrim: { label: 'Adaptive scrim', vars: { '--lift': SOFT_LIFT }, adaptive: true },
  ink: { label: 'Adaptive ink', vars: {}, adaptive: true },
  difference: { label: 'Difference', vars: { '--lift': 'none', '--tshadow': 'none', '--blend': 'difference' } },
};
const CONTRAST_KEYS = ['--fixed-scrim', '--lift', '--tshadow', '--band', '--blend', '--scrim-op', '--ink', '--center-ink', '--center-lift'];

const params = new URLSearchParams(location.search);
const state = { v: params.get('v') || 'bare', video: params.get('video') || 'talk', pp: params.get('pp') || 'deep', c: params.get('c') || 'fixedMedium' };
const p = document.getElementById('p');

function render() {
  const v = VERSIONS[state.v], video = VIDEOS[state.video];
  p.dataset.v = state.v;
  if (v.tpl) p.setAttribute('theme', `clarity-${state.v}`); else p.removeAttribute('theme');
  if (p.getAttribute('playback-id') !== video.id) {
    p.setAttribute('playback-id', video.id);
    p.setAttribute('poster', `https://image.mux.com/${video.id}/thumbnail.webp?time=8&width=1600`);
  }
  document.getElementById('note').textContent = v.note;
  for (const [k, val] of Object.entries(PLAYS[state.pp].vars)) p.style.setProperty(k, val);
  for (const k of ['--pp-glyph', '--pp-label', '--pp-glyph-vis', '--pp-w', '--pp-h', '--pp-bg-hover']) if (!(k in PLAYS[state.pp].vars)) p.style.removeProperty(k);
  for (const k of CONTRAST_KEYS) p.style.removeProperty(k);
  for (const [k, val] of Object.entries(CONTRASTS[state.c].vars)) p.style.setProperty(k, val);
  inkDark = false; centerDark = false;
  for (const b of document.querySelectorAll('[data-k]')) b.setAttribute('aria-pressed', String(state[b.dataset.k] === b.dataset.val));
  history.replaceState(null, '', `?v=${state.v}&video=${state.video}&pp=${state.pp}&c=${state.c}`);
}

function buttons(el, k, map) {
  for (const [val, { label }] of Object.entries(map)) {
    const b = document.createElement('button');
    Object.assign(b.dataset, { k, val });
    b.textContent = label;
    b.onclick = () => { state[k] = val; render(); };
    el.append(b);
  }
}
buttons(document.getElementById('versions'), 'v', VERSIONS);
buttons(document.getElementById('videos'), 'video', VIDEOS);
buttons(document.getElementById('plays'), 'pp', PLAYS);
buttons(document.getElementById('contrasts'), 'c', CONTRASTS);

// Samples the frame twice a second: the poster before play, the video after.
// Reads the bottom band, where the controls sit. Needs CORS, which Mux's
// image and stream hosts allow; crossorigin="anonymous" is set on the player.
const canvas = Object.assign(document.createElement('canvas'), { width: 48, height: 27 });
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let posterImg, posterSrc, inkDark = false;
function frameSource() {
  const video = p.media?.nativeEl;
  if (video && video.readyState >= 2 && (video.currentTime > 0 || !video.paused)) return video;
  const src = p.getAttribute('poster');
  if (posterSrc !== src) { posterSrc = src; posterImg = Object.assign(new Image(), { crossOrigin: 'anonymous', src }); }
  return posterImg?.complete && posterImg.naturalWidth ? posterImg : null;
}
function luminance(x0, y0, x1, y1) {
  const w = canvas.width, h = canvas.height;
  const { data } = ctx.getImageData(Math.floor(x0 * w), Math.floor(y0 * h), Math.ceil((x1 - x0) * w), Math.ceil((y1 - y0) * h));
  let sum = 0;
  for (let i = 0; i < data.length; i += 4) sum += (0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2]) / 255;
  return sum / (data.length / 4);
}
let centerDark = false;
function sample() {
  const src = frameSource();
  if (!src) return null;
  ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
  return { bottom: luminance(0, 0.7, 1, 1), center: luminance(0.4, 0.35, 0.6, 0.65) };
}
setInterval(() => {
  const mode = CONTRASTS[state.c];
  let lum, center;
  try { ({ bottom: lum, center } = sample() ?? {}); } catch (e) { document.getElementById('readout').textContent = `sampling blocked: ${e.name}`; return; }
  if (lum == null) return;
  if (state.pp === 'adaptive') {
    const a = 0.3 + 0.45 * Math.min(1, Math.max(0, (center - 0.2) / 0.7));
    p.style.setProperty('--pp-bg', `rgba(14,14,18,${a.toFixed(2)})`);
    p.style.setProperty('--pp-bg-hover', `rgba(14,14,18,${Math.min(0.85, a + 0.1).toFixed(2)})`);
  }
  let action = 'no adaptation in this mode';
  if (state.c === 'scrim') {
    const op = Math.min(1, Math.max(0, (lum - 0.3) / 0.5)) * 0.55;
    p.style.setProperty('--scrim-op', op.toFixed(2));
    action = `scrim ${op.toFixed(2)}`;
  } else if (state.c === 'ink') {
    if (!inkDark && lum > 0.64) inkDark = true;
    else if (inkDark && lum < 0.54) inkDark = false;
    p.style.setProperty('--ink', inkDark ? '#0e0e12' : '#ffffff');
    p.style.setProperty('--lift', inkDark ? 'drop-shadow(0 0 1px rgba(255,255,255,.6)) drop-shadow(0 1px 6px rgba(255,255,255,.4))' : SOFT_LIFT);
    p.style.setProperty('--tshadow', inkDark ? '0 1px 2px rgba(255,255,255,.5)' : '0 1px 2px rgba(0,0,0,.55)');
    if (!centerDark && center > 0.64) centerDark = true;
    else if (centerDark && center < 0.54) centerDark = false;
    p.style.setProperty('--center-ink', centerDark ? '#0e0e12' : '#ffffff');
    p.style.setProperty('--center-lift', centerDark ? 'drop-shadow(0 0 1px rgba(255,255,255,.6)) drop-shadow(0 2px 10px rgba(255,255,255,.4))' : 'drop-shadow(0 0 1px rgba(0,0,0,.45)) drop-shadow(0 2px 10px rgba(0,0,0,.4))');
    action = `bar ink ${inkDark ? 'dark' : 'white'} · center ${center.toFixed(2)} → ${centerDark ? 'dark' : 'white'}`;
  }
  document.getElementById('readout').textContent = `bottom luminance ${lum.toFixed(2)} · ${mode.adaptive ? action : 'fixed treatment'}`;
}, 500);
addEventListener('keydown', (e) => {
  if (e.target !== document.body) return;
  const keys = Object.keys(VERSIONS); const i = '0123'.indexOf(e.key);
  if (i >= 0) { state.v = keys[i]; render(); }
});
document.getElementById('brand').oninput = (e) => document.documentElement.style.setProperty('--brand', e.target.value);
render();
</script>
