<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab frame</title>
<style>html, body { margin: 0; background: #fff; overflow: hidden; } iframe { border: 0; display: block; margin: 0 auto; }</style>
</head>
<body>
<iframe id="f" title="variant"></iframe>
<script>
  // Renders one URL at an exact width, so headless Chrome can check and capture widths below its 500px window minimum.
  var p = new URLSearchParams(location.search);
  var f = document.getElementById("f");
  f.style.width = (Number(p.get("w")) || 390) + "px";
  f.style.height = (Number(p.get("h")) || 844) + "px";
  f.src = p.get("src");
  if (p.get("check")) {
    var t = setInterval(function () {
      try {
        var r = f.contentDocument && f.contentDocument.getElementById("lab-check");
        if (!r) return;
        clearInterval(t);
        var s = document.createElement("script");
        s.type = "application/json";
        s.id = "lab-check";
        s.textContent = r.textContent;
        document.body.appendChild(s);
      } catch (e) {}
    }, 100);
  }
</script>
</body>
</html>
