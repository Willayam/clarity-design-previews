<!doctype html><html lang="en"><head>
<script type="application/json" id="lab-meta">{"id": "v05", "name": "Call dock", "axis": "disclosure", "idea": "A familiar call dock keeps visual choices hidden until asked for.", "cost": "An extra click to compare options, with space reserved for the popovers.", "model": "gpt-6-astra", "round": 1, "parents": [], "parts": ["preview", "controls"], "recommended": false, "why": "", "old": true}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Call dock</title><link rel="stylesheet" href="../kit/app.css"><script src="../kit/recorder-kit.js"></script>
<style>
.v05{max-width:1200px;margin:auto}.v05-preview{width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden}.v05-controls{position:relative;padding-top:168px}.v05-dock{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:auto;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--btn-glass-shadow)}.v05-dock>button{min-height:44px}.v05-devices [data-slot="recorder-device-controls"]{display:flex;width:auto;gap:8px}.v05-devices [data-slot="recorder-device-controls"]>div{width:148px}.v05-devices button{height:44px}.v05-pop{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:560px;max-width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);box-shadow:var(--btn-glass-shadow);z-index:2}.v05-pop[hidden]{display:none}.v05-pophead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;font-weight:600}.v05-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.v05-option{padding:4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);font-size:12px;text-align:left;cursor:pointer}.v05-option:hover{background:var(--muted)}.v05-option[aria-pressed="true"]{outline:2px solid var(--primary);outline-offset:0}.v05-option:focus-visible,.v05 button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}.v05-thumb{display:block;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:var(--radius);margin-bottom:5px}.v05-option span:last-child{display:block;padding:2px}.v05-finish{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.v05-actions{display:flex;gap:8px}.v05-status{min-height:24px;margin:12px auto;text-align:center;font-size:13px;color:var(--muted-foreground)}.v05-change{display:flex;justify-content:center;margin-top:12px}.v05-devicepick{display:flex;align-items:center;gap:12px;width:100%;padding:8px}.v05-devicepick .v05-thumb{width:120px;margin:0}.v05 button:disabled{opacity:.4;cursor:default}.v05-pop[data-kind="shape"] .v05-options{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(min-width:1000px){.v05{max-width:min(1200px,calc(57vh * 16 / 9))}}
@media(max-width:640px){.v05-controls{padding-top:206px}.v05-dock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;padding:8px;gap:8px}.v05-devices{grid-column:span 2}.v05-devices [data-slot="recorder-device-controls"]>div{width:calc(50% - 4px)}.v05-devices [data-slot="recorder-device-controls"]{width:100%}.v05-dock>[data-action]{grid-column:1/-1;width:100%}.v05-recorder .v05-desktop{display:none}.v05-pop{bottom:124px}.v05-options{grid-template-columns:repeat(2,minmax(0,1fr))}.v05-finish{flex-direction:column}.v05-actions{flex-wrap:wrap;justify-content:center}.v05-style .v05-pop{bottom:124px}.v05-style .v05-controls{padding-top:260px}}
.v05-devices button{padding-left:8px;padding-right:8px}.v05-devices button>span{gap:4px}@media(max-width:640px){.v05-devices button>span>svg:last-child{display:none}.v05-devices button{font-size:12px}.v05-actions{display:grid;grid-template-columns:minmax(0,1fr);width:100%}.v05-actions button{width:100%}.v05-style .v05-controls{padding-top:230px}}
</style></head><body><script>
const K=RecorderKit,S=K.store({layout:'inset'});let opened=null,busy=false,done=false,cancelApply;const original={...S.get()};
const btn=(label,icon,attrs='',variant='outline',size='sm')=>K.button({label,iconName:icon,attrs,variant,size});
function render(){cancelApply?.();busy=false;opened=null;const style=location.hash==='#style',page=K.mountShell(style?'Untitled video':'Record video');page.innerHTML=`<div class="v05 v05-${style?'style':'recorder'}"><div class="v05-preview" data-part="preview"></div>${style?`<div class="v05-finish">${K.trimStyleTabs()}<div class="v05-actions">${K.finishActions()}</div></div>`:''}<section class="v05-controls" data-part="controls" aria-label="${style?'Style':'Recording controls'}"><div class="v05-pop" hidden></div><div class="v05-dock">${style?'':`<div class="v05-devices">${K.deviceControls()}</div>`}${btn('Layout','layout-template','data-open="layout" aria-expanded="false"')}${btn('Background','image','data-open="background" aria-expanded="false"')}${btn('Shape','circle','data-open="shape" aria-expanded="false"')}${style?btn('Apply',null,'data-action','default','lg-thumb'):K.button({label:'Start recording',record:true,size:'lg-thumb',attrs:'data-action'})}</div>${style?'<div class="v05-status" role="status"></div><div class="v05-change" data-reset></div>':`<div class="v05-change">${btn('Change screen','monitor-up','data-screen')}</div>`}</section></div>`;
const root=page.querySelector('.v05'),preview=root.querySelector('[data-part="preview"]'),pop=root.querySelector('.v05-pop');
// The kit button supplies its own class attribute.
root.querySelectorAll('[data-open="background"],[data-open="shape"]').forEach(b=>b.classList.add('v05-desktop'));
const devices=root.querySelectorAll('.v05-devices button');devices.forEach((b,i)=>{b.dataset.open=i?'microphone':'camera';b.querySelector('span span').textContent=i?'Microphone':'Camera';});
function paint(){const s=S.get();K.scene(preview,s.layout==='recorded'?{...s,layout:'inset'}:s);const a=K.applies(s);root.querySelectorAll('[data-open]').forEach(b=>{b.disabled=busy||(b.dataset.open==='shape'&&!a.shape)||(b.dataset.open==='background'&&!a.background);b.setAttribute('aria-expanded',String(opened===b.dataset.open));});root.querySelector('[data-action]').disabled=busy;const share=!s.screen&&s.layout!=='camera';if(!style){root.querySelector('[data-action]').innerHTML=share?K.icon('monitor-up')+'Share screen':'<span class="size-3 flex-none rounded-full bg-current"></span>Start recording';root.querySelector('[data-screen]').hidden=!s.screen;}}
function close(){opened=null;pop.hidden=true;paint()}
function open(kind){if(opened===kind){close();return}opened=kind;paint();pop.hidden=false;pop.dataset.kind=kind;const title={layout:'Layout',background:'Background',shape:'Camera shape',camera:'Camera',microphone:'Microphone'}[kind];pop.innerHTML=`<div class="v05-pophead">${title}${btn('','x','data-close aria-label="Close options"','ghost','icon')}</div><div class="v05-options"></div>`;pop.querySelector('[data-close]').onclick=()=>{close();root.querySelector(`[data-open="${kind}"]`).focus()};let options=kind==='layout'?K.LAYOUTS:kind==='background'?K.BACKGROUNDS:K.SHAPES;if(style&&kind==='layout')options=[...options,{id:'recorded',label:'Recorded cuts'}];const grid=pop.querySelector('.v05-options');if(kind==='camera'||kind==='microphone'){grid.style.display='block';grid.innerHTML=`<button class="v05-option v05-devicepick" aria-pressed="true"><span class="v05-thumb"></span><span>${kind==='camera'?'FaceTime HD Camera':'MacBook Pro Microphone'}</span>${K.icon('check')}</button>`;if(kind==='camera')K.face(grid.querySelector('.v05-thumb'),S.get().background);else grid.querySelector('.v05-thumb').innerHTML='<span class="block h-1 rounded-full bg-primary" style="margin-top:28px;width:35%"></span>';grid.querySelector('button').onclick=close;return;}
options.forEach(o=>{const b=document.createElement('button');b.className='v05-option';b.setAttribute('aria-pressed',String(S.get()[kind]===o.id));b.innerHTML=`<span class="v05-thumb"></span><span>${o.label}</span>`;grid.append(b);const candidate={...S.get(),[kind]:o.id};if(candidate.layout==='recorded')candidate.layout='inset';K.scene(b.firstChild,candidate);b.onmouseenter=b.onfocus=()=>K.scene(preview,candidate);b.onmouseleave=b.onblur=paint;b.onclick=()=>{S.set({[kind]:o.id});close();root.querySelector(`[data-open="${kind}"]`).focus()};});}
root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));root.onkeydown=e=>{if(e.key==='Escape'&&opened){const kind=opened;close();root.querySelector(`[data-open="${kind}"]`).focus()}};root.querySelector('[data-screen]')?.addEventListener('click',()=>{S.set({screen:false});close()});root.querySelector('[data-action]').onclick=()=>{if(!style){if(!S.get().screen&&S.get().layout!=='camera'){S.set({screen:true});paint()}return}close();busy=true;root.querySelectorAll('button').forEach(b=>b.disabled=true);cancelApply=K.fakeApply(status=>{root.querySelector('.v05-status').textContent=K.statusCopy(status);if(status.kind==='done'){busy=false;done=true;root.querySelectorAll('button').forEach(b=>b.disabled=false);paint();showReset()}})};
function showReset(){if(!done)return;root.querySelector('[data-reset]').innerHTML=btn('Back to original','rotate-ccw');root.querySelector('[data-reset] button').onclick=()=>{S.set(original);done=false;root.querySelector('[data-reset]').innerHTML='';root.querySelector('.v05-status').textContent='';close()}}
if(style){showReset();root.querySelectorAll('.v05-actions button').forEach((b,i)=>b.onclick=()=>{if(i===0)location.hash='recorder';else root.querySelector('.v05-status').textContent=i===1?'Page builder opens after recording.':'Link copied';});root.querySelectorAll('[role="tab"]').forEach(b=>b.onclick=()=>{root.querySelector('.v05-status').textContent=b.textContent.trim()==='Trim'?'Trim is available after recording.':''});}paint();}
window.addEventListener('hashchange',render);render();
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
