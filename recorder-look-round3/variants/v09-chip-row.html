const K=RecorderKit,S=K.store({layout:'inset',shape:'squircle',background:'keep',bubble:'large'});let root,route,busy=false,done=false,tab='style',cuts=false,cancelApply,elapsed=0,paused=false,timer;let original={...S.get()},takeLayouts=['inset'];
const B=(label,attrs='',variant='outline',size='sm',iconName)=>K.button({label,attrs,variant,size,iconName});
function chips(){return `<div class="v09-chips" aria-label="Background and camera shape">${K.BACKGROUNDS.map(o=>`<button class="v09-chip" data-key="background" data-value="${o.id}" aria-label="${o.label}"><span class="sr-only">${o.label}</span></button>`).join('')}<span class="v09-divider"></span>${K.SHAPES.map(o=>`<button class="v09-chip" data-key="shape" data-value="${o.id}" aria-label="${o.label}">${o.id==='cutout'?K.icon('user-round',22):`<span class="v09-shape v09-shape-${o.id}"></span>`}</button>`).join('')}</div>`}
function layouts(){return `<div class="v09-layouts" aria-label="Layout">${[...K.LAYOUTS,...(route==='style'?[{id:'cuts',label:'Recorded cuts'}]:[])].map(o=>`<button class="v09-layout" data-key="layout" data-value="${o.id}"><span class="v09-thumb" data-thumb="${o.id}"></span><span>${o.label}</span>${K.icon('check')}</button>`).join('')}</div>`}
function time(){return `${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`}
function render(){clearInterval(timer);cancelApply?.();busy=false;route=['style','recording'].includes(location.hash.slice(1))?location.hash.slice(1):'recorder';const page=K.mountShell(route==='style'?'Untitled video':'Record video');root=document.createElement('div');root.className=`v09 v09-${route}`;page.append(root);root.innerHTML=`<div class="v09-grid"><div class="v09-picture" data-part="preview"></div>${route==='recording'?`<div class="v09-row" data-part="controls"><div class="v09-running"><label>Layout <select aria-label="Layout">${K.LAYOUTS.map(o=>`<option value="${o.id}">${o.label}</option>`).join('')}</select></label><div class="v09-running-actions">${K.button({record:true,size:'lg-thumb',label:'Stop · '+time(),attrs:'data-stop'})}${B('Pause','data-pause','outline','lg-thumb','pause')}</div></div></div>`:`<aside class="v09-rail" data-part="controls"><div class="v09-tabs">${route==='style'?`<button class="v09-tab" role="tab" data-tab="trim">Trim</button><button class="v09-tab" role="tab" data-tab="style">Style</button>`:'<span class="v09-tab" aria-selected="true">Layout</span>'}</div>${layouts()}<div class="v09-foot">${route==='style'?`<div class="v09-status" role="status"></div>${B('Back to original','data-reset hidden','ghost')}${B('Apply','data-apply','default','lg-thumb')}`:`${B('Change screen','data-change','ghost','sm','monitor-up')}<div data-action></div>`}</div></aside><div class="v09-row">${route==='recorder'?`<div class="v09-devices">${K.deviceControls()}</div>`:`<div class="v09-actions">${K.finishActions()}</div>`}${chips()}</div><div class="v09-timeline" hidden>Trim timeline</div>`}</div>`;
root.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const {key,value}=b.dataset;if(key==='layout'){cuts=value==='cuts';if(cuts)S.set({layout:takeLayouts[0]});else S.set({layout:value});}else S.set({[key]:value});paint()});
root.querySelector('[data-change]')?.addEventListener('click',()=>{S.set({screen:false});paint()});root.querySelector('[data-apply]')?.addEventListener('click',()=>{busy=true;done=false;paint();cancelApply=K.fakeApply(status=>{root.querySelector('.v09-status').textContent=K.statusCopy(status);if(status.kind==='done'){busy=false;done=true;}paint()})});root.querySelector('[data-reset]')?.addEventListener('click',()=>{S.set(original);cuts=false;done=false;root.querySelector('.v09-status').textContent='';paint()});
root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;paint()});
root.querySelectorAll('.v09-devices [aria-haspopup=menu]').forEach(b=>{b.onclick=()=>{const existing=b.parentElement.querySelector('.v09-menu');if(existing){existing.remove();b.setAttribute('aria-expanded','false');return}const m=document.createElement('div');m.className='v09-menu';m.innerHTML=`<button>${b.getAttribute('aria-label').split(': ')[1]} ${K.icon('check')}</button>`;b.parentElement.append(m);b.setAttribute('aria-expanded','true');m.firstChild.onclick=()=>{m.remove();b.setAttribute('aria-expanded','false');b.focus()};m.firstChild.focus()}});
root.onkeydown=e=>{if(e.key==='Escape')root.querySelectorAll('.v09-menu').forEach(m=>{const b=m.parentElement.querySelector('button');m.remove();b.setAttribute('aria-expanded','false');b.focus()})};
if(route==='style'){root.querySelectorAll('.v09-actions button').forEach((b,i)=>b.onclick=async()=>{if(i===0){location.hash='recorder';return}if(i===1){root.querySelector('.v09-status').textContent='Page builder opens after recording.';return}try{await navigator.clipboard.writeText(location.href);root.querySelector('.v09-status').textContent='Link copied'}catch{root.querySelector('.v09-status').textContent='Could not copy link'}})}
if(route==='recording'){root.querySelector('select').onchange=e=>{S.set({layout:e.target.value});takeLayouts.push(e.target.value);paint()};root.querySelector('[data-stop]').onclick=()=>{original={...S.get()};location.hash='style'};root.querySelector('[data-pause]').onclick=()=>{paused=!paused;root.querySelector('[data-pause]').innerHTML=K.icon(paused?'play':'pause')+(paused?'Resume':'Pause')};timer=setInterval(()=>{if(!paused){elapsed++;root.querySelector('[data-stop]').innerHTML='<span class="size-3 flex-none rounded-full bg-current"></span>Stop · '+time()}},1000)}paint()}
function paint(){if(!root)return;const s=S.get(),a=K.applies(s);K.scene(root.querySelector('.v09-picture'),s);root.querySelectorAll('[data-thumb]').forEach(t=>K.scene(t,{...s,layout:t.dataset.thumb==='cuts'?takeLayouts[0]:t.dataset.thumb,screen:true}));root.querySelectorAll('[data-key]').forEach(b=>{const {key,value}=b.dataset;b.setAttribute('aria-pressed',String(key==='layout'?(cuts?value==='cuts':s.layout===value):s[key]===value));b.disabled=busy||(key==='background'&&!a.background)||(key==='shape'&&!a.shape);if(key==='background')K.face(b,value)});if(route==='recorder'){const share=!s.screen&&s.layout!=='camera';root.querySelector('[data-action]').innerHTML=share?B('Share screen','data-start','default','lg-thumb','monitor-up'):K.button({record:true,size:'lg-thumb',label:'Start recording',attrs:'data-start'});root.querySelector('[data-start]').style.width='100%';root.querySelector('[data-start]').onclick=()=>{if(share){S.set({screen:true});paint()}else{elapsed=0;paused=false;takeLayouts=[s.layout];location.hash='recording'}};root.querySelector('[data-change]').style.visibility=s.screen?'visible':'hidden'}if(route==='recording')root.querySelector('select').value=s.layout;if(route==='style'){root.classList.toggle('v09-trim',tab==='trim');root.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.disabled=busy});root.querySelector('.v09-timeline').hidden=tab!=='trim';root.querySelector('.v09-chips').style.visibility=tab==='trim'?'hidden':'visible';root.querySelector('[data-reset]').hidden=false;root.querySelector('[data-reset]').style.visibility=done?'visible':'hidden';root.querySelectorAll('.v09-foot button,.v09-actions button').forEach(b=>b.disabled=busy)}}
window.addEventListener('hashchange',()=>{if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const transition=document.startViewTransition(render);transition.ready.then(()=>document.getAnimations().forEach(a=>{if(a.effect?.pseudoElement)a.effect.updateTiming({duration:180,easing:'ease-out'})}));}else render()});render();
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
