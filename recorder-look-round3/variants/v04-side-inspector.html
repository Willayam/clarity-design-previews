<!doctype html><html lang="en"><head>
<script type="application/json" id="lab-meta">{"id": "v04", "name": "Side inspector", "axis": "page structure", "idea": "A large preview beside a fixed inspector with a stationary action footer.", "cost": "Layout thumbnails are smaller than the main preview.", "model": "gpt-6-astra", "round": 1, "parents": [], "parts": ["preview", "controls"], "recommended": false, "why": "", "old": true}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Side inspector</title><link rel="stylesheet" href="../kit/app.css"><script src="../kit/recorder-kit.js"></script>
<style>
.v04{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;max-width:1440px;margin:auto;align-items:start}.v04-stage{min-width:0;padding-top:48px}.v04-preview{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:var(--radius, .5rem)}.v04-toolbar{display:flex;justify-content:flex-end;margin-top:16px;gap:8px;flex-wrap:wrap}.v04-panel{position:relative;height:760px;display:flex;flex-direction:column;border-left:1px solid var(--border);padding-left:24px;min-width:0}.v04-section{padding:8px 0;border-bottom:1px solid var(--border);min-width:0}.v04-section h2{font-size:14px;font-weight:600;margin-bottom:10px}.v04-layouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.v04-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.v04-backgrounds{grid-template-columns:repeat(4,minmax(0,1fr))}.v04-tile{padding:4px;border:1px solid var(--border);border-radius:var(--radius, .5rem);background:var(--card);font-size:12px;cursor:pointer;min-width:0;text-align:center}.v04-tile:hover{background:var(--muted)}.v04-tile[aria-pressed=true]{border-color:var(--primary);outline:1px solid var(--primary);color:var(--primary)}.v04-tile:focus-visible{outline:2px solid var(--ring);outline-offset:3px}.v04-tile:disabled{opacity:.4;cursor:not-allowed}.v04-thumb{display:block;aspect-ratio:16/9;width:100%;overflow:hidden;border-radius:var(--radius, .5rem);height:60px!important}.v04-label{display:block;padding:5px 0 2px}.v04-face{display:block;width:100%;height:44px;border-radius:var(--radius, .5rem)}.v04-shape{height:28px;display:flex;align-items:center;justify-content:center}.v04-footer{position:absolute;bottom:0;left:24px;right:0;flex-shrink:0;margin-top:auto;padding-top:16px;display:grid;gap:8px}.v04-footer>button{width:100%;min-height:40px;flex:none}.v04-status{height:28px;font-size:12px;color:var(--muted-foreground)}.v04-reset{height:32px}.v04-recorded{grid-column:1/-1;padding:8px}.v04-device-label{display:block;font-size:12px;color:var(--muted-foreground);margin-bottom:4px}.v04-devices [data-slot=recorder-device-controls]{gap:10px}.v04-menu{margin-top:6px;width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius, .5rem);background:var(--card)}
@media(max-width:800px){.v04{grid-template-columns:minmax(0,1fr);gap:12px}.v04-stage{padding-top:0}.v04-panel{height:auto;min-height:480px;border-left:0;padding-left:0}.v04-recorder .v04-desktop{display:none}.v04-toolbar{margin-top:10px}.v04-footer{position:static;padding-bottom:12px}.v04-style .v04-toolbar>button{flex:1 0 100%;width:100%}.v04-section{padding:12px 0}.v04-recorder .v04-status{display:none}}
</style></head><body><script>
const K=RecorderKit,S=K.store({layout:'inset'});let busy=false,done=false,cuts=false,cancel;
function render(){cancel?.();busy=false;done=false;const style=location.hash==='#style',page=K.mountShell(style?'Untitled video':'Record video');page.innerHTML=`<div class="v04 ${style?'v04-style':'v04-recorder'}"><div class="v04-stage"><div class="v04-preview" data-part="preview"></div><div class="v04-toolbar">${style?K.finishActions():K.button({variant:'outline',size:'sm',label:'Change screen',iconName:'monitor-up',attrs:'id="v04-screen"'})}</div>${style?'<div class="v04-toolbar">'+K.trimStyleTabs()+'</div>':''}</div><aside class="v04-panel" data-part="controls">${style?'':`<section class="v04-section v04-devices"><h2>Devices</h2>${K.deviceControls()}</section>`}<section class="v04-section"><h2>Layout</h2><div class="v04-layouts">${K.LAYOUTS.map(x=>`<button class="v04-tile" data-key="layout" data-value="${x.id}" aria-pressed="false"><span class="v04-thumb" data-layout="${x.id}"></span><span class="v04-label">${x.label}</span></button>`).join('')}${style?'<button class="v04-tile v04-recorded" id="v04-cuts" aria-pressed="false">Recorded cuts</button>':''}</div></section><section class="v04-section v04-desktop"><h2>Camera</h2><div class="v04-options">${K.SHAPES.map(x=>`<button class="v04-tile" data-key="shape" data-value="${x.id}"><span class="v04-shape">${K.icon(x.id==='circle'?'circle':x.id==='cutout'?'user-round':'video',24)}</span><span class="v04-label">${x.label}</span></button>`).join('')}</div></section><section class="v04-section v04-desktop"><h2>Background</h2><div class="v04-options v04-backgrounds">${K.BACKGROUNDS.map(x=>`<button class="v04-tile" data-key="background" data-value="${x.id}"><span class="v04-face" data-bg="${x.id}"></span><span class="v04-label">${x.label}</span></button>`).join('')}</div></section><div class="v04-footer"><div class="v04-status" role="status"></div>${K.button({size:'lg-thumb',label:style?'Apply':'Start recording',record:!style,attrs:'id="v04-action"'})}<div class="v04-reset">${style?K.button({variant:'ghost',size:'sm',label:'Back to original',attrs:'id="v04-reset" hidden'}):''}</div></div></aside></div>`;
page.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(b.dataset.key==='layout')cuts=false;S.set({[b.dataset.key]:b.dataset.value})});page.querySelectorAll('[data-bg]').forEach(e=>K.face(e,e.dataset.bg));
page.querySelectorAll('.v04-devices [aria-haspopup]').forEach((b,i)=>{const label=document.createElement('span');label.className='v04-device-label';label.textContent=i?'Microphone':'Camera';b.before(label);b.onclick=()=>{const old=b.parentElement.querySelector('.v04-menu');if(old){old.remove();b.setAttribute('aria-expanded','false');return}const menu=document.createElement('button');menu.className='v04-menu';menu.textContent=b.getAttribute('aria-label').split(': ')[1]+' ✓';menu.onclick=()=>{menu.remove();b.setAttribute('aria-expanded','false');b.focus()};b.after(menu);b.setAttribute('aria-expanded','true');menu.focus();menu.onkeydown=e=>{if(e.key==='Escape')menu.click()}}});
page.querySelector('#v04-screen')?.addEventListener('click',()=>{S.set({screen:!S.get().screen})});page.querySelector('#v04-cuts')?.addEventListener('click',()=>{cuts=true;S.set({layout:'inset'})});page.querySelector('#v04-reset')?.addEventListener('click',()=>{cuts=false;done=false;S.set({layout:'inset',shape:'circle',background:'keep'});page.querySelector('.v04-status').textContent=''});
page.querySelector('#v04-action').onclick=()=>{if(!style){if(!S.get().screen&&S.get().layout!=='camera')S.set({screen:true});return}busy=true;paint();cancel=K.fakeApply(status=>{page.querySelector('.v04-status').textContent=K.statusCopy(status);if(status.kind==='done'){busy=false;done=true}paint()})};
if(style){page.querySelectorAll("[data-record-action]").forEach(b=>b.removeAttribute("data-record-action"));const buttons=page.querySelectorAll('.v04-toolbar button');buttons[0].onclick=()=>location.hash='recorder';buttons[1].onclick=()=>{page.querySelector('.v04-status').textContent='Build page is available after recording'};buttons[2].onclick=async()=>{try{await navigator.clipboard.writeText(location.href);page.querySelector('.v04-status').textContent='Link copied'}catch{page.querySelector('.v04-status').textContent='Copy link unavailable in this preview'}};buttons.forEach(b=>{if(b.textContent.trim()==='Trim')b.onclick=()=>{page.querySelector('.v04-status').textContent='Trim is available after recording'}})}paint()}
function paint(){const s=S.get(),a=K.applies(s),style=location.hash==='#style';K.scene(document.querySelector('.v04-preview'),s);document.querySelectorAll('[data-layout]').forEach(e=>K.scene(e,{...s,layout:e.dataset.layout,screen:true}));document.querySelectorAll('[data-key]').forEach(b=>{b.setAttribute('aria-pressed',String(s[b.dataset.key]===b.dataset.value&&!(b.dataset.key==='layout'&&cuts)));b.disabled=busy||(b.dataset.key==='shape'&&!a.shape)||(b.dataset.key==='background'&&!a.background)});const action=document.querySelector('#v04-action');action.disabled=busy;if(!style){const share=!s.screen&&s.layout!=='camera';action.innerHTML=share?'Share screen':'<span class="size-3 flex-none rounded-full bg-current"></span>Start recording';action.toggleAttribute('data-record-action',!share);document.querySelector('#v04-screen').textContent=s.screen?'Change screen':'Share screen'}document.querySelector('#v04-reset')?.toggleAttribute('hidden',!done);const c=document.querySelector('#v04-cuts');if(c){c.disabled=busy;c.setAttribute('aria-pressed',String(cuts))}document.querySelectorAll('.v04-toolbar button').forEach(b=>b.disabled=busy)}
window.addEventListener('hashchange',render);render();S.subscribe(paint);
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
