</style></head><body><script>
const K=RecorderKit,s=K.drawerStore({}),original={...s.get()};let paused=false,seconds=12,expanded={},closed=false,applied=false,busy=false,status='',tab='style',recorded=false;const q=x=>document.querySelector(x),route=()=>location.hash.slice(1)||'recorder';
const btn=(label,action,extra={})=>K.button({label,attrs:`data-action="${action}"`,...extra});
function drawing(id){return `<svg viewBox="0 0 64 42" fill="none" aria-hidden="true"><rect x="5" y="5" width="54" height="32" rx="3" stroke="currentColor" opacity=".35"/>${id==='bubble'?'<rect x="39" y="21" width="14" height="12" rx="4" fill="currentColor"/>':id==='cutout'?'<circle cx="46" cy="22" r="5" fill="currentColor"/><path d="M36 37q0-14 10-14t10 14" fill="currentColor"/>':id==='split'?'<rect x="9" y="9" width="17" height="24" rx="3" fill="currentColor"/><path d="M31 12h23M31 18h18" stroke="currentColor"/>':id==='camera'?'<circle cx="32" cy="18" r="7" fill="currentColor"/><path d="M18 37q0-16 14-16t14 16" fill="currentColor"/>':'<path d="M12 13h30M12 19h23M12 25h37" stroke="currentColor" stroke-width="3"/>'}</svg>`}
function tiles(){return `<div class="v13-tiles">${K.STYLES.map(x=>`<button class="v13-tile" data-style="${x.id}" aria-pressed="${!recorded&&s.get().style===x.id}">${drawing(x.id)}${x.label}</button>`).join('')}</div>`}
function row(key,label,options,ico){const v=s.get(),a=K.drawerApplies(v);return `<label class="v13-row">${K.icon(ico)}${label}${options?`<select data-key="${key}" aria-label="${label}" ${!a[key]?'disabled':''}>${options.map(x=>`<option value="${x.id}" ${v[key]===x.id?'selected':''} ${key==='position'&&!a.topPositions&&x.id[0]==='t'?'disabled':''}>${x.label}</option>`).join('')}</select>`:`<button class="v13-switch" data-slot="switch" role="switch" aria-label="${label}" aria-checked="${!!v[key]}" data-toggle="${key}" ${!a[key]?'disabled':''}><span></span></button>`}</label>${key.endsWith('Bg')&&v[key]?`<div class="v13-swatches">${K.SWATCHES.map(x=>`<button aria-label="${label}: ${x.label}" data-swatch="${x.id}" data-key="${key}" aria-pressed="${v[key]===x.id}" style="background:${x.css}" ${!a[key]?'disabled':''}></button>`).join('')}</div>`:''}`}
function fine(which,live){const v=s.get();const content=which==='Camera'?row('position','Position',K.POSITIONS,'layout-template')+row('shape','Shape',K.SHAPES2,'circle')+row('size','Size',K.SIZES,'sliders-horizontal')+row('mirror','Mirror camera',null,'video')+row('blur','Blur background',null,'wand-sparkles')+row('cameraBg','Camera background',null,'image'):row('screenBg','Screen background',null,'image');return `<section class="v13-fine ${live?'v13-fold':''}">${live?'':`<h2 class="v13-title">${which}</h2>`}<div class="v13-card">${live?`<button class="v13-summary" data-fold="${which}" aria-expanded="${!!expanded[which]}">${K.icon(which==='Camera'?'video':'monitor')}<span>${which}. ${which==='Camera'?(v.style==='screen'?'Hidden':`${K.SHAPES2.find(x=>x.id===v.shape).label}, ${K.POSITIONS.find(x=>x.id===v.position).label.toLowerCase()}`):(v.screenBg?'Background on':'Original')}</span>${K.icon('chevron-down')}</button>`:''}${!live||expanded[which]?content:''}</div></section>`}
function actions(compact=false){return btn(compact?'Stop':`Stop · ${time()}`,'stop',{record:true,size:'lg-thumb'})+btn(compact?'':paused?'Resume':'Pause','pause',{variant:'outline',size:compact?'sm':'lg-thumb',iconName:paused?'play':'pause'}).replace('data-action="pause"','data-action="pause" aria-label="'+(paused?'Resume':'Pause')+'"')}
function time(){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function render(){const r=route(),live=r==='recording',style=r==='style';if(r==='popout'){document.body.innerHTML=`<main class="v13-root v13-popouts"><section class="v13-window"><div class="v13-chrome">Clarity · <span data-clock>${time()}</span></div><div class="v13-mini" data-part="preview" data-scene></div><div data-part="controls">${tiles()}<div class="v13-actions">${actions()}</div></div></section><section class="v13-window v13-compact"><div class="v13-chrome">Clarity · <span data-clock>${time()}</span></div><div class="v13-compactline">${tiles()}${actions(true)}</div></section></main>`}else{const page=K.mountShell(style?'Untitled video':'Record video');page.classList.add('v13-root');page.innerHTML=`<section class="v13-stage"><div class="v13-preview" data-part="preview" data-scene></div>${tab==='trim'&&style?'<div class="v13-timeline">Trim timeline</div>':''}<div class="v13-under">${style?K.finishActions():K.deviceControls()+btn('Change screen','screen',{variant:'outline',size:'sm',iconName:'monitor-up'})}</div></section>${closed?btn('Layout','open',{variant:'outline',size:'sm'}).replace('class="','class="v13-open '):`<aside data-part="controls" class="v13-drawer ${live?'v13-live':''}"><header class="v13-head">${K.icon('layout-template')}Layout${btn('','close',{variant:'ghost',size:'icon',iconName:'x'})}</header><div class="v13-middle">${style?'<div class="v13-tabs"><button data-tab="trim">Trim</button><button data-tab="style">Style</button></div>':''}<h2 class="v13-title">Style</h2>${style?`<button class="v13-summary" data-action="recorded" aria-pressed="${recorded}">${K.icon('scissors')}As recorded ${recorded?K.icon('check'):''}</button>`:''}<div class="v13-card">${tiles()}</div>${fine('Camera',live)}${fine('Screen',live)}</div><footer class="v13-foot">${live?`<div class="v13-actions">${actions()}</div>`:style?`<div class="v13-status" role="status">${status}</div>${btn('Apply','apply')}${applied?btn('Back to original','reset',{variant:'ghost',size:'sm'}):''}`:btn(!s.get().screen&&s.get().style!=='camera'?'Share screen':'Start recording','start',{record:true,size:'lg-thumb'})}</footer></aside>`}`}
document.querySelectorAll('[data-scene]').forEach(e=>K.drawerScene(e,s.get()));if(busy)document.querySelectorAll('.v13-drawer button,.v13-drawer select').forEach(e=>e.disabled=true);document.querySelectorAll('[data-action="close"]').forEach(e=>e.setAttribute('aria-label','Close layout'));}
document.addEventListener('change',e=>{if(e.target.matches('select[data-key]'))s.set({[e.target.dataset.key]:e.target.value})});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.closest('.v13-under')&&b.getAttribute('aria-haspopup')==='menu'){const old=b.parentElement.querySelector('select');if(old){old.remove();return}const pick=document.createElement('select');pick.setAttribute('aria-label',b.getAttribute('aria-label')||'Device');const name=b.textContent.trim();pick.innerHTML='<option>'+name+'</option><option>Off</option>';pick.style.cssText='width:100%;padding:8px';pick.onchange=()=>{const label=b.querySelector('.truncate');if(label)label.textContent=pick.value;pick.remove()};b.after(pick);pick.focus();return}const d=b.dataset;if(d.style){recorded=false;s.set({style:d.style})}if(d.toggle)s.set({[d.toggle]:s.get()[d.toggle]?false:d.toggle.endsWith('Bg')?'sky':true});if(d.swatch)s.set({[d.key]:d.swatch});if(d.fold){expanded[d.fold]=!expanded[d.fold];render()}if(d.tab){tab=d.tab;render()}if(d.action==='start'){if(!s.get().screen&&s.get().style!=='camera')s.set({screen:true});else{seconds=0;paused=false;location.hash='recording'}}if(d.action==='stop'){recorded=true;location.hash='style'}if(d.action==='pause'){paused=!paused;render()}if(d.action==='screen'){s.set({screen:!s.get().screen})}if(d.action==='close'||d.action==='open'){closed=d.action==='close';render()}if(d.action==='recorded'){recorded=true;s.set(original)}if(d.action==='reset'){applied=false;status='';recorded=true;s.set(original)}if(d.action==='apply'){busy=true;render();K.fakeApply(v=>{status=K.statusCopy(v);if(v.kind==='done'){busy=false;applied=true}render()})}if(b.textContent.trim()==='Re-record')location.hash='recorder';});
s.subscribe(render);addEventListener('hashchange',()=>{closed=false;expanded={};render()});setInterval(()=>{if(!paused&&['recording','popout'].includes(route())){seconds++;document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=time());document.querySelectorAll('[data-action="stop"]').forEach(e=>{if(e.textContent.includes('·'))e.lastChild.textContent=`Stop · ${time()}`})}},1000);
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
