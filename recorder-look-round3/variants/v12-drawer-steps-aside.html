<script type="application/json" id="lab-meta">{"id": "v12", "name": "Drawer steps aside", "axis": "How the drawer behaves once a take is running", "idea": "At Start the drawer slides away, the picture grows to theatre size, and one live bar holds the timer, the five Style tiles, Stop and Pause.", "cost": "Anything finer than a Style tile is one more click away, and opening the drawer mid-take shrinks the running picture to keep the speaker clear.", "model": "opus", "round": 3, "parents": [], "parts": ["preview", "controls"], "recommended": true, "why": "While talking, a rep needs the picture and one row of styles. The same row works in the pop-out, and the full drawer is one click away."}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Drawer steps aside</title><link rel="stylesheet" href="../kit/app.css"><script src="../kit/recorder-kit.js"></script>
<style>
.v12-body header{max-width:none;margin-inline:0}
.v12-body #kit-page{padding-top:4px;padding-bottom:16px}
.v12{--v12-ease:cubic-bezier(0,0,.2,1);--cg-ink:var(--foreground);--cg-btn-hover:var(--muted);--cg-active:var(--muted);min-width:0}
.v12 [hidden],.v12-plain [hidden]{display:none!important}

/* The picture keeps its top left corner. It grows into whatever the drawer leaves free. */
.v12-stage{width:min(calc(100% - 28px),calc((100dvh - 150px)*16/9));display:flex;flex-direction:column;gap:12px}
.v12[data-open] .v12-stage{width:min(calc(100% - 388px),calc((100dvh - 126px)*16/9))}
.v12-frame{position:relative}
.v12-picture{position:relative;z-index:1;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:calc(var(--radius)*1.8);transform-origin:0 0}
.v12-layout{position:absolute;top:0;left:calc(100% + 8px);width:32px;height:32px;padding:0}
.v12[data-open] .v12-layout{display:none}
.v12-layout::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;padding:2px 8px;border-radius:calc(var(--radius)*.8);background:var(--foreground);color:var(--background);font-size:12px;line-height:16px;white-space:nowrap;opacity:0;pointer-events:none}
.v12-layout:hover::after,.v12-layout:focus-visible::after{opacity:1}

.v12-under{display:flex;flex-direction:column;gap:12px;min-width:0}
.v12-setup{display:flex;align-items:center;gap:8px;min-width:0}
.v12-devices{flex:1 1 0;min-width:0}
.v12-devices [data-slot=recorder-device-controls]{grid-template-columns:repeat(2,minmax(0,1fr))}
.v12[data-open] .v12-under .v12-slot{display:none}
.v12-setup [data-change]{padding-bottom:4px}
.v12-slot{display:flex;flex:none}
.v12-slot [data-slot=button]{flex:none}
.v12-tiles.v12-phone-only{display:none}
.v12-trim{display:flex;align-items:center;justify-content:center;height:56px;border-radius:var(--radius);background:var(--muted);color:var(--muted-foreground);font-size:14px}
.v12-finish{display:flex;flex-wrap:wrap;gap:8px}
.v12-finish [data-slot=button]{flex:none}
.v12-menu{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;padding:4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--popover);box-shadow:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a}
.v12-menu button{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 8px;border-radius:calc(var(--radius)*.8);font-size:14px;text-align:left;cursor:pointer}
.v12-menu button:hover{background:var(--muted)}
.v12-menu button:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.v12-menu span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* The live bar */
.v12-bar{display:grid;grid-template-columns:minmax(max-content,1fr) auto minmax(max-content,1fr);align-items:center;gap:16px;min-width:0}
.v12-timer{display:inline-flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--foreground)}
.v12-timer::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--destructive)}
.v12-timer[data-paused]{color:var(--muted-foreground)}
.v12-timer[data-paused]::before{background:var(--muted-foreground)}
.v12-acts{display:flex;justify-content:flex-end;gap:8px;min-width:0}
.v12-acts [data-record-action]{flex:none}
.v12-acts [data-pause]{width:116px}
.v12-bar .v12-tiles{padding:3px;gap:2px}
.v12-bar .v12-tile{flex:none;width:76px;height:54px}

/* Style tiles */
.v12-tiles{display:flex;gap:4px;padding:6px;min-width:0}
.v12-tile{flex:1 1 0;min-width:0;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:var(--radius);background:transparent;color:var(--muted-foreground);cursor:pointer}
.v12-tile:hover{background:var(--muted)}
.v12-tile[aria-checked=true]{background:color-mix(in oklab,var(--primary) 7%,transparent);color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
.v12-tile:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.v12-draw{display:block;flex:none;width:44px}
.v12-draw svg{display:block;width:100%;height:auto}
.v12-draw-rec svg{width:16px;height:16px}
.v12-draw-rec{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;border-radius:4px;background:color-mix(in oklab,currentColor 16%,transparent)}
.v12-name{font-size:12px;line-height:16px;white-space:nowrap}
.v12-tile[aria-checked=true] .v12-name{color:var(--foreground)}
.v12-drawer .v12-draw{width:min(44px,84%)}

/* The drawer */
.v12-card{border:1px solid var(--border);border-radius:calc(var(--radius)*1.4);background:var(--card)}
.v12-drawer{position:fixed;z-index:40;top:8px;right:8px;bottom:8px;width:380px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:calc(var(--radius)*1.8);background:var(--card);box-shadow:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;transition:transform 180ms var(--v12-ease),visibility 0s}
.v12:not([data-open]) .v12-drawer{transform:translateX(calc(100% + 16px));visibility:hidden;transition:transform 180ms var(--v12-ease),visibility 0s 180ms}
/* The real Button animates every property, which would hold its visibility back while the drawer slides in. */
.v12-drawer [data-slot=button]{transition-property:color,background-color,border-color,box-shadow,opacity,translate}
.v12-drawer[data-tab=trim]{bottom:auto}
.v12-drawer[data-tab=trim] .v12-scroll,.v12-drawer[data-tab=trim] .v12-foot{display:none}
.v12-head{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 16px;color:var(--muted-foreground);font-size:14px}
.v12-close{--cg-ink:var(--muted-foreground);margin-left:auto}
.v12-tabs{padding:0 16px 12px}
.v12-scroll{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;padding:0 16px 16px}
.v12-scroll[data-busy]{opacity:.6}
.v12-sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:14px;line-height:20px;font-weight:500;color:var(--foreground)}
.v12-sec-value{font-weight:400;color:var(--muted-foreground)}
.v12-row{position:relative;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;font-size:14px;color:var(--foreground)}
.v12-row[data-kind=select]{min-height:52px}
.v12-row + .v12-row::before,.v12-reveal-in::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:var(--border)}
.v12-row > *{transition:opacity 120ms var(--v12-ease)}
.v12-row[data-off] > *{opacity:.45}
.v12-row-ic{flex:none;display:flex;color:var(--muted-foreground)}
.v12-select{position:relative;flex:none;width:132px;margin-left:auto}
.v12-select select{appearance:none;display:block;width:100%;height:32px;padding:0 28px 0 10px;border:1px solid var(--input);border-radius:var(--radius);background:var(--card);color:var(--foreground);font:inherit;cursor:pointer}
.v12-select select:hover:not(:disabled){background:var(--muted)}
.v12-select select:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.v12-select select:disabled{cursor:default}
.v12-select svg{position:absolute;top:8px;right:8px;color:var(--muted-foreground);pointer-events:none}
.v12-switch{position:relative;flex:none;width:36px;height:20px;margin-left:auto;border:0;border-radius:calc(infinity*1px);background:color-mix(in oklab,var(--muted-foreground) 45%,var(--card));cursor:pointer;transition:background-color 120ms var(--v12-ease)}
.v12-switch:hover:not(:disabled){background:color-mix(in oklab,var(--muted-foreground) 65%,var(--card))}
.v12-switch span{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px #00000033;transition:transform 120ms var(--v12-ease)}
.v12-switch[aria-checked=true],.v12-switch[aria-checked=true]:hover:not(:disabled){background:var(--primary)}
.v12-switch[aria-checked=true] span{transform:translateX(16px)}
.v12-switch:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.v12-switch:disabled{cursor:default}
.v12-reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows 160ms var(--v12-ease)}
.v12-reveal[data-on]{grid-template-rows:1fr}
.v12-reveal-in{position:relative;min-height:0;overflow:hidden}
.v12-reveal[data-off]{opacity:.45}
.v12-swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:10px 12px}
.v12-swatch{aspect-ratio:3/2;min-width:0;border:0;border-radius:calc(var(--radius)*.8);box-shadow:inset 0 0 0 1px #0000000f;cursor:pointer}
.v12-swatch[aria-checked=true]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--primary)}
.v12-swatch:focus-visible{outline:2px solid var(--ring);outline-offset:4px}
.v12-swatch:disabled{cursor:default}
.v12-foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 16px 16px}
.v12-foot [data-slot=button]{flex:none;width:100%}
.v12-foot-row{display:flex;gap:8px;min-width:0}
.v12-foot-row [data-record-action]{flex:1 1 0;width:auto;min-width:0}
.v12-foot-row [data-pause]{flex:none;width:116px}
.v12-status{margin:0;font-size:12px;line-height:16px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}

/* The pop-out, at its true size */
.v12-plain{box-sizing:border-box;min-height:100dvh;display:flex;flex-wrap:wrap;align-content:center;align-items:flex-start;justify-content:center;gap:32px 48px;padding:48px 15px;background:var(--muted);--cg-ink:var(--foreground);--cg-btn-hover:var(--muted);--cg-active:var(--muted)}
.v12-plain figure{margin:0;width:360px}
.v12-plain figcaption{margin-bottom:8px;font-size:12px;line-height:16px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.v12-win{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);box-shadow:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;box-sizing:content-box}
.v12-win-bar{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--muted)}
.v12-win-bar i{width:9px;height:9px;border-radius:50%;background:color-mix(in oklab,var(--muted-foreground) 40%,transparent)}
.v12-pop{box-sizing:border-box;width:360px;background:var(--card)}
.v12-pop-260{height:260px;display:flex;flex-direction:column}
.v12-pop-stage{flex:1 1 0;min-height:0;display:flex;justify-content:center;background:#020617}
.v12-pop-pic{height:100%;aspect-ratio:16/9}
.v12-pop-bar{flex:none;display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px}
.v12-pop .v12-tiles{padding:0;gap:2px}
.v12-pop .v12-draw{width:36px}
.v12-pop-260 .v12-tile{height:42px;gap:2px}
.v12-pop-row{display:flex;align-items:center;gap:8px}
.v12-pop-row .v12-timer{margin-right:auto;font-size:16px;line-height:24px}
.v12-pop [data-slot=button]{flex:none;height:32px;font-size:14px}
.v12-pop [data-pause]{width:104px;gap:6px}
.v12-pop-96{height:96px;display:flex;align-items:center;gap:6px;padding:0 8px}
.v12-pop-96 .v12-timer{gap:5px;font-size:14px;line-height:20px;margin-right:auto}
.v12-pop-96 .v12-timer::before{width:6px;height:6px}
.v12-pop-96 .v12-tile{flex:none;width:32px;height:36px}
.v12-pop-96 .v12-draw{width:26px}
.v12-pop-96 [data-slot=button]{height:36px}
.v12-pop-96 [data-pause]{width:36px;padding:0}

@media (max-width:899px){
  .v12-bar{grid-template-columns:minmax(0,1fr) auto}
  .v12-bar .v12-tiles{grid-row:2;grid-column:1/-1;justify-content:center}
}
@media (max-width:640px){
  .v12-body #kit-page{padding-inline:16px;padding-bottom:12px}
  .v12 .v12-stage,.v12[data-open] .v12-stage{width:auto}
  .v12-layout,.v12-close{display:none}
  .v12-tiles.v12-phone-only{display:flex}
  .v12[data-route=recorder] .v12-stage,.v12[data-route=recording] .v12-stage{min-height:calc(100dvh - 76px)}
  .v12-under{flex:1 1 auto}
  .v12-setup{flex:1 1 auto;flex-direction:column;align-items:stretch}
  .v12-setup [data-change]{display:none}
  .v12-devices{flex:none}
  .v12-devices [data-slot=recorder-device-controls]{grid-template-columns:minmax(0,1fr)}
  .v12[data-open] .v12-under .v12-slot{display:flex}
  .v12-slot{margin-top:auto}
  .v12-slot [data-slot=button]{flex:1 1 auto}
  .v12-bar{flex:1 1 auto;display:flex;flex-direction:column;align-items:stretch;gap:12px}
  .v12-bar .v12-timer{display:none}
  .v12-bar .v12-tiles{padding:6px;gap:4px;justify-content:stretch}
  .v12-bar .v12-tile{flex:1 1 0;width:auto;height:52px}
  .v12-acts{margin-top:auto}
  .v12-acts [data-record-action]{flex:1 1 auto}
  .v12-finish [data-slot=button],.v12-setup [data-slot=button]{width:auto;min-width:0}
  .v12-acts [data-pause]{flex:none;width:124px;padding-inline:0}
  .v12[data-route=recorder] [data-style=cutout],.v12[data-route=recording] [data-style=cutout]{display:none}
  .v12[data-route=recorder] .v12-drawer,.v12[data-route=recording] .v12-drawer{display:none}
  .v12 .v12-drawer,.v12:not([data-open]) .v12-drawer{position:static;width:auto;margin-top:16px;transform:none;visibility:visible;box-shadow:none}
  .v12-scroll{flex:none;overflow:visible}
  .v12-finish{gap:6px}
  .v12-finish [data-slot=button]{flex:1 1 auto;height:44px;padding-inline:10px;font-size:14px}
  .v12-plain{align-content:flex-start;padding-top:24px}
}
@media (prefers-reduced-motion:reduce){
  .v12 *,.v12 *::before,.v12 *::after{transition:none!important;animation:none!important}
}
</style>

<script>
(() => {
  const K = window.RecorderKit;
  const store = K.drawerStore({});
  const EASE = "cubic-bezier(0, 0, .2, 1)";
  const RECORDED = { id: "recorded", label: "As recorded" };
  const svg = (paths) => `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
  const ICONS = {
    position: svg('<path d="M12 2v20"/><path d="m15 19-3 3-3-3"/><path d="m19 9 3 3-3 3"/><path d="M2 12h20"/><path d="m5 9-3 3 3 3"/><path d="m9 5 3-3 3 3"/>'),
    shape: K.icon("shapes"),
    size: K.icon("maximize-2"),
    mirror: svg('<path d="m3 7 5 5-5 5V7"/><path d="m21 7-5 5 5 5V7"/><path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/>'),
    blur: svg('<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>'),
    cameraBg: K.icon("image"),
    screenBg: K.icon("monitor"),
    spinner: svg('<path d="M21 12a9 9 0 1 1-6.219-8.56"/>').replace("<svg ", '<svg class="animate-spin" '),
  };

  let route = null, open = true, tab = "style", mounted = false;
  let root = null;
  let elapsed = 12, paused = false;
  let recordedStyle = "bubble", baseline = null, status = null, appliedAs = null, busy = false, cancelApply = null;
  const lastSwatch = { cameraBg: "sky", screenBg: "sky" };

  const phone = () => matchMedia("(max-width: 640px)").matches;
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const live = () => route === "recording" || route === "popout";
  const effective = (s) => (s.style === "recorded" ? recordedStyle : s.style);
  const applies = (s) => K.drawerApplies({ style: s.screen ? effective(s) : "camera" });
  const needsShare = (s) => !s.screen && effective(s) !== "camera";
  const fmt = (n) => `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
  const phoneRecorder = () => phone() && route !== "style";

  // Phones have no backgrounds and no cut-out, whatever the desktop state says.
  function painted(s) {
    const p = { ...s, style: effective(s) };
    return phoneRecorder() ? { ...p, style: p.style === "cutout" ? "bubble" : p.style, blur: false, cameraBg: null, screenBg: null } : p;
  }
  function currentStyle(s) {
    if (s.style === "recorded") return "recorded";
    if (!s.screen) return "camera";
    return phoneRecorder() && s.style === "cutout" ? "bubble" : s.style;
  }

  // ---- Style tile drawings, 16 by 9 like the picture
  const FRAME = '<rect width="48" height="27" rx="4" fill="currentColor" opacity=".16"/>';
  function drawing(id, position) {
    const right = position[1] === "r", bottom = position[0] === "b";
    const bust = (x, headY, r, w, h) => `<circle cx="${x}" cy="${headY}" r="${r}" fill="currentColor"/><path d="M${x - w} 27a${w} ${h} 0 0 1 ${w * 2} 0z" fill="currentColor"/>`;
    const inner = {
      bubble: `${FRAME}<rect x="${right ? 33 : 4}" y="${bottom ? 12 : 4}" width="11" height="11" rx="3.6" fill="currentColor"/>`,
      cutout: `${FRAME}${bust(right ? 36 : 12, 14.5, 4.2, 7.5, 7)}`,
      split: '<rect y="3" width="15.5" height="21" rx="3" fill="currentColor"/><rect x="17.5" y="3" width="30.5" height="21" rx="3" fill="currentColor" opacity=".16"/>',
      camera: `${FRAME}${bust(24, 11.5, 5.4, 11, 9.5)}`,
      screen: `${FRAME}<rect x="8" y="6.5" width="17" height="3" rx="1.5" fill="currentColor"/><rect x="8" y="13" width="32" height="7.5" rx="1.5" fill="currentColor" opacity=".5"/>`,
    }[id];
    return `<svg viewBox="0 0 48 27" aria-hidden="true">${inner}</svg>`;
  }
  const tile = (o, labels) => `<button type="button" role="radio" class="v12-tile" data-style="${o.id}" aria-label="${o.label}" aria-checked="false" tabindex="-1">${o.id === "recorded" ? `<span class="v12-draw v12-draw-rec">${K.icon("film", 16)}</span>` : '<span class="v12-draw" data-draw></span>'}${labels ? `<span class="v12-name">${o.label}</span>` : ""}</button>`;
  const tiles = (list, { labels = true, cls = "" } = {}) => `<div role="radiogroup" aria-label="Style" class="v12-tiles ${cls}">${list.map((o) => tile(o, labels)).join("")}</div>`;

  // ---- Buttons that appear in several places
  const stopLive = () => K.button({ record: true, size: "lg-thumb", label: `<span>Stop · <span data-time class="tabular-nums">${fmt(elapsed)}</span></span>`, attrs: "data-stop" });
  const stopSmall = () => K.button({ record: true, size: "default", label: "Stop", attrs: "data-stop" });
  const pauseFace = (iconOnly) => `${K.icon(paused ? "play" : "pause", 16)}${iconOnly ? "" : paused ? "Resume" : "Pause"}`;
  const pauseLarge = () => K.button({ variant: "outline", size: "lg-thumb", label: pauseFace(), attrs: "data-pause" });
  const pauseSmall = (iconOnly) => K.button({ variant: "outline", size: "sm", label: pauseFace(iconOnly), attrs: `data-pause ${iconOnly ? 'data-icon-only aria-label="Pause"' : ""}` });
  const timer = () => `<div class="v12-timer" data-timer role="timer"><span data-time>${fmt(elapsed)}</span></div>`;
  const liveBar = () => `<div class="v12-bar">${timer()}${tiles(K.STYLES, { cls: "v12-card" })}<div class="v12-acts">${K.button({ record: true, size: "lg-thumb", label: "Stop", attrs: "data-stop" })}${pauseLarge()}</div></div>`;
  const primary = (s) => needsShare(s) ? K.button({ size: "lg-thumb", label: "Share screen", iconName: "monitor-up", attrs: "data-share" }) : K.button({ record: true, size: "lg-thumb", label: "Start recording", attrs: "data-start" });

  // ---- The drawer. Built once per page, then only its attributes change, so focus and motion survive.
  const selectRow = (key, label, options) => `<label class="v12-row" data-row="${key}" data-kind="select"><span class="v12-row-ic">${ICONS[key]}</span><span>${label}</span><span class="v12-select"><select data-field="${key}" aria-label="${label}">${options.map((o) => `<option value="${o.id}">${o.label}</option>`).join("")}</select>${K.icon("chevron-down", 16)}</span></label>`;
  const switchRow = (key, label) => `<label class="v12-row" data-row="${key}"><span class="v12-row-ic">${ICONS[key]}</span><span>${label}</span><button type="button" role="switch" class="v12-switch" data-switch="${key}" aria-label="${label}" aria-checked="false"><span></span></button></label>`;
  const reveal = (key) => `<div class="v12-reveal" data-reveal="${key}"><div class="v12-reveal-in"><div class="v12-swatches" role="radiogroup" aria-label="Background">${K.SWATCHES.map((o) => `<button type="button" role="radio" class="v12-swatch" data-swatch="${o.id}" aria-label="${o.label}" aria-checked="false" tabindex="-1" style="background:${o.css}"></button>`).join("")}</div></div></div>`;
  const drawerMarkup = () => `
    <div class="v12-head">${K.icon("panel-right", 16)}<span>Layout</span>${K.button({ variant: "ghost", size: "icon", label: K.icon("x", 16), attrs: 'data-close aria-label="Close layout"' }).replace('class="', 'class="v12-close ')}</div>
    <div class="v12-tabs" data-tabs hidden>${K.trimStyleTabs()}</div>
    <div class="v12-scroll" data-scroll>
      <section><div class="v12-sec-head"><span>Style</span><span class="v12-sec-value" data-style-name></span></div><div class="v12-card" data-drawer-tiles></div></section>
      <section><div class="v12-sec-head"><span>Camera</span></div><div class="v12-card">
        ${selectRow("position", "Position", K.POSITIONS)}
        ${selectRow("shape", "Shape", K.SHAPES2)}
        ${selectRow("size", "Size", K.SIZES)}
        ${switchRow("mirror", "Mirror camera")}
        ${switchRow("blur", "Blur background")}
        ${switchRow("cameraBg", "Camera background")}
        ${reveal("cameraBg")}
      </div></section>
      <section><div class="v12-sec-head"><span>Screen</span></div><div class="v12-card">
        ${switchRow("screenBg", "Screen background")}
        ${reveal("screenBg")}
      </div></section>
    </div>
    <div class="v12-foot" data-foot></div>`;

  function footMarkup() {
    if (route === "recording") return `<div class="v12-foot-row">${stopLive()}${pauseLarge()}</div>`;
    if (route === "style") return `<p class="v12-status" data-status aria-live="polite" hidden></p>${K.button({ variant: "outline", size: "lg-thumb", label: "Back to original", iconName: "rotate-ccw", attrs: "data-back hidden" })}${K.button({ size: "lg-thumb", label: "Apply", attrs: "data-apply" })}`;
    return '<div class="v12-slot" data-primary></div>';
  }
  function underMarkup() {
    if (route === "recorder") return `${tiles(K.STYLES, { cls: "v12-card v12-phone-only" })}<div class="v12-setup"><div class="v12-devices">${K.deviceControls()}</div>${K.button({ variant: "outline", size: "lg-thumb", label: "Change screen", iconName: "monitor-up", attrs: "data-change" })}<div class="v12-slot" data-primary></div></div>`;
    if (route === "recording") return open && !phone() ? "" : liveBar();
    return `<div class="v12-trim" data-trim hidden>Trim timeline</div><div class="v12-finish">${K.finishActions()}</div>`;
  }

  // ---- Keeping everything on screen in step with the store
  function syncTiles(s) {
    const current = currentStyle(s);
    document.querySelectorAll("[data-style]").forEach((el) => {
      const on = el.dataset.style === current;
      el.setAttribute("aria-checked", on);
      el.tabIndex = on ? 0 : -1;
      const draw = el.querySelector("[data-draw]");
      if (draw && draw.dataset.at !== s.position) { draw.innerHTML = drawing(el.dataset.style, s.position); draw.dataset.at = s.position; }
    });
  }
  function setPrimary(s) {
    const key = needsShare(s) ? "share" : "start";
    document.querySelectorAll("[data-primary]").forEach((slot) => {
      if (slot.dataset.key === key) return;
      const hadFocus = slot.contains(document.activeElement);
      slot.innerHTML = primary(s);
      slot.dataset.key = key;
      if (hadFocus) slot.querySelector("button").focus();
    });
  }
  function syncDrawer(s) {
    if (!root) return;
    const drawer = root.querySelector(".v12-drawer");
    const a = applies(s);
    drawer.querySelector("[data-style-name]").textContent = [RECORDED, ...K.STYLES].find((o) => o.id === currentStyle(s))?.label ?? "";
    drawer.querySelectorAll("[data-row]").forEach((row) => row.toggleAttribute("data-off", !a[row.dataset.row]));
    drawer.querySelectorAll("[data-field]").forEach((field) => {
      field.value = s[field.dataset.field];
      field.disabled = !a[field.dataset.field];
    });
    drawer.querySelectorAll('[data-field="position"] option').forEach((o) => { o.disabled = o.value[0] === "t" && !a.topPositions; });
    drawer.querySelectorAll("[data-switch]").forEach((sw) => {
      sw.setAttribute("aria-checked", Boolean(s[sw.dataset.switch]));
      sw.disabled = !a[sw.dataset.switch];
    });
    drawer.querySelectorAll("[data-reveal]").forEach((box) => {
      const key = box.dataset.reveal;
      const shown = Boolean(s[key]);
      box.toggleAttribute("data-on", shown);
      box.toggleAttribute("data-off", !a[key]);
      box.querySelector(".v12-reveal-in").inert = !shown || !a[key];
      box.querySelectorAll("[data-swatch]").forEach((sw) => {
        const on = sw.dataset.swatch === (s[key] ?? lastSwatch[key]);
        sw.setAttribute("aria-checked", sw.dataset.swatch === s[key]);
        sw.tabIndex = on ? 0 : -1;
        sw.disabled = !a[key];
      });
    });
    const change = root.querySelector("[data-change]");
    if (change) change.style.visibility = s.screen ? "" : "hidden";
  }
  function syncFinish() {
    if (route !== "style" || !root) return;
    const line = root.querySelector("[data-status]");
    line.hidden = !status;
    line.textContent = status ? K.statusCopy(status) : "";
    const apply = root.querySelector("[data-apply]");
    apply.disabled = busy;
    apply.toggleAttribute("aria-busy", busy);
    apply.innerHTML = `${busy ? ICONS.spinner : ""}Apply`;
    root.querySelector("[data-back]").hidden = !appliedAs || busy;
    root.querySelector("[data-scroll]").inert = busy;
    root.querySelector("[data-scroll]").toggleAttribute("data-busy", busy);
    root.querySelector("[data-tabs]").inert = busy;
  }
  function syncClock() {
    document.querySelectorAll("[data-time]").forEach((el) => { el.textContent = fmt(elapsed); });
    document.querySelectorAll("[data-timer]").forEach((el) => el.toggleAttribute("data-paused", paused));
    document.querySelectorAll("[data-pause]").forEach((el) => {
      el.innerHTML = pauseFace(el.hasAttribute("data-icon-only"));
      if (el.hasAttribute("data-icon-only")) el.setAttribute("aria-label", paused ? "Resume" : "Pause");
    });
  }
  function syncTabs() {
    if (!root) return;
    root.querySelector(".v12-drawer").dataset.tab = route === "style" ? tab : "style";
    root.querySelectorAll('[data-tabs] [role="radio"]').forEach((el) => {
      const on = el.textContent.trim().toLowerCase() === tab;
      el.setAttribute("aria-checked", on);
      el.tabIndex = on ? 0 : -1;
      el.toggleAttribute("data-checked", on);
      el.toggleAttribute("data-unchecked", !on);
    });
    const strip = root.querySelector("[data-trim]");
    if (strip) strip.hidden = tab !== "trim";
  }
  function sync() {
    const s = store.get();
    document.querySelectorAll("[data-scene]").forEach((el) => K.drawerScene(el, painted(s)));
    syncTiles(s);
    syncDrawer(s);
    setPrimary(s);
  }
  store.subscribe((s) => {
    if (status?.kind === "done" && JSON.stringify(s) !== appliedAs) { status = null; syncFinish(); }
    sync();
  });

  // ---- Mounting and routes
  function mount() {
    document.body.classList.add("v12-body");
    const page = K.mountShell("Record video");
    page.innerHTML = `<div class="v12"><div class="v12-stage"><div class="v12-frame"><div class="v12-picture" data-part="preview"><div data-scene></div></div>${K.button({ variant: "outline", size: "sm", label: K.icon("panel-right", 16), attrs: 'data-open-drawer aria-label="Layout" data-tip="Layout"' }).replace('class="', 'class="v12-layout ')}</div><div class="v12-under" data-under></div></div><aside class="v12-drawer" aria-label="Layout">${drawerMarkup()}</aside></div>`;
    root = page.firstElementChild;
    mounted = true;
  }
  const popoutMarkup = () => `<div class="v12-plain">
    <figure><figcaption>360 by 260</figcaption><div class="v12-win"><div class="v12-win-bar"><i></i><i></i><i></i></div>
      <div class="v12-pop v12-pop-260">
        <div class="v12-pop-stage" data-part="preview"><div class="v12-pop-pic"><div data-scene></div></div></div>
        <div class="v12-pop-bar" data-part="controls">${tiles(K.STYLES)}<div class="v12-pop-row">${timer()}${stopSmall()}${pauseSmall(false)}</div></div>
      </div></div></figure>
    <figure><figcaption>360 by 96</figcaption><div class="v12-win"><div class="v12-win-bar"><i></i><i></i><i></i></div>
      <div class="v12-pop v12-pop-96">${timer()}${tiles(K.STYLES, { labels: false })}${stopSmall()}${pauseSmall(true)}</div></div></figure>
  </div>`;

  // Picture grows from its old size on the compositor, under 200 ms. The drawer's slide is CSS.
  function morph(change) {
    const pic = root.querySelector(".v12-picture");
    const from = pic.getBoundingClientRect();
    change();
    if (reduced()) return;
    const to = pic.getBoundingClientRect();
    if (Math.abs(from.width - to.width) < 1 || !from.width || !to.width) return;
    pic.animate([{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width})` }, { transform: "none" }], { duration: 180, easing: EASE });
    root.querySelector("[data-under]").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: EASE });
    if (!open) root.querySelector(".v12-layout").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: EASE });
  }
  function paintUnder() {
    root.querySelector("[data-under]").innerHTML = underMarkup();
    root.querySelector("[data-foot]").innerHTML = footMarkup();
    const list = route === "style" ? [RECORDED, ...K.STYLES] : K.STYLES;
    root.querySelector("[data-drawer-tiles]").innerHTML = tiles(list, { labels: false, cls: "" });
    root.querySelector("[data-tabs]").hidden = route !== "style";
  }
  // The controls part is wherever the controls are right now, for the board's parts view.
  function markControls() {
    const inDrawer = open && !phoneRecorder();
    root.querySelector(".v12-drawer").toggleAttribute("data-part", inDrawer);
    root.querySelector("[data-under]").toggleAttribute("data-part", !inDrawer);
    root.querySelector(inDrawer ? ".v12-drawer" : "[data-under]").setAttribute("data-part", "controls");
  }
  function setOpen(next) {
    root.toggleAttribute("data-open", next);
    markControls();
  }
  function applyRoute(next) {
    cancelApply?.();
    cancelApply = null; busy = false; status = null; appliedAs = null; tab = "style";
    route = next;
    open = next !== "recording";
    const s = store.get();
    if (next === "style" && s.style !== "recorded") {
      recordedStyle = s.screen ? s.style : "camera";
      store.set({ style: "recorded" });
      baseline = store.get();
    } else if (next !== "style" && s.style === "recorded") {
      store.set({ style: recordedStyle });
    }
    root.dataset.route = next;
    setOpen(open);
    document.querySelector('[data-slot="page-title"] span').textContent = next === "style" ? "Untitled video" : "Record video";
    paintUnder();
    syncTabs();
    syncFinish();
    syncClock();
    sync();
  }
  function route_() {
    const hash = location.hash.slice(1);
    const next = ["recording", "popout", "style"].includes(hash) ? hash : "recorder";
    if (next === route) return;
    if (next === "popout") {
      cancelApply?.();
      const s = store.get();
      if (s.style === "recorded") store.set({ style: recordedStyle });
      route = next; mounted = false; root = null;
      document.body.classList.remove("v12-body");
      document.body.innerHTML = popoutMarkup();
      syncClock();
      sync();
      return;
    }
    if (!mounted) { mount(); applyRoute(next); return; }
    const leavingForLive = next === "recording" && root.contains(document.activeElement);
    morph(() => applyRoute(next));
    if (leavingForLive) root.querySelector('[data-under] [aria-checked="true"]')?.focus({ preventScroll: true });
  }
  function toggleDrawer(next) {
    if (phone() || open === next) return;
    morph(() => {
      open = next;
      setOpen(next);
      if (route === "recording") { paintUnder(); syncClock(); }
      sync();
    });
    root.querySelector(next ? "[data-close]" : "[data-open-drawer]").focus({ preventScroll: true });
  }

  // ---- Device menus: the real trigger, with the one device the kit names
  let menu = null;
  function closeMenu(refocus) {
    if (!menu) return;
    menu.trigger.setAttribute("aria-expanded", "false");
    menu.el.remove();
    if (refocus) menu.trigger.focus();
    menu = null;
  }
  function openMenu(trigger) {
    const name = trigger.getAttribute("aria-label").split(": ")[1];
    const el = document.createElement("div");
    el.className = "v12-menu";
    el.setAttribute("role", "menu");
    el.innerHTML = `<button type="button" role="menuitemradio" aria-checked="true">${K.icon("check", 16)}<span>${name}</span></button>`;
    trigger.after(el);
    trigger.setAttribute("aria-expanded", "true");
    el.querySelector("button").focus();
    menu = { el, trigger };
  }

  function startApply() {
    busy = true; status = null; appliedAs = null;
    syncFinish();
    cancelApply = K.fakeApply((next) => {
      status = next;
      if (next.kind === "done") { busy = false; cancelApply = null; appliedAs = JSON.stringify(store.get()); }
      syncFinish();
    });
  }
  function pickStyle(id) {
    if (route === "recording" || route === "popout") store.set(id === "camera" ? { style: id } : { style: id, screen: true });
    else store.set({ style: id });
  }

  // ---- Events
  document.addEventListener("click", (event) => {
    const t = event.target.closest("button, [role=radio]");
    if (menu && !menu.el.contains(event.target) && t !== menu.trigger) closeMenu(false);
    if (!t) return;
    if (t.dataset.style) return pickStyle(t.dataset.style);
    if (t.dataset.swatch) {
      const key = t.closest("[data-reveal]").dataset.reveal;
      lastSwatch[key] = t.dataset.swatch;
      return store.set({ [key]: t.dataset.swatch });
    }
    if (t.dataset.switch) {
      event.preventDefault();
      const key = t.dataset.switch, s = store.get();
      if (key === "cameraBg" || key === "screenBg") return store.set({ [key]: s[key] ? null : lastSwatch[key] });
      return store.set({ [key]: !s[key] });
    }
    if (t.closest("[data-tabs]")) {
      tab = t.textContent.trim().toLowerCase();
      return syncTabs();
    }
    if (t.matches('[data-slot="dropdown-menu-trigger"]')) {
      const wasOpen = menu?.trigger === t;
      closeMenu(wasOpen);
      if (!wasOpen) openMenu(t);
      return;
    }
    if (t.matches("[role=menuitemradio]")) return closeMenu(true);
    if (t.matches("[data-close]")) return toggleDrawer(false);
    if (t.matches("[data-open-drawer]")) return toggleDrawer(true);
    if (t.matches("[data-start]")) { elapsed = 0; paused = false; location.hash = "#recording"; return; }
    if (t.matches("[data-share]")) return store.set({ screen: true });
    if (t.matches("[data-change]")) return store.set({ screen: false });
    if (t.matches("[data-stop]")) { location.hash = "#style"; return; }
    if (t.matches("[data-pause]")) { paused = !paused; return syncClock(); }
    if (t.matches("[data-apply]")) return startApply();
    if (t.matches("[data-back]")) {
      store.set(baseline);
      appliedAs = null; status = null;
      return syncFinish();
    }
    if (t.closest(".v12-finish") && t.textContent.trim() === "Re-record") location.hash = "#recorder";
  });
  document.addEventListener("change", (event) => {
    const field = event.target.dataset?.field;
    if (field) store.set({ [field]: event.target.value });
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      if (menu) return closeMenu(true);
      if (root && open && event.target.tagName !== "SELECT") toggleDrawer(false);
      return;
    }
    const radio = event.target.closest?.("[role=radio]");
    if (!radio) return;
    if ((event.key === " " || event.key === "Enter") && radio.tagName !== "BUTTON") { event.preventDefault(); radio.click(); return; }
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
    if (!step) return;
    event.preventDefault();
    const group = [...radio.closest("[role=radiogroup]").querySelectorAll("[role=radio]")].filter((el) => !el.disabled && el.offsetParent !== null);
    const next = group[(group.indexOf(radio) + step + group.length) % group.length];
    next.focus();
    next.click();
  });
  // The Style heading names whichever tile the pointer is on, with no tooltip delay.
  document.addEventListener("pointerover", (event) => {
    const name = event.target.closest?.(".v12-drawer")?.querySelector("[data-style-name]");
    if (!name) return;
    const over = event.target.closest("[data-drawer-tiles] [data-style]");
    name.textContent = over ? over.getAttribute("aria-label") : [RECORDED, ...K.STYLES].find((o) => o.id === currentStyle(store.get()))?.label ?? "";
  });
  matchMedia("(max-width: 640px)").addEventListener("change", () => {
    if (!root) return;
    if (route === "recording") { paintUnder(); syncClock(); }
    markControls();
    sync();
  });
  setInterval(() => {
    if (live() && !paused) { elapsed += 1; syncClock(); }
  }, 1000);
  window.addEventListener("hashchange", route_);
  route_();
})();
</script>
<script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
