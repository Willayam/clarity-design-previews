    <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 7.5v3.5M8 5.2v.1"/></symbol>
    <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.5v.1"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.2"/><path d="M10 3v10"/></symbol>

<div class="app" id="app" data-rail="open" data-inspector="open">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn quiet icon lg" id="rail-toggle" type="button" aria-label="Toggle navigation" aria-expanded="true" data-tip="Navigation">
        <svg class="ic"><use href="#i-panel-left"/></svg>
      </button>
      <div class="ws">
        <span class="ws-mark" aria-hidden="true">C</span>
        <span class="ws-name">Clarity</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Prototype views (review chrome, not product navigation)" id="view-tabs">
      <span class="tabs-kicker" aria-hidden="true">Review</span>
      <a class="tab" href="?view=library" data-view="library" aria-current="page">Library</a>
      <a class="tab" href="?view=editor" data-view="editor">Editor</a>
      <a class="tab" href="?view=system" data-view="system">System</a>
    </nav>
    <div class="topbar-right">
      <button class="btn quiet icon lg" id="theme-toggle" type="button" aria-label="Switch to dark theme" data-tip="Theme">
        <svg class="ic"><use href="#i-moon"/></svg>
      </button>
      <button class="btn quiet icon lg" id="inspector-toggle" type="button" aria-label="Toggle inspector" aria-pressed="true" data-tip="Inspector">
        <svg class="ic"><use href="#i-sidebar"/></svg>
      </button>
      <div class="avatar" role="img" aria-label="Alex Morgan">AM</div>
    </div>
  </header>

  <main class="views" id="views">

    <!-- Library: rail · list · inspector -->
    <section class="view" id="view-library" data-view="library" aria-label="Library">
      <aside class="rail" id="lib-rail" aria-label="Library navigation"></aside>

      <section class="pane" id="lib-pane" aria-labelledby="lib-title">
        <div class="pane-head">
          <button class="btn quiet icon drawer-only" type="button" data-open-rail aria-label="Open navigation">
            <svg class="ic"><use href="#i-menu"/></svg>
          </button>
          <div class="crumbs" id="lib-crumbs"><h1 class="pane-title" id="lib-title">All media</h1></div>
          <span class="pane-meta" id="lib-meta"></span>
          <div class="pane-tools">
            <button class="btn icon phone-only" type="button" id="lib-new" aria-label="New" aria-haspopup="menu" aria-expanded="false">
              <svg class="ic"><use href="#i-plus"/></svg>
            </button>
            <button class="btn" type="button" id="lib-newpage" aria-label="New Journey Page" data-tip="New Journey Page">
              <svg class="ic"><use href="#i-page"/></svg><span class="lbl">New page</span>
            </button>
            <button class="btn" type="button" id="lib-upload" aria-label="Upload files" data-tip="Upload files">
              <svg class="ic"><use href="#i-upload"/></svg><span class="lbl">Upload</span>
            </button>
            <input type="file" id="lib-file" class="sr-only" multiple accept="video/*,image/*,.pdf" tabindex="-1" aria-hidden="true">
            <button class="btn primary" type="button" id="lib-record" aria-label="Record a video" data-tip="Record a video">
              <svg class="ic"><use href="#i-record"/></svg><span class="lbl">Record</span>
            </button>
            <button class="btn quiet icon overlay-only" type="button" data-open-inspector aria-label="Details">
              <svg class="ic"><use href="#i-info"/></svg>
            </button>
          </div>
        </div>
        <div class="list-wrap">
          <div class="toolbar">
            <div class="search">
              <svg class="ic"><use href="#i-search"/></svg>
              <input class="input" id="lib-query" type="search" placeholder="Search library" aria-label="Search library" autocomplete="off">
              <button class="btn quiet icon xs clear" type="button" id="lib-query-clear" aria-label="Clear search" hidden>
                <svg class="ic sm"><use href="#i-x"/></svg>
              </button>
            </div>
            <div class="seg" role="group" aria-label="Type" id="lib-filter">
              <button type="button" data-filter="all" aria-pressed="true">All</button>
              <button type="button" data-filter="video" aria-pressed="false">Videos</button>
              <button type="button" data-filter="page" aria-pressed="false">Pages</button>
              <button type="button" data-filter="document" aria-pressed="false">Documents</button>
            </div>
            <span class="spacer"></span>
            <button class="btn quiet menu-btn" type="button" id="lib-sort" aria-haspopup="menu" aria-expanded="false">
              <svg class="ic"><use href="#i-sort"/></svg><span id="lib-sort-label">Recent</span><svg class="ic sm chev"><use href="#i-chev-down"/></svg>
            </button>
            <div class="seg" role="group" aria-label="Layout" id="lib-density">
              <button type="button" data-density="list" aria-pressed="true" aria-label="List" data-tip="List"><svg class="ic sm"><use href="#i-list"/></svg></button>
              <button type="button" data-density="grid" aria-pressed="false" aria-label="Grid" data-tip="Grid"><svg class="ic sm"><use href="#i-grid"/></svg></button>
            </div>
          </div>
          <div class="list" id="lib-list" tabindex="0" role="listbox" aria-multiselectable="true" aria-label="Media"></div>
          <div id="lib-selbar"></div>
        </div>
      </section>

      <div class="divider" data-resize="library" role="separator" aria-orientation="vertical" aria-label="Resize inspector" tabindex="0" data-tip="Drag to resize. Double-click to reset."></div>

      <aside class="inspector" id="lib-inspector" aria-label="Details">
        <div class="panel-head">
          <span class="panel-kicker" id="lib-insp-kicker">Library</span>
          <span class="panel-title" id="lib-insp-title"></span>
          <button class="btn quiet icon" type="button" id="lib-insp-more" aria-label="More actions" aria-haspopup="menu" hidden><svg class="ic"><use href="#i-more"/></svg></button>
          <button class="btn quiet icon close-insp" type="button" data-close-inspector aria-label="Close details"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="panel-body" id="lib-insp-body"></div>
      </aside>
    </section>

    <!-- Editor: section rail · page canvas · inspector -->
    <section class="view" id="view-editor" data-view="editor" aria-label="Editor" hidden>
      <aside class="rail" id="ed-rail" aria-label="Page structure"></aside>

      <section class="pane" id="ed-pane" aria-labelledby="ed-title">
        <div class="pane-head">
          <button class="btn quiet icon drawer-only" type="button" data-open-rail aria-label="Open page structure">
            <svg class="ic"><use href="#i-menu"/></svg>
          </button>
          <button class="btn quiet icon" type="button" id="ed-back" aria-label="Back to library" data-tip="Back to library">
            <svg class="ic"><use href="#i-back"/></svg>
          </button>
          <h1 class="pane-title" id="ed-title" data-bind="page.title"></h1>
          <span class="saved" id="ed-saved"><span class="dot ok"></span><span class="lbl">Saved</span></span>
          <div class="pane-tools">
            <div class="seg" role="group" aria-label="Preview device" id="ed-device" hidden>
              <button type="button" data-device="desktop" aria-pressed="true" aria-label="Desktop" data-tip="Desktop"><svg class="ic sm"><use href="#i-screen"/></svg></button>
              <button type="button" data-device="phone" aria-pressed="false" aria-label="Phone" data-tip="Phone"><svg class="ic sm"><use href="#i-phone"/></svg></button>
            </div>
            <button class="btn" type="button" id="ed-preview" aria-pressed="false" aria-label="Preview" data-tip="Preview as the prospect sees it">
              <svg class="ic"><use href="#i-eye"/></svg><span class="lbl">Preview</span>
            </button>
            <button class="btn primary" type="button" id="ed-share" aria-label="Share" data-tip="Share">
              <svg class="ic"><use href="#i-share"/></svg><span class="lbl">Share</span>
            </button>
            <button class="btn quiet icon overlay-only" type="button" data-open-inspector aria-label="Properties">
              <svg class="ic"><use href="#i-sliders"/></svg>
            </button>
          </div>
        </div>
        <div class="canvas" id="ed-canvas"></div>
      </section>

      <div class="divider" data-resize="editor" role="separator" aria-orientation="vertical" aria-label="Resize inspector" tabindex="0" data-tip="Drag to resize. Double-click to reset."></div>

      <aside class="inspector" id="ed-inspector" aria-label="Properties">
        <div class="panel-head">
          <span class="panel-kicker" id="ed-insp-kicker">Page</span>
          <span class="panel-title" id="ed-insp-title"></span>
          <button class="btn quiet icon close-insp" type="button" data-close-inspector aria-label="Close properties"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="panel-body" id="ed-insp-body"></div>
      </aside>
    </section>

    <!-- System sheet -->
    <section class="view view-system" id="view-system" data-view="system" aria-label="System" hidden>
      <div class="system" id="system"></div>
    </section>

  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="overlay-root"></div>
</div>

<script src="app.js"></script>
</body>
</html>
