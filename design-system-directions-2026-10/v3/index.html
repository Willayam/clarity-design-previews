      <p>One typeface, fifteen neutral roles per scheme (eight surfaces, three lines, four text), one accent, and hairlines that separate things. Chrome is flat. Media carries the colour. Actions never sit on top of media. This page lists the tokens and shows every control state. Examples marked <span class="tag warning"><i class="dot"></i>Simulated</span> are forced with a class so they show in a screenshot; examples marked <span class="tag success"><i class="dot"></i>Actual</span> respond to your pointer and keyboard.</p>

      <a class="btn btn-sm btn-ghost" href="#overlays">Overlays</a>

  <section class="sys-section" id="tokens">
    <h2>Colour tokens</h2>
    <p>Both schemes are shown at once, whichever theme is active. Every text role clears 4.5:1 on every surface it is allowed on. Field and switch borders use the stronger line so a field edge clears 3:1 against the page.</p>
    <div class="two-up">
      <div class="panel light">
        <div class="panel-label">Light</div>
        <div class="swatches" data-spec="tokens-light"></div>
      </div>
      <div class="panel dark">
        <div class="panel-label">Dark</div>
        <div class="swatches" data-spec="tokens-dark"></div>
      </div>
    </div>
  </section>

  <section class="sys-section" id="type">
    <h2>Type</h2>
    <p>Geist for everything, fixed pixel sizes, one weight step between a label and its value. There is no display size in the app chrome; the largest size in the product is the 20px detail title. Numbers in rows and meta are tabular.</p>
    <div>
      <div class="type-row"><code>24 / 32, 600, -0.02em</code><span style="font-size:24px;line-height:32px;font-weight:600;letter-spacing:-0.02em">Design system page title only</span></div>
      <div class="type-row"><code>20 / 28, 600, -0.015em</code><span style="font-size:20px;line-height:28px;font-weight:600;letter-spacing:-0.015em">Stat value, detail title</span></div>
      <div class="type-row"><code>15 / 20, 600, -0.01em</code><span style="font-size:15px;line-height:20px;font-weight:600;letter-spacing:-0.01em">Dialog and inspector titles</span></div>
      <div class="type-row"><code>14 / 20, 500</code><span style="font-size:14px;line-height:20px;font-weight:500">Breadcrumb, comfortable card title</span></div>
      <div class="type-row"><code>13 / 20, 400 and 500</code><span>Body, rows, controls. <b style="font-weight:500">Row titles and buttons are 500.</b></span></div>
      <div class="type-row"><code>12 / 16, 400 and 500</code><span style="font-size:12px;line-height:16px">Meta, column heads, field labels, hints</span></div>
      <div class="type-row"><code>11 / 16, 500</code><span style="font-size:11px;line-height:16px;font-weight:500">Tags, keyboard hints, section labels on the canvas</span></div>
    </div>
  </section>

  <section class="sys-section" id="space">
    <h2>Spacing and sizes</h2>
    <p>A 4px base. Page inset is 20px on desktop and 16px on phones. Fixed chrome heights: header 48, toolbar 40, control 32, small control 28, row 56 (32 compact). On a coarse pointer every control, menu item and hit area grows to 44, the toolbar to 48 and compact rows to 44. Glyphs keep their size.</p>
    <div class="space-scale">
      <div><i style="height:2px"></i>2</div>
      <div><i style="height:4px"></i>4</div>
      <div><i style="height:6px"></i>6</div>
      <div><i style="height:8px"></i>8</div>
      <div><i style="height:12px"></i>12</div>
      <div><i style="height:16px"></i>16</div>
      <div><i style="height:20px"></i>20</div>
      <div><i style="height:24px"></i>24</div>
      <div><i style="height:32px"></i>32</div>
      <div><i style="height:48px"></i>48</div>
    </div>
    <div class="rules">
      <div class="rule"><b>Sidebar 232px</b><span>40px narrower than today. The tree uses 16px per depth.</span></div>
      <div class="rule"><b>Inspector 344px</b><span>Opens with a selection. The selection toolbar takes the same width, so Share and Open sit above the panel.</span></div>
      <div class="rule"><b>Row 56 / 32</b><span>Default and compact. Thumbs are 40px tall; compact swaps them for a type glyph.</span></div>
      <div class="rule"><b>Grid tile 212 / 156</b><span>Minimum tile widths per density. Cards get 8px padding and a 10px radius.</span></div>
    </div>
  </section>

  <section class="sys-section" id="shape">
    <h2>Radius and elevation</h2>
    <p>Three radii: 4 for tags and checkboxes, 6 for controls and thumbs, 10 for cards. Menus and popovers use 8, dialogs 12. Elevation has two levels. Level 0 is a hairline. Level 1 is a 1px line plus one soft shadow, only on things that float: menu, popover, dialog. The toast and tooltip use the float tokens, ink in light and the raised surface with a line in dark, and need no shadow.</p>
    <div class="row-of" style="align-items:flex-start;gap:24px">
      <div class="spec-stack">
        <span class="spec-label">Level 0, hairline</span>
        <div style="width:200px;height:72px;border:1px solid var(--line);border-radius:var(--r-2)"></div>
      </div>
      <div class="spec-stack">
        <span class="spec-label">Level 1, floating</span>
        <div style="width:200px;height:72px;border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-overlay);background:var(--bg-raised)"></div>
      </div>

        <span class="spec-label">Media edge</span>
        <div class="thumb" style="--thumb-h:72px" data-spec="thumb-sample"></div>
      </div>
      <div class="spec-stack">
        <span class="spec-label">Radii 4, 6, 10, 12</span>
        <div class="row-of">
          <div style="width:40px;height:40px;border:1px solid var(--line-strong);border-radius:4px"></div>
          <div style="width:40px;height:40px;border:1px solid var(--line-strong);border-radius:6px"></div>
          <div style="width:40px;height:40px;border:1px solid var(--line-strong);border-radius:10px"></div>
          <div style="width:40px;height:40px;border:1px solid var(--line-strong);border-radius:12px"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="sys-section" id="buttons">
    <h2>Buttons</h2>
    <p>Primary is ink, not blue, so the accent is left for selection and focus. Hover and pressed are one colour step each, with no movement, no shadow. Busy keeps the label and width and puts a spinner in the icon slot. Disabled drops to the disabled text colour with no fill.</p>
    <div class="matrix-wrap">
      <div class="matrix" data-spec="button-matrix"></div>
    </div>

    </div>
  </section>

  <section class="sys-section" id="fields">
    <h2>Fields</h2>
    <p>Fields are outlined with the stronger line so the edge reads at 3:1. Focus is the 2px accent ring drawn inside the border. Error replaces the border and ring with the danger colour and adds a 12px message under the field.</p>

  <section class="sys-section" id="selection">
    <h2>Checkboxes, switches and selection</h2>
    <p>A checkbox is 16px with a 28px hit area (44px on touch). Row checkboxes rest hidden and appear for the row under the pointer or with focus, and for every row once anything is selected. The switch is 28 by 16. Selection on rows and cards is the pale accent fill, with no border change, and multi-select never hides the single-item actions in the toolbar, it disables the ones that need one item.</p>

  </section>

    <div class="spec-grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">

  <section class="sys-section" id="overlays">
    <h2>Menu, tooltip and toast</h2>
    <p>Menus float at level 1 with 28px items (44 on touch). Tooltips sit on the float surface, 12px, below the control after 350ms, never on touch. Toasts share that surface at the bottom centre with one optional action, and the action is always the undo of what just happened. The float surface is dark in both schemes, so neither becomes a white bar in dark mode.</p>

  <section class="sys-section" id="affordances">

    </div>
  </section>

  <section class="sys-section" id="icons">
    <h2>Icons</h2>
    <p>Lucide-style outlines at 16px with a 1.75px stroke, drawn inline from one sprite. Play, pause and stop are filled because they sit on media chrome.</p>
    <div class="icon-sheet" data-spec="icons"></div>
  </section>

  <section class="sys-section" id="rules">
    <h2>Rules</h2>
    <div class="dos">
      <div>
        <h4>Do</h4>
        <ul>
          <li>Separate regions with a hairline, not a shadow or a tint.</li>
          <li>Put item actions in the selection toolbar and the item menu, never over the thumbnail.</li>
          <li>Use the accent for selection, focus and checked states only.</li>
          <li>Keep one label per button for its whole life; a spinner carries busy.</li>
          <li>Give every control default, hover, pressed, focus, disabled and busy before shipping it.</li>
        </ul>
      </div>
      <div>
        <h4>Do not</h4>
        <ul>
          <li>No gradients, bevels, inner highlights or blur in app chrome.</li>
          <li>No overlays on media except the play glyph on a page's own video.</li>
          <li>No movement on press. Colour steps only.</li>
          <li>No second accent. Status uses the four semantic colours as dots and text.</li>
          <li>No modal where an inline state or a popover can do the job.</li>
        </ul>
      </div>
    </div>
  </section>
</div>
