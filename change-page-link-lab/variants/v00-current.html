  LINK.page({
    tryNames: false,
    mount(host) {
      host.innerHTML = LINK.dialog();
      host.addEventListener('click', (event) => {
        const act = event.target.closest('[data-act]')?.dataset.act;
        if (act === 'copy' || act === 'copy-main') LINK.copied(host);
      });
    },
  });
</script>
