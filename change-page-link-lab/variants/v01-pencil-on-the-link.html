<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v01 Pencil on the link</title>
<script type="application/json" id="lab-meta">
{"id": "v01", "name": "Pencil on the link", "axis": "edit in place behind a pencil", "idea": "A pencil next to the copy icon turns the link row into a field with Save and Cancel. Nothing else in the dialog moves.", "cost": "The pencil is easy to miss", "model": "opus", "round": 1, "parents": [], "recommended": true, "why": "The smallest change that works. One icon, and the row it edits is the row that shows the link.", "baseline": false}
</script>
<script src="../kit/theme.js"></script>
<link rel="stylesheet" href="../kit/app.css">
<link rel="stylesheet" href="../kit/link.css">
</head>
<body>
<script src="../kit/buttons.js"></script>
<script src="../kit/reserved.js"></script>
<script src="../kit/shell.js"></script>
<script src="../kit/link.js"></script>
<script>
(() => {
  const { ORIGINAL, statusOf, savedNote, linkRow, field, status, dialog, iconBtn, btn, copied, c } = LINK;
  const pencil = iconBtn('pencil', 'Change link', 'data-act="edit"');

  function viewRow(link, note) {
    return linkRow({ link, actions: pencil, below: note ? `<p class="lk-status" data-state="${note.state}">${note.text}</p>` : '' });
  }
  function editRow(value, current, frozen = false) {
    const s = statusOf(value, current);
    return `<div class="lk-link">
      <div class="lk-box">
        ${field({ value, frozen })}
        <button type="button" class="${btn('default', 'sm')}" data-act="save" ${s.canSave ? '' : 'disabled'}>${s.label}</button>
        ${iconBtn('x', 'Cancel', 'data-act="cancel"')}
      </div>
      ${status(s)}
    </div>`;
  }

  LINK.page({
    mount(host) {
      let current = ORIGINAL;
      let mode = 'view';
      let justSaved = false;
      function render(focus = false, draft = '') {
        const note = current === ORIGINAL ? null : { state: justSaved ? 'saved' : 'empty', text: justSaved ? `Saved. ${savedNote()}` : savedNote() };
        host.innerHTML = dialog({ link: mode === 'view' ? viewRow(current, note) : editRow(draft, current) });
        if (mode !== 'edit') return;
        const input = host.querySelector('[data-field]');
        input.addEventListener('input', () => update(input.value));
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') { event.preventDefault(); save(input.value); }
          if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); cancel(); }
        });
        if (focus) { input.focus(); input.select(); }
      }
      function update(raw) {
        const s = statusOf(raw, current);
        const line = host.querySelector('[data-status]');
        line.dataset.state = s.state;
        line.textContent = s.message;
        const button = host.querySelector('[data-act="save"]');
        button.disabled = !s.canSave;
        button.textContent = s.label;
      }
      function edit(draft) { mode = 'edit'; justSaved = false; render(true, draft ?? (current === ORIGINAL ? '' : current)); }
      function cancel() { mode = 'view'; render(); host.querySelector('[data-act="edit"]').focus(); }
      function save(raw) {
        if (!statusOf(raw, current).canSave) return;
        current = c.normalize(raw) || ORIGINAL;
        mode = 'view';
        justSaved = current !== ORIGINAL;
        render();
      }
      host.addEventListener('click', (event) => {
        const act = event.target.closest('[data-act]')?.dataset.act;
        if (act === 'edit') edit();
        if (act === 'cancel') cancel();
        if (act === 'save') save(host.querySelector('[data-field]').value);
        if (act === 'copy' || act === 'copy-main') copied(host);
      });
      render();
      return {
        tryName(value) {
          if (mode !== 'edit') edit(value);
          const input = host.querySelector('[data-field]');
          input.value = value;
          update(value);
          input.focus();
        },
      };
    },
    frozen(state) {
      if (state.id === 'before') return dialog({ link: viewRow(ORIGINAL) });
      if (state.id === 'saved') return dialog({ link: viewRow(state.value, { state: 'saved', text: `Saved. ${savedNote()}` }) });
      return dialog({ link: editRow(state.value, ORIGINAL, true) });
    },
  });
})();
</script>
<script src="../_lab/runtime.js" data-lab-runtime defer></script></body>
</html>
