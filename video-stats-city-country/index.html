<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video stats: city and country — before / after</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 32px; background: #f6f7f9; color: #111; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0 0 24px; color: #555; max-width: 760px; }
  h2 { font-size: 17px; margin: 32px 0 12px; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
  figure { margin: 0; background: #fff; border: 1px solid #e3e5e8; border-radius: 10px; padding: 12px; }
  figcaption { font-weight: 600; margin-bottom: 8px; }
  img { width: 100%; height: auto; display: block; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Video stats: location shows city and country</h1>
  <p>Statistics modal in the real editor, with mocked viewer data (no real viewer locations). Before = main, after = this branch.</p>

  <h2>Individual views</h2>
  <div class="pair">
    <figure><figcaption>Before</figcaption><img src="before-sessions.png" alt="Before: views list shows city only"></figure>
    <figure><figcaption>After</figcaption><img src="after-sessions.png" alt="After: views list shows city and country"></figure>
  </div>

  <h2>Grouped locations (imported stats)</h2>
  <div class="pair">
    <figure><figcaption>Before</figcaption><img src="before-locations.png" alt="Before: locations list shows city only"></figure>
    <figure><figcaption>After</figcaption><img src="after-locations.png" alt="After: locations list shows city and country"></figure>
  </div>
</body>
</html>
