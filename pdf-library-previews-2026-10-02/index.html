<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF library previews</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#edf1f7;font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 20px}h1{font-size:30px;letter-spacing:-.04em;margin:0 0 8px}p{color:#bbc5d5;margin:0 0 24px}button{font:inherit;color:inherit;background:#222e40;border:1px solid #42526a;border-radius:8px;padding:9px 18px;cursor:pointer}button[aria-pressed=true]{background:#dce8ff;color:#10203c}nav{display:flex;gap:8px;margin-bottom:16px}.frame{border-radius:12px;overflow:hidden;border:1px solid #374259;background:#f3f6ff;max-height:480px}.frame img{display:block;width:100%;height:auto}.mobile{max-width:390px;max-height:760px;margin-top:16px}.caption{font-size:14px;margin-top:12px}h2{font-size:20px;margin-top:36px}a{color:#b4d0ff}@media(max-width:600px){main{padding:24px 12px}.frame{max-height:280px}.mobile{max-height:700px}}
</style>
</head>
<body><main>
<h1>PDF library previews</h1>
<p>Document cards now render the PDF's first page. These screenshots use local fixture documents, including an unreadable PDF that keeps its fallback.</p>
<nav aria-label="Compare preview states"><button aria-pressed="false" data-state="before">Before</button><button aria-pressed="true" data-state="after">After</button></nav>
<div class="frame"><img id="desktop" src="desktop-after.png" alt="Library cards showing rendered PDF first pages and an unreadable-file fallback"></div>
<p class="caption">Actual Home route and PDF renderer. API records are mocked. This change has not been deployed to production.</p>
<h2>Phone width</h2>
<div class="frame mobile"><img id="mobile" src="mobile-after.png" alt="PDF library previews at phone width"></div>
</main>
<script>
for(const button of document.querySelectorAll('button[data-state]'))button.addEventListener('click',()=>{for(const other of document.querySelectorAll('button[data-state]'))other.setAttribute('aria-pressed',String(other===button));for(const kind of ['desktop','mobile'])document.getElementById(kind).src=kind+'-'+button.dataset.state+'.png'});
</script>
</body></html>
