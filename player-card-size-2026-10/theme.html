<template id="clarity-player">
<style>
  media-controller { width: 100%; height: 100%; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
    --media-control-background: transparent; --media-control-hover-background: transparent;
    --media-primary-color: #fff; --media-text-color: #fff; --media-icon-color: #fff;
    --media-font-family: InterVariable, Inter, ui-sans-serif, system-ui, sans-serif;
    --media-font-size: 13px; --media-font-weight: 500; --media-tooltip-display: none;
    --media-control-transition-in: opacity .18s ease-out; --media-control-transition-out: opacity .9s ease;
    --media-focus-box-shadow: none; --center: 64px; }
  media-controller[userinactive]:not([mediapaused]) { cursor: none; }
  svg { width: 22px; height: 22px; display: block; }
  .row > * { height: 40px; padding: 0 9px; flex-shrink: 0; }
  @media (pointer: coarse) { .row > * { height: 44px; min-width: 44px; } }
  media-time-display { font-variant-numeric: tabular-nums; letter-spacing: .01em; padding: 0 8px; }
  /* Sized for the widest rate, 1.25x, so changing speed never moves the scrubber. */
  media-playback-rate-button { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums;
    box-sizing: border-box; width: calc(5ch + 18px); justify-content: center; }
  @media (pointer: coarse) { media-controller[mediapaused] media-time-range { --media-range-thumb-opacity: 1; } }
  media-captions-button:not([mediasubtitleslist]) { display: none; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 5px rgba(0,0,0,.35); border-radius: 10px; }
  media-time-range { height: 24px; padding: 0; --media-range-padding: 0;
    --media-range-track-height: 3px; --media-range-track-border-radius: 999px;
    --media-range-thumb-width: 12px; --media-range-thumb-height: 12px; --media-range-thumb-opacity: 0;
    --media-range-thumb-background: #fff; --media-range-thumb-box-shadow: 0 1px 4px rgba(0,0,0,.35);
    --media-preview-thumbnail-border-radius: 8px; --media-preview-thumbnail-border: 1px solid rgba(255,255,255,.18);
    --media-preview-thumbnail-box-shadow: 0 8px 24px rgba(0,0,0,.35);
    --media-preview-time-background: transparent; --media-preview-time-margin: 6px 0 0; --media-preview-time-text-shadow: 0 1px 3px rgba(0,0,0,.6);
    transition: --media-range-track-height .16s ease, --media-range-thumb-opacity .16s ease; }
  media-time-range:hover, media-time-range:focus-visible { --media-range-track-height: 6px; --media-range-thumb-opacity: 1; }
  .glyph { display: grid; place-items: center; }
  .glyph svg + svg { display: none; }
  media-controller[mediaended] .glyph svg:first-child { display: none; }
  media-controller[mediaended] .glyph svg + svg { display: block; }
  .stack { display: grid; place-items: center; color: #fff; }
  .stack > * { grid-area: 1 / 1; }
  media-controller:not([breakpointmd]) { --center: 52px; }
  media-controller:not([breakpointsm]) { --center: 44px; }
  media-loading-indicator { --media-loading-indicator-icon-height: 44px; --media-loading-icon-color: rgba(255,255,255,.9); }
  .pre { position: relative; display: grid; place-items: center; transition: opacity .25s ease; }
  .pre > * { grid-area: 1 / 1; }
  media-controller[mediahasplayed] .pre { opacity: 0; pointer-events: none; }
  .prePlay { width: calc(var(--center) * 1.15); height: calc(var(--center) * 1.15); padding: 0; border: 0; border-radius: 999px;
    background: rgba(10,10,12,.84); color: #fff; --media-primary-color: #fff; --media-icon-color: #fff;
    box-shadow: 0 8px 24px -6px rgba(0,0,0,.5); transition: transform .25s cubic-bezier(.2,.8,.2,1), background .2s ease; }
  .prePlay:hover { transform: scale(1.04); background: rgba(10,10,12,.92); }
  .prePlay svg { width: calc(var(--center) * .46); height: calc(var(--center) * .46); }
  media-controller:not([mediahasplayed]) .chrome { opacity: 0; pointer-events: none; }
  media-controller:not([mediahasplayed]) .resume,
  media-controller:not([mediapaused]) .resume { opacity: 0; pointer-events: none; transform: scale(.92); }
  .resume { transition: opacity .2s ease, transform .2s cubic-bezier(.2,.8,.2,1); }
  .stack .resume { width: var(--center); height: var(--center); padding: 0; background: none; box-shadow: none; color: #fff;
    --media-primary-color: #fff; --media-icon-color: #fff; filter: drop-shadow(0 0 1px rgba(0,0,0,.45)) drop-shadow(0 2px 10px rgba(0,0,0,.4)); }
  .stack .resume svg { width: calc(var(--center) * .62); height: calc(var(--center) * .62); }
  media-controller:not([breakpointmd]) .hide-sm { display: none; }
  media-controller:not([breakpointsm]) .hide-xs { display: none; }
  .chrome { position: relative; z-index: 1; filter: drop-shadow(0 0 1px rgba(0,0,0,.45)) drop-shadow(0 1px 6px rgba(0,0,0,.35));
    width: 100%; box-sizing: border-box; padding: 0 12px 6px 8px; }
  .fixedScrim { position: absolute; inset: auto 0 0 0; height: clamp(96px, 34%, 190px); pointer-events: none; opacity: .7;
    background: linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.7) 12%, rgba(0,0,0,.57) 25%, rgba(0,0,0,.43) 38%, rgba(0,0,0,.29) 52%, rgba(0,0,0,.16) 67%, rgba(0,0,0,.07) 82%, transparent 100%); }
  media-controller:not([mediahasplayed]) .fixedScrim { opacity: 0; }
  .row { display: flex; align-items: center; gap: 2px; }
  .row media-time-range { flex: 1 1 auto; flex-shrink: 1; min-width: 60px; margin: 0 6px; padding: 0;
    --media-range-track-background: rgba(255,255,255,.4); --media-time-range-buffered-color: rgba(255,255,255,.55); --media-range-bar-color: #fff;
    --media-range-thumb-background: #fff; }
  media-time-display, media-playback-rate-button { text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<media-controller breakpoints="sm:420 md:640" defaultstreamtype="on-demand" autohide="2" hotkeys="{{hotkeys}}" nohotkeys="{{nohotkeys}}" gesturesdisabled="{{disabled}}">
  <slot name="media" slot="media"></slot>
  <slot name="poster" slot="poster"></slot>
  <div slot="centered-chrome" class="stack">
    <media-loading-indicator noautohide></media-loading-indicator>
    <div class="pre"><media-play-button notooltip class="prePlay"><span slot="play" class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6Z" fill="currentColor"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><svg slot="pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.25" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.25" fill="currentColor"/></svg></media-play-button></div>
    <media-play-button notooltip class="resume"><span slot="play" class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6Z" fill="currentColor"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><svg slot="pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.25" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.25" fill="currentColor"/></svg></media-play-button>
  </div>
  <div class="fixedScrim"></div>
  <div class="chrome">
    <div class="row">
      <media-play-button notooltip><svg slot="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6Z" fill="currentColor"/></svg><svg slot="pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.25" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.25" fill="currentColor"/></svg></media-play-button>
      <media-time-display showduration class="hide-sm"></media-time-display>
      <media-time-range></media-time-range>
      <media-mute-button notooltip class="hide-sm"><svg slot="high" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4 3.3a.8.8 0 0 0 1.4-.6V5.8a.8.8 0 0 0-1.4-.6l-4 3.3H5a1 1 0 0 0-1 1Z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg slot="medium" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4 3.3a.8.8 0 0 0 1.4-.6V5.8a.8.8 0 0 0-1.4-.6l-4 3.3H5a1 1 0 0 0-1 1Z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg slot="low" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4 3.3a.8.8 0 0 0 1.4-.6V5.8a.8.8 0 0 0-1.4-.6l-4 3.3H5a1 1 0 0 0-1 1Z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg slot="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4 3.3a.8.8 0 0 0 1.4-.6V5.8a.8.8 0 0 0-1.4-.6l-4 3.3H5a1 1 0 0 0-1 1Z" fill="currentColor"/><path d="m16.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></media-mute-button><media-playback-rate-button notooltip rates="1 1.25 1.5 2"></media-playback-rate-button>
      <media-captions-button notooltip><svg slot="on" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="3" fill="currentColor"/><path d="M10.5 10.3a2 2 0 1 0 0 3.4M16.5 10.3a2 2 0 1 0 0 3.4" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg><svg slot="off" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M10.5 10.3a2 2 0 1 0 0 3.4M16.5 10.3a2 2 0 1 0 0 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></media-captions-button>
      <media-fullscreen-button notooltip><svg slot="enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/></svg><svg slot="exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4M20 9h-3.5A1.5 1.5 0 0 1 15 7.5V4M15 20v-3.5a1.5 1.5 0 0 1 1.5-1.5H20M4 15h3.5A1.5 1.5 0 0 1 9 16.5V20" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/></svg></media-fullscreen-button>
    </div>
  </div>
</media-controller>
</template>
