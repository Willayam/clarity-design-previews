</style></head><body><div class="shell"><aside class="sidebar"><div class="logo">◉ Clarity</div><div class="nav active">⌂ &nbsp; Home</div><div class="nav">&nbsp; &nbsp; Pages</div><div class="nav">&nbsp; &nbsp; Videos</div><div class="nav">&nbsp; &nbsp; Images</div><div class="nav">Learn</div><div class="nav">Contacts</div><div class="nav">Settings</div></aside><main class="library"><div class="topline"><h2>Home</h2><button class="new" onclick="document.body.classList.remove('closed')">Open statistics</button></div><div class="search">Search this workspace</div><h3>Journey Pages</h3><div class="librarycards" id="librarycards"></div></main></div><div class="veil"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="heading"><header class="modal-head"><div><h1 id="heading">Statistics</h1><p class="page-name" id="page-name"></p></div><button class="close" aria-label="Close statistics" onclick="document.body.classList.add('closed')">×</button></header><div id="content"></div></section></div><nav class="switcher" aria-label="Design variations"><span class="source" id="source"></span><button class="arrow" onclick="cycle(-1)" aria-label="Previous variation">←</button><button id="switchA" onclick="choose('A')">A · Overview</button><button id="switchB" onclick="choose('B')">B · Explore</button><button id="switchC" onclick="choose('C')">C · Visits</button><button class="arrow" onclick="cycle(1)" aria-label="Next variation">→</button></nav><script src="data.js"></script><script>
// Throwaway question: how can a mini page preview add useful context without overloading statistics?
const d=window.SNAPSHOT;let variant=new URLSearchParams(location.search).get('variant')||'A',elementView='video',selected=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');const pct=s=>Math.round(s.watched/s.videoDuration*100);const date=s=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',timeZone:'Europe/Stockholm'}).format(new Date(s));const plays=d.sessions.filter(s=>s.watched>0).length,clicks=d.sessions.filter(s=>s.clicked).length,duration=d.sessions[0].videoDuration;
function mini(mode='static'){const s=d.sessions[selected],v=mode==='visit'?Number(s.watched>0):plays,c=mode==='visit'?Number(s.clicked):clicks;return `<div class="mini-wrap"><div class="mini ${mode==='explore'?'selected-'+elementView:''}"><div class="browserbar"><i></i><i></i><i></i><span>clarity.video</span></div><div class="paper"><div class="brandline"></div><h2>${esc(d.hero)}</h2><button class="preview-video ${mode==='visit'?(v?'active-target':'quiet-target'):''}" onclick="elementView='video';${mode!=='explore'?"choose('B')":"render()"}" aria-label="Inspect video activity">${d.poster?`<img src="${esc(d.poster)}" alt="">`:''}<span class="play-dot">▶</span>${mode!=='static'&&v?`<span class="pin">${mode==='visit'?'✓':v}</span>`:''}</button><div class="copy-lines"><i></i><i></i><i></i></div><button class="preview-cta ${mode==='visit'?(c?'active-target':'quiet-target'):''}" onclick="elementView='cta';${mode!=='explore'?"choose('B')":"render()"}" aria-label="Inspect button clicks">${esc(d.cta)}${mode!=='static'&&c?`<span class="pin">${mode==='visit'?'✓':c}</span>`:''}</button><div class="logos"><i></i><i></i><i></i><i></i></div>${d.blocks.filter(b=>b.kind==='story').slice(0,2).map(b=>`<div class="mini-section"><h3>${esc(b.title)}</h3><div class="copy-lines"><i></i><i></i><i></i></div></div>`).join('')}</div></div>${mode==='visit'?`<p class="selected-caption">Activity for <b>visit ${selected+1}</b></p>`:`<p class="preview-caption">${mode==='explore'?'Select the video or button':'Page preview'}</p>`}</div>`}
function metrics(){return `<div class="measures"><div class="measure"><strong>${d.sessions.length}</strong><span>Page visits</span></div><div class="measure"><strong>${plays}</strong><span>Watched video</span></div><div class="measure"><strong>${clicks}</strong><span>Clicked button</span></div></div>`}
function graph(){return `<div class="graph"><div class="graph-area" title="${plays} visit with recorded watch progress"></div><div class="graph-axis"></div><div class="ticks">${[0,.25,.5,.75,1].map(x=>`<span>${fmt(duration*x)}</span>`).join('')}</div></div>`}
function watched(s){return s.watched?`<span class="watch-inline"><span class="rail"><i style="width:${pct(s)}%"></i></span>${pct(s)}%</span>`:'<span class="none">No progress</span>'}
function table(){return `<div class="visits"><div class="table-head"><span>Visit</span><span class="when">When</span><span>Video watched</span><span>Button</span></div>${d.sessions.map(s=>`<div class="table-row"><span class="place" title="${esc(s.location)}">${esc(s.location)}</span><span class="when">${date(s.date)}</span>${watched(s)}<span>${s.clicked?`<span class="yes" title="${esc(d.cta)}"><i>✓</i> Clicked</span>`:'<span class="none">No click</span>'}</span></div>`).join('')}</div>`}
function overview(){return `<div class="overview">${mini()}<div><div class="page-identity"><span class="page-icon">▤</span><span>1 video · ${esc(d.cta)}</span></div>${metrics()}<h2 class="section-title">Video engagement <small>${fmt(duration)}</small></h2>${graph()}<p class="watch-summary"><i class="blue-dot"></i>${plays} of ${d.sessions.length} visits watched the video</p><div class="action-strip"><div>${esc(d.cta)}<br><span>Page button</span></div><div class="action-count">${clicks}</div></div></div></div>${table()}`}
function explore(){return `<div class="explore">${mini('explore')}<div>${metrics()}<nav class="segmented" aria-label="Page element"><button class="${elementView==='video'?'selected':''}" onclick="elementView='video';render()">Video</button><button class="${elementView==='cta'?'selected':''}" onclick="elementView='cta';render()">Button</button></nav>${elementView==='video'?`<div class="focus-head"><div><h2>Introduction video</h2><p>${fmt(duration)} · ${plays} recorded play</p></div><span class="soft-label">On this page</span></div>${graph()}<p class="watch-summary"><i class="blue-dot"></i>${plays} visit watched almost all of it</p>`:`<div class="focus-head"><div><h2>${esc(d.cta)}</h2><p>Primary page button</p></div><span class="soft-label">Button clicks</span></div><div class="click-summary"><strong>${clicks}</strong><span>of ${d.sessions.length} visits<br>clicked this button</span></div><div class="click-bars">${d.sessions.map(s=>`<i class="${s.clicked?'on':''}"></i>`).join('')}</div>`}<div class="focus-list">${d.sessions.map(s=>`<div class="focus-row"><div class="place">${esc(s.location)}<span class="when">${date(s.date)}</span></div>${elementView==='video'?s.watched?`<span class="yes">${pct(s)}% watched</span>`:'<span class="none">No progress</span>':s.clicked?'<span class="yes"><i>✓</i> Clicked</span>':'<span class="none">No click</span>'}</div>`).join('')}</div></div></div>`}
function follow(){return `<div class="follow"><div>${metrics()}${d.sessions.map((s,i)=>`<button class="visitor-card ${selected===i?'selected':''}" onclick="selected=${i};render()" aria-pressed="${selected===i}"><div class="visit-top"><div><div class="visit-place">${esc(s.location)}</div><div class="visit-date">${date(s.date)} · Visit ${i+1}</div></div><i class="radio"></i></div><div class="visit-event ${s.watched?'':'muted'}"><span class="symbol">▷</span>${s.watched?`Watched ${fmt(s.watched)} of ${fmt(s.videoDuration)}`:'No video watch progress'}</div>${s.watched?`<div class="rail"><i style="width:${pct(s)}%"></i></div>`:''}<div class="visit-event ${s.clicked?'':'muted'}"><span class="symbol">↗</span>${s.clicked?esc(d.cta):'No button click'}</div></button>`).join('')}<p class="context-note">Select a visit to see its activity on the page.</p></div>${mini('visit')}</div>`}
function render(){if(!['A','B','C'].includes(variant))variant='A';document.getElementById('content').innerHTML=variant==='A'?overview():variant==='B'?explore():follow();document.getElementById('page-name').textContent=d.title;document.getElementById('source').textContent=d.real?'Real snapshot':'Sample data';for(const k of ['A','B','C']){document.getElementById('switch'+k).className=k===variant?'active':'';document.getElementById('switch'+k).setAttribute('aria-current',k===variant?'true':'false')}}function choose(k){variant=k;const url=new URL(location);url.searchParams.set('variant',k);history.replaceState({},'',url);render();document.querySelector('.modal').scrollTop=0}function cycle(n){choose(['A','B','C'][(['A','B','C'].indexOf(variant)+n+3)%3])}document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,[contenteditable=true]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1);if(e.key==='Escape')document.body.classList.add('closed')});document.getElementById('librarycards').innerHTML=[d.title,'A personal introduction','Your next proposal'].map(t=>`<article class="librarycard"><div class="tile">${esc(t)}</div><h4>${esc(t)}</h4><button onclick="document.body.classList.remove('closed')">View statistics ↗</button></article>`).join('');render();
</script></body></html>
