<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notifications</title>
<link rel="stylesheet" href="../_shared/app.css" />
<style>body { font-family: var(--font-sans); }</style>

</head>
<body>

  <div class="min-h-svh bg-(image:--shell-frame) p-6">
    <div class="max-w-3xl" data-crop>
      
  <div data-slot="card" data-size="default" class="group/card flex flex-col gap-4 overflow-hidden rounded-xl bg-card py-4 text-sm text-card-foreground ring-1 ring-foreground/10 has-data-[slot=card-footer]:pb-0">
    <div data-slot="card-header" class="group/card-header @container/card-header grid auto-rows-min items-start gap-1 rounded-t-xl px-4 has-data-[slot=card-action]:grid-cols-[1fr_auto] has-data-[slot=card-description]:grid-rows-[auto_auto]">
      <div data-slot="card-title" class="font-heading text-base leading-snug font-medium">Notifications</div>
      
    </div>
    <div data-slot="card-content" class="px-4">
    <div class="flex items-start justify-between gap-4">
      <div class="space-y-1">
        <label data-slot="label" class="flex items-center gap-2 font-medium select-none text-sm leading-none" id="view-email-label">Email me when someone watches a page</label>
        <p class="text-sm text-muted-foreground">The first email arrives when they start watching. After that, at most one email an hour with how far they got and which buttons they clicked.</p>
      </div>
      <span data-checked="" role="switch" aria-checked="true" aria-labelledby="view-email-label" data-slot="switch" data-size="default" class="peer group/switch relative inline-flex shrink-0 items-center rounded-full border border-transparent transition-all outline-none data-[size=default]:h-[18.4px] data-[size=default]:w-[32px] data-checked:bg-primary data-unchecked:bg-input"><span data-checked="" data-slot="switch-thumb" class="pointer-events-none block rounded-full bg-background ring-0 transition-transform group-data-[size=default]/switch:size-4 group-data-[size=default]/switch:data-checked:translate-x-[calc(100%-2px)]"></span></span>
    </div>
        <div class="mt-4 flex items-center gap-2 border-t pt-3 text-sm text-muted-foreground">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mouse-pointer-click size-4 shrink-0" aria-hidden="true"><path d="M14 4.1 12 6"></path><path d="m5.1 8-2.9-.8"></path><path d="m6 12-1.9 2"></path><path d="M7.2 2.2 8 5.1"></path><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"></path></svg>
          <p>Button clicks are included in the same email.</p>
        </div></div>
    
  </div>
    </div>
  </div>
</body>
</html>
