<script>
const Kit = window.RecorderKit
const state = Kit.store({ layout: "inset" })
const LAYOUT_IDS = { recorder_layout_camera_only: "camera", recorder_layout_camera_beside_screen: "split", recorder_layout_camera_inset_screen: "inset", recorder_layout_screen_only: "screen" }
const BG = ["keep", "blur", "blue", "slate"]
function render() {
  const name = location.hash === "#style" ? "style" : "recorder"
  document.body.replaceChildren(document.getElementById(name).content.cloneNode(true), ...[...document.querySelectorAll("template")])
  const preview = document.querySelector('[data-slot="recorder-preview"]'); preview?.setAttribute("data-part", "preview")
  const controls = document.querySelector('[data-slot="recorder-preview"] ~ aside') ?? document.querySelector("section[aria-label='Style']"); controls?.setAttribute("data-part", "controls")
  const paint = () => document.querySelectorAll("[data-kit-scene]").forEach((el) => Kit.scene(el, state.get()))
  paint()
  document.querySelectorAll("button[data-analytics-id^='recorder_layout_']").forEach((tile) => tile.addEventListener("click", () => {
    state.set({ layout: LAYOUT_IDS[tile.dataset.analyticsId] })
    document.querySelectorAll("button[data-analytics-id^='recorder_layout_']").forEach((other) => other.setAttribute("aria-pressed", String(other === tile)))
    paint()
  }))
  document.querySelector("select[aria-label='Room']")?.addEventListener("change", (event) => { state.set({ background: BG[Number(event.target.value)] }); paint() })
  document.querySelector("select[aria-label='Camera shape']")?.addEventListener("change", (event) => { state.set({ shape: event.target.value }); paint() })
}
window.addEventListener("hashchange", render)
render()
</script><script src="../_lab/runtime.js" data-lab-runtime defer></script></body></html>
