<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clarity · Statistics preview</title><style>
@font-face{font-family:Geist;src:url('assets/geist.woff2')}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Geist,sans-serif;color:#0f172a;background:#f1f5f9}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:focus-visible{outline:2px solid #2563eb;outline-offset:3px}h1,h2,h3,p{margin:0}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid #e2e8f0;padding:24px 16px}.logo{font-size:24px;font-weight:700;color:#2563eb;margin-bottom:36px}.navitem{padding:12px;border-radius:8px;color:#64748b}.navitem.active{background:#e2e8f0;color:#0f172a}.library{padding:24px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.toolbar h2{font-size:28px}.new{background:#2563eb;color:white;padding:9px 14px;border-radius:8px}.search{background:white;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;color:#64748b;margin-bottom:36px;max-width:440px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:14px}.tile{height:160px;border:1px solid #e2e8f0;background:#fff;border-radius:16px;display:grid;place-items:center;padding:20px;text-align:center;color:#64748b}.card h3{font-size:16px;margin-top:10px}.card p{font-size:12px;color:#64748b;margin-top:4px}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px}.modal{width:928px;max-width:100%;max-height:90vh;overflow:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:24px;box-shadow:0 10px 30px #0002;position:relative}h1{font-size:18px;line-height:24px;font-weight:600;padding-right:24px}.close{position:absolute;right:16px;top:14px;font-size:21px;color:#64748b;padding:0 4px}.summary{font-size:14px;color:#64748b;margin-top:6px;margin-bottom:16px}.summary b{color:#0f172a;font-weight:600}.stage{display:grid;grid-template-columns:152px 72px minmax(0,1fr) 40px 48px;column-gap:12px;position:relative}.preview{grid-column:1 / 3;align-self:end;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(125deg,#3b554c,#9bad9f)}.preview img{width:100%;height:100%;object-fit:cover;display:block}.chart{grid-column:3;align-self:end;position:relative;min-width:0}.curve{height:74px;background:linear-gradient(#2563eb38,#2563eb06);border-top:2px solid #3566f6}.axis{height:4px;background:#0f172a;border-radius:4px;margin-top:4px;position:relative}.handle{position:absolute;left:var(--at,0%);top:50%;width:14px;height:14px;border-radius:50%;background:#0f172a;transform:translate(-50%,-50%)}.ruler{grid-column:3;display:flex;justify-content:space-between;font-size:12px;line-height:16px;font-weight:600;color:#64748b;margin-top:3px}.head{display:grid;grid-column:1/-1;grid-template-columns:subgrid;border-bottom:1px solid #e2e8f0;margin-top:10px;padding-bottom:5px;align-items:center}.head button{font-size:12px;font-weight:500;padding:0;text-align:left;color:#64748b;white-space:nowrap}.head .when{text-align:right}.head .percentage{text-align:right}.head .clicked{text-align:center}.row{display:grid;grid-column:1/-1;grid-template-columns:subgrid;align-items:center;min-height:23px;font-size:12px;line-height:16px}.row:hover{background:#e9edf3}.location{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.when{text-align:right;color:#64748b}.watch{position:relative;height:16px;display:flex;align-items:center}.watch .line{height:2px;background:#93aff6;position:relative}.line:after{content:'';position:absolute;right:0;top:50%;width:5px;height:5px;transform:translateY(-50%);border-radius:50%;background:#93aff6}.no-watch{font-size:11px;color:#64748b;white-space:nowrap}.percentage{text-align:right;font-weight:600}.clicked{text-align:center;color:#475569;position:relative}.check{font-size:14px;padding:0 8px;line-height:20px}.check::after{content:attr(data-label);display:none;position:absolute;right:0;bottom:100%;padding:6px 9px;border-radius:5px;background:#0f172a;color:white;font-size:11px;white-space:nowrap;z-index:5}.check:hover::after,.check:focus-visible::after,.check[aria-expanded=true]::after{display:block}.readout{display:none;position:absolute;left:var(--at,0%);top:-30px;transform:translateX(-50%);background:#f8fafc;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 2px 5px #0001;padding:3px 8px;font-size:11px;white-space:nowrap;z-index:2}.chart:hover .readout{display:block}.closed .overlay{display:none}.demo{position:fixed;bottom:12px;right:16px;font-size:11px;color:#64748b}.mobile-date{display:none}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{display:none}.cards{grid-template-columns:1fr}.card:not(:first-child){display:none}.overlay{padding:8px}.modal{padding:24px 18px}.summary{font-size:12px;line-height:1.7}.stage{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 34px 42px;column-gap:8px}.preview{grid-column:1/-1;width:100%;margin-bottom:18px}.chart{grid-column:1/-1}.ruler{grid-column:1/-1;font-size:10px}.ruler span:nth-child(even){display:none}.when{display:none}.head{margin-top:12px}.head button{font-size:11px}.row{min-height:37px;font-size:11px}.location{white-space:normal;line-height:14px}.mobile-date{display:block;font-size:10px;color:#64748b}.no-watch{font-size:10px;white-space:normal;line-height:12px}.curve{height:60px}.readout{transform:none}.demo{font-size:10px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="logo">◉ Clarity</div><div class="navitem active">⌂ &nbsp; Home</div><div class="navitem">&nbsp; &nbsp; Pages</div><div class="navitem">&nbsp; &nbsp; Videos</div><div class="navitem">&nbsp; &nbsp; Images</div><div class="navitem">&nbsp; &nbsp; Documents</div><div class="navitem">Learn</div><div class="navitem">Contacts</div><div class="navitem">Settings</div></aside><main class="library"><div class="toolbar"><h2>Home</h2><button class="new" onclick="document.body.classList.remove('closed')">Open statistics</button></div><div class="search">Search this workspace</div><h3>Journey Pages</h3><div class="cards" id="cards"></div></main></div><div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><h1 id="title">Statistics</h1><button class="close" aria-label="Close statistics" onclick="document.body.classList.add('closed')">×</button><p class="summary" id="summary"></p><div class="stage"><div class="preview" id="preview"></div><div class="chart" id="chart"><div class="readout" id="readout"></div><div class="curve"></div><div class="axis"><i class="handle"></i></div></div><div class="ruler" id="ruler"></div><div class="head"><button onclick="sortRows('location')">Where</button><button class="when" onclick="sortRows('date')">When</button><button onclick="sortRows('watched')">Watched</button><button class="percentage" onclick="sortRows('watched')">% ↓</button><button class="clicked" onclick="sortRows('clicked')">Clicked</button></div><div id="rows" style="display:contents"></div></div></section></div><div class="demo" id="demo"></div><script src="data.js"></script><script>
const d=window.SNAPSHOT;let order='watched',direction=-1;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');const date=s=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',timeZone:'Europe/Stockholm'}).format(new Date(s));const pct=s=>Math.round(s.watched/s.videoDuration*100);const duration=d.sessions[0].videoDuration;
document.getElementById('summary').innerHTML=`<b>${d.sessions.length} visits</b> · ${d.sessions.filter(s=>s.watched>0).length} watched video · ${d.sessions.filter(s=>s.clicked).length} clicked the button`;document.getElementById('title').title=d.title;document.getElementById('preview').innerHTML=d.poster?`<img src="${esc(d.poster)}" alt="Video preview">`:'';document.getElementById('ruler').innerHTML=[0,.25,.5,.75,1].map(r=>`<span>${time(duration*r)}</span>`).join('');
function renderRows(){const sessions=[...d.sessions].sort((a,b)=>direction*(typeof a[order]==='string'?a[order].localeCompare(b[order]):Number(a[order])-Number(b[order])));document.getElementById('rows').innerHTML=sessions.map(s=>`<div class="row"><span class="location" title="${esc(s.location)}">${esc(s.location)}<span class="mobile-date">${date(s.date)}</span></span><span class="when">${date(s.date)}</span><span class="watch">${s.watched?`<i class="line" style="width:${pct(s)}%"></i>`:'<span class="no-watch">No watch progress</span>'}</span><span class="percentage">${s.watched?pct(s)+'%':'—'}</span><span class="clicked">${s.clicked?`<button class="check" aria-label="Clicked ${esc(d.cta)}" data-label="${esc(d.cta)}" aria-expanded="false" onclick="this.setAttribute('aria-expanded',this.getAttribute('aria-expanded')!=='true')">✓</button>`:'—'}</span></div>`).join('');document.querySelector('.head .percentage').textContent='%'+(order==='watched'?(direction<0?' ↓':' ↑'):'')}
function sortRows(key){direction=order===key?-direction:(key==='location'?1:-1);order=key;renderRows()};renderRows();document.getElementById('chart').addEventListener('pointermove',e=>{const r=e.currentTarget.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));e.currentTarget.style.setProperty('--at',ratio*100+'%');const n=d.sessions.filter(s=>s.watched>ratio*duration).length;document.getElementById('readout').textContent=time(ratio*duration)+' · '+n+(n===1?' viewer':' viewers')});document.getElementById('cards').innerHTML=[d.title,'Your next proposal','A personal introduction'].map(t=>`<article class="card"><div class="tile">${esc(t)}</div><h3>${esc(t)}</h3><p><button onclick="document.body.classList.remove('closed')">View statistics ↗</button></p></article>`).join('');document.getElementById('demo').textContent=d.real?'':'Layout example · Fictional data';document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.add('closed')});
</script></body></html>
