<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clarity · Page statistics</title><style>
@font-face{font-family:Geist;src:url('assets/geist.woff2')}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Geist,sans-serif;color:#0f172a;background:#f1f5f9}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2563eb;outline-offset:3px}button{border:0;background:none}h1,h2,h3,p{margin:0}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid #e2e8f0;padding:24px 16px}.logo{font-size:24px;font-weight:700;color:#2563eb;margin-bottom:36px}.navitem{padding:12px;border-radius:8px;color:#64748b}.navitem.active{background:#e2e8f0;color:#0f172a}.library{padding:24px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.toolbar h2{font-size:28px}.new{background:#2563eb;color:white;padding:9px 14px;border-radius:8px}.search{background:white;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;color:#64748b;margin-bottom:36px;max-width:440px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:14px}.card .tile{height:160px;border:1px solid #e2e8f0;background:#fff;border-radius:16px;display:grid;place-items:center;padding:20px;text-align:center;color:#64748b}.card h3{font-size:16px;margin-top:10px}.card p{font-size:12px;color:#64748b;margin-top:4px}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px}.modal{width:928px;max-width:100%;max-height:90vh;overflow:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:24px;box-shadow:0 10px 30px #0002;position:relative}.heading{padding-right:30px}h1{font-size:18px;line-height:24px;font-weight:600}.subtitle{color:#64748b;margin-top:4px;font-size:14px;overflow-wrap:anywhere}.close{position:absolute;right:16px;top:14px;font-size:21px;color:#64748b;padding:0 4px}.tabs{display:flex;gap:24px;border-bottom:1px solid #e2e8f0;margin-top:18px}.tabs button{padding:0 0 9px;font-size:13px;color:#64748b}.tabs button[aria-selected=true]{border-bottom:2px solid #2563eb;color:#0f172a;font-weight:600}.summary{font-size:14px;color:#64748b;padding:14px 0 18px}.summary b{color:#0f172a;font-weight:600}.summary .sep{margin:0 7px;color:#94a3b8}.page-grid{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px}.thumb{border:1px solid #e2e8f0;border-radius:6px;background:white;overflow:hidden;align-self:start}.browserbar{height:17px;background:#f1f5f9;color:#cbd5e1;font-size:9px;padding-left:8px;letter-spacing:2px}.thumb-content{padding:16px 14px}.thumb h2{font-size:16px;line-height:18px;text-align:center;letter-spacing:-.4px;margin-bottom:10px}.poster{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;display:block;background:linear-gradient(130deg,#37544a,#9baaa4)}.thumb-copy{font-size:7px;line-height:1.5;color:#64748b;margin-top:10px}.thumb-action{border-radius:3px;background:#4338ca;color:white;padding:6px;text-align:center;font-size:8px;margin-top:9px}.caption{font-size:11px;color:#64748b;margin-top:7px}.blocks h2{font-size:12px;font-weight:500;color:#64748b;margin:0 0 5px;display:flex;justify-content:space-between}.block{display:grid;grid-template-columns:18px minmax(0,1fr) 78px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #e2e8f0;font-size:12px;line-height:16px}.block:last-child{border:0}.ordinal{color:#94a3b8;font-variant-numeric:tabular-nums}.not-recorded{color:#94a3b8;text-align:right;font-size:11px}.info{font-size:11px;color:#64748b;background:#eef2f7;padding:9px 10px;border-radius:5px;margin-top:10px;line-height:1.45}.visit-heading{font-size:12px;font-weight:500;margin:20px 0 8px}.visits-head,.visit-row{display:grid;grid-template-columns:minmax(160px,1.6fr) 1fr .75fr 1fr minmax(140px,1.4fr) 16px;gap:12px;align-items:center;text-align:left;width:100%;font-size:12px}.visits-head{color:#64748b;border-bottom:1px solid #e2e8f0;padding:0 0 6px}.visit-row{padding:10px 0;border-bottom:1px solid #e2e8f0}.visit-row:hover,.visit-row[aria-expanded=true]{background:#eef2f7}.location{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:#64748b}.watchcell{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}.track{height:3px;background:#e2e8f0;min-width:35px;flex:1}.track i{display:block;height:100%;background:#93aff6}.action{color:#0f172a;font-size:11px}.details{padding:12px 12px 4px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;display:grid;grid-template-columns:1fr 220px;gap:20px}.event{font-size:12px;display:flex;gap:12px;padding-bottom:10px}.event time{color:#64748b;font-size:11px;width:37px;flex-shrink:0;font-variant-numeric:tabular-nums}.event small{display:block;font-size:10px;color:#64748b}.details-note{font-size:11px;color:#64748b}.footnote{font-size:10px;color:#64748b;margin-top:12px;line-height:1.5}.sourcebar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);border-radius:8px;padding:8px 12px;font-size:11px;color:#e2e8f0;background:#0f172a;max-width:calc(100% - 20px);text-align:center;white-space:nowrap;z-index:3}.video-grid{display:grid;grid-template-columns:236px 1fr;gap:12px;align-items:end}.retention{height:90px;position:relative;background:linear-gradient(#9eb7f588,#eaf0fc44);border-top:2px solid #3265eb}.axis{height:4px;background:#0f172a;border-radius:4px;margin-top:4px}.ticks{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-top:3px}.video-label{font-size:11px;color:#64748b;margin-bottom:8px}.video-rows{margin-top:16px}.video-rows .visits-head,.video-rows .visit-row{grid-template-columns:152px 72px 1fr 48px;gap:12px}.closed .overlay{display:none}.closed .sourcebar{display:none}.phone-only{display:none}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{display:none}.cards{grid-template-columns:1fr}.card:not(:first-child){display:none}.overlay{padding:8px}.modal{padding:20px 16px;max-height:calc(100dvh - 78px)}.subtitle{font-size:12px}.summary{font-size:12px;line-height:1.8;padding:12px 0}.page-grid{grid-template-columns:1fr;gap:14px}.thumb{display:none}.blocks .block{grid-template-columns:18px minmax(0,1fr) 70px;font-size:11px;padding:6px 0}.visits-head,.visit-row{grid-template-columns:minmax(0,1fr) 74px 14px;gap:8px}.mobile-hide{display:none}.phone-only{display:block;font-size:10px;color:#64748b;margin-top:2px}.location{white-space:normal}.visit-row{padding:10px 0}.details{grid-template-columns:1fr;gap:5px}.sourcebar{font-size:10px;bottom:9px;white-space:normal;width:max-content}.video-grid{grid-template-columns:1fr}.video-grid>div:first-child{max-width:236px}.video-rows .visits-head,.video-rows .visit-row{grid-template-columns:minmax(0,1fr) 1fr 38px}.video-rows .when{display:none}.tabs{gap:20px}.footnote{font-size:10px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="logo">◉ Clarity</div><div class="navitem active">⌂ &nbsp; Home</div><div class="navitem">&nbsp; &nbsp; Pages</div><div class="navitem">&nbsp; &nbsp; Videos</div><div class="navitem">&nbsp; &nbsp; Images</div><div class="navitem">&nbsp; &nbsp; Documents</div><div class="navitem">Learn</div><div class="navitem">Contacts</div><div class="navitem">Settings</div></aside><main class="library"><div class="toolbar"><h2>Home</h2><button class="new" onclick="openStats()">Open statistics</button></div><div class="search">Search this workspace</div><h3>Journey Pages</h3><div class="cards" id="cards"></div></main></div><div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><div class="heading"><h1 id="title">Statistics</h1><p class="subtitle" id="subtitle"></p></div><button class="close" aria-label="Close statistics" onclick="document.body.classList.add('closed')">×</button><nav class="tabs" role="tablist"><button role="tab" id="pageTab" onclick="tab='page';expanded=-1;render()">Page activity</button><button role="tab" id="videoTab" onclick="tab='video';expanded=-1;render()">Video engagement</button></nav><div id="content"></div></section></div><div class="sourcebar" id="source"></div><script src="data.js"></script><script>
const d=window.SNAPSHOT;let tab='page',expanded=-1;const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clock=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');const date=s=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Stockholm'}).format(new Date(s));const percent=s=>Math.round(s.watched/s.videoDuration*100);const poster=()=>d.poster?`<img class="poster" src="${escape(d.poster)}" alt="Video preview">`:'<div class="poster"></div>';
function preview(){return `<div><div class="thumb"><div class="browserbar">● ● ●</div><div class="thumb-content"><h2>${escape(d.hero)}</h2>${poster()}<div class="thumb-copy">${escape(d.excerpt||'A personal proposal for your team, with the next steps in one place.')}</div><div class="thumb-action">${escape(d.cta)}</div></div></div><p class="caption">${d.blocks.length} blocks · 1 video</p></div>`}
function details(i){const s=d.sessions[i];return `<div class="details"><div>${s.events.map(e=>`<div class="event"><time>${clock(e.at)}</time><div>${escape(e.title)}<small>${escape(e.detail)}</small></div></div>`).join('')}</div><div class="details-note">${s.watched?'Page and video activity share the same session ID.':'The video loaded, but this visit has no recorded watched segments.'}<br><br>Time on page measures how long the page remained open. It is not active reading time.</div></div>`}
function rows(){return `<h2 class="visit-heading">Visits <span class="muted">· Select a row for activity</span></h2><div class="visits-head"><span>Where</span><span class="mobile-hide">When</span><span class="mobile-hide">Page open</span><span>Video</span><span class="mobile-hide">Button click</span><span></span></div>${d.sessions.map((s,i)=>`<button class="visit-row" aria-expanded="${expanded===i}" onclick="expanded=expanded===${i}?-1:${i};render()"><span class="location">${escape(s.location)}<span class="phone-only">${date(s.date)} · ${clock(s.duration)} on page${s.clicked?' · Button clicked':''}</span></span><span class="muted mobile-hide">${date(s.date)}</span><span class="muted mobile-hide">${clock(s.duration)}</span><span class="watchcell">${s.watched?`<span class="track"><i style="width:${percent(s)}%"></i></span>${percent(s)}%`:'<span class="muted" style="font-size:11px">No progress</span>'}</span><span class="action mobile-hide">${s.clicked?escape(d.cta):'<span class="muted">None recorded</span>'}</span><span class="muted">${expanded===i?'−':'+'}</span></button>${expanded===i?details(i):''}`).join('')}`}
function pageView(){return `<div class="summary"><b>${d.sessions.length} visits</b><span class="sep">·</span><b>${d.sessions.filter(s=>s.watched>0).length}</b> watched video<span class="sep">·</span><b>${d.sessions.filter(s=>s.clicked).length}</b> clicked the button</div><div class="page-grid">${preview()}<div class="blocks"><h2><span>Page blocks</span><span>Visits reached</span></h2>${d.blocks.map((b,i)=>`<div class="block"><span class="ordinal">${String(i+1).padStart(2,'0')}</span><span>${escape(b.title)}</span><span class="not-recorded">Not recorded</span></div>`).join('')}<p class="info">Block visibility was not recorded for these visits. Page visits and video plays cannot tell us which blocks were read.</p></div></div>${rows()}<p class="footnote">${d.real?'Production snapshot · Captured 21 September 2026 · All recorded visits':'Fictional example · Customer content and activity are kept in the local preview'}<br>Locations come from the matching video session. Times shown in Europe/Stockholm. A video load without watch progress is not counted as a play.</p>`}
function videoView(){const duration=d.sessions[0].videoDuration;return `<div class="summary"><b>${d.sessions.filter(s=>s.watched).length} recorded play</b><span class="sep">·</span>${d.sessions.filter(s=>!s.watched).length} loaded without watch progress<span class="sep">·</span>${clock(duration)} duration</div><div class="video-grid"><div>${poster()}</div><div><p class="video-label">Video on this page · ${d.sessions.filter(s=>s.watched).length} visit with watch progress</p><div class="retention" aria-label="One visit watched almost the entire video"></div><div class="axis"></div><div class="ticks">${[0,.25,.5,.75,1].map(f=>`<span>${clock(duration*f)}</span>`).join('')}</div></div></div><div class="video-rows"><div class="visits-head"><span>Where</span><span class="when">When</span><span>Watched</span><span style="text-align:right">%</span></div>${d.sessions.map((s,i)=>`<button class="visit-row" aria-expanded="${expanded===i}" onclick="expanded=expanded===${i}?-1:${i};render()"><span class="location">${escape(s.location)}</span><span class="when muted">${new Date(s.date).getUTCDate()} Sep</span><span class="watchcell">${s.watched?`<span class="track"><i style="width:${percent(s)}%"></i></span>`:'<span class="muted">No watch progress</span>'}</span><span style="text-align:right">${s.watched?percent(s)+'%':'—'}</span></button>${expanded===i?details(i):''}`).join('')}</div><p class="footnote">Only video events with a session ID matching a visit to this page are included.<br>Percentages are rounded. “No watch progress” means a load was recorded without any watched segment.</p>`}
function render(){document.getElementById('subtitle').textContent=d.title;document.getElementById('pageTab').setAttribute('aria-selected',tab==='page');document.getElementById('videoTab').setAttribute('aria-selected',tab==='video');document.getElementById('content').innerHTML=tab==='page'?pageView():videoView();document.getElementById('source').textContent=d.real?'Local preview · Real production snapshot · 928 px dialog':'Sizing preview · Fictional data · 928 px dialog';}function openStats(){document.body.classList.remove('closed');render()};document.getElementById('cards').innerHTML=[d.title,'Your next proposal','A personal introduction'].map(t=>`<article class="card"><div class="tile">${escape(t)}</div><h3>${escape(t)}</h3><p><button onclick="openStats()">View statistics ↗</button></p></article>`).join('');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.add('closed')});render();
</script></body></html>
