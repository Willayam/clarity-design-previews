<header class="lab-top">
  <div class="lab-brand">
    <strong>Live training banner lab</strong>
    <span class="lab-sub">20 presets, one mixer, Home page context</span>
  </div>
  <nav class="lab-views" aria-label="Views">
    <button type="button" data-view="mixer" class="is-active">Mixer</button>
    <button type="button" data-view="gallery">Gallery</button>
  </nav>
  <div class="lab-tools">
    <div class="seg" role="group" aria-label="Time state" data-dim="time"></div>
    <button type="button" class="tool" id="theme-toggle" title="Switch app theme"><svg><use href="#i-sun"/></svg><span>Dark</span></button>
    <button type="button" class="tool" id="show-again" title="Bring a dismissed banner back"><svg><use href="#i-eye"/></svg><span>Show again</span></button>
    <button type="button" class="tool" id="shuffle" title="Random valid combination"><svg><use href="#i-shuffle"/></svg><span>Shuffle</span></button>
    <button type="button" class="tool tool-primary" id="copy-link" title="Copy a link to this exact combination"><svg><use href="#i-link"/></svg><span>Copy link</span></button>
  </div>
</header>

<main id="app">
  <section id="view-mixer" class="view">
    <div class="mixer">
      <aside class="controls" id="controls"></aside>
      <div class="stage" id="stage">
        <div class="stage-block">
          <div class="stage-label">Desktop, 1440 px</div>
          <div class="frame-wrap" data-frame="desktop"><div class="frame frame-desktop" id="frame-desktop"></div></div>
        </div>
        <div class="stage-block">
          <div class="stage-label">Phone, 390 px</div>
          <div class="frame-wrap" data-frame="phone"><div class="frame frame-phone" id="frame-phone"></div></div>
        </div>
        <div class="stage-note" id="stage-note"></div>
      </div>
      <aside class="presets" id="presets"></aside>
    </div>
  </section>
  <section id="view-gallery" class="view" hidden>
    <div class="gallery" id="gallery"></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="lab-data.js"></script>
<script src="lab-render.js"></script>
<script src="lab-app.js"></script>
</body>
</html>
